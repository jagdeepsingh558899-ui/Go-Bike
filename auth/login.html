<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#0A0A0A"
    >

    <meta
        name="description"
        content="Login to Go Bike."
    >

    <title>Go Bike | Login</title>

    <link
        rel="icon"
        type="image/png"
        href="../assets/favicon.png"
    >

    <style>
        :root {
            --black: #0A0A0A;
            --black-2: #111111;
            --card: #151515;
            --yellow: #FFD600;
            --yellow-light: #FFE44D;
            --white: #FFFFFF;
            --muted: #969696;
            --muted-2: #666666;
            --border: rgba(255,255,255,.09);
            --danger: #FF5252;
            --success: #35D07F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--black);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            color: var(--white);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        button,
        input {
            font: inherit;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            padding:
                max(20px, env(safe-area-inset-top))
                20px
                max(24px, env(safe-area-inset-bottom));

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,214,0,.08),
                    transparent 32%
                ),
                var(--black);
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* =========================================
           TOPBAR
        ========================================== */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 48px;
        }

        .back-button {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid var(--border);
            border-radius: 14px;

            background: rgba(255,255,255,.035);
            color: var(--white);

            cursor: pointer;

            font-size: 20px;
        }

        .back-button:active {
            transform: scale(.94);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .brand img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .brand strong {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -.7px;
        }

        .brand span {
            color: var(--yellow);
        }

        .spacer {
            width: 42px;
        }

        /* =========================================
           TITLE
        ========================================== */

        .title {
            margin-bottom: 25px;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 7px 11px;

            margin-bottom: 14px;

            border: 1px solid rgba(255,214,0,.16);
            border-radius: 999px;

            background: rgba(255,214,0,.06);

            color: var(--yellow);

            font-size: 11px;
            font-weight: 850;
            letter-spacing: .4px;
            text-transform: uppercase;
        }

        .title h1 {
            font-size: clamp(32px, 9vw, 44px);
            line-height: .98;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .title h1 span {
            color: var(--yellow);
        }

        .title p {
            margin-top: 11px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.5;
        }

        /* =========================================
           CARD
        ========================================== */

        .card {
            padding: 20px;

            border: 1px solid var(--border);
            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.015)
                );

            box-shadow:
                0 25px 70px rgba(0,0,0,.32);
        }

        /* =========================================
           ALERT
        ========================================== */

        .alert {
            display: none;

            margin-bottom: 15px;

            padding: 11px 12px;

            border: 1px solid rgba(255,82,82,.22);
            border-radius: 12px;

            background: rgba(255,82,82,.07);

            color: #FF9B9B;

            font-size: 12px;
            line-height: 1.45;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            border-color: rgba(53,208,127,.22);
            background: rgba(53,208,127,.07);
            color: #8AE6B4;
        }

        /* =========================================
           LOGIN TABS
        ========================================== */

        .login-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;

            padding: 4px;

            margin-bottom: 20px;

            border: 1px solid var(--border);
            border-radius: 14px;

            background: rgba(0,0,0,.22);
        }

        .login-tab {
            min-height: 40px;

            border: 0;
            border-radius: 10px;

            background: transparent;
            color: #777;

            cursor: pointer;

            font-size: 11px;
            font-weight: 850;

            transition:
                background .2s ease,
                color .2s ease;
        }

        .login-tab.active {
            background: var(--yellow);
            color: #111;
        }

        /* =========================================
           FIELDS
        ========================================== */

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            color: #D8D8D8;

            font-size: 12px;
            font-weight: 750;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: #777;

            font-size: 15px;

            pointer-events: none;
        }

        .input {
            width: 100%;
            height: 52px;

            padding: 0 14px 0 43px;

            border: 1px solid var(--border);
            border-radius: 15px;

            outline: none;

            background: rgba(0,0,0,.2);
            color: var(--white);

            font-size: 14px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .input::placeholder {
            color: #626262;
        }

        .input:focus {
            border-color: rgba(255,214,0,.6);

            box-shadow:
                0 0 0 3px rgba(255,214,0,.07);
        }

        .input.invalid {
            border-color: rgba(255,82,82,.65);
        }

        .password-toggle {
            position: absolute;
            right: 9px;
            top: 50%;

            width: 36px;
            height: 36px;

            transform: translateY(-50%);

            border: 0;
            border-radius: 10px;

            background: transparent;
            color: #777;

            cursor: pointer;
        }

        .phone-row {
            display: grid;
            grid-template-columns: 88px 1fr;
            gap: 8px;
        }

        .country-code {
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid var(--border);
            border-radius: 15px;

            background: rgba(0,0,0,.2);

            color: var(--white);

            font-size: 13px;
            font-weight: 750;
        }

        .phone-row .input {
            padding-left: 14px;
        }

        /* =========================================
           FORGOT
        ========================================== */

        .forgot-row {
            display: flex;
            justify-content: flex-end;

            margin-top: -5px;
            margin-bottom: 17px;
        }

        .forgot-button {
            border: 0;

            background: transparent;
            color: var(--yellow);

            cursor: pointer;

            font-size: 11px;
            font-weight: 750;
        }

        /* =========================================
           PRIMARY BUTTON
        ========================================== */

        .primary-button {
            width: 100%;
            min-height: 53px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 15px;

            background: var(--yellow);
            color: #111;

            cursor: pointer;

            font-size: 14px;
            font-weight: 900;

            transition:
                transform .2s ease,
                background .2s ease,
                opacity .2s ease;
        }

        .primary-button:hover {
            background: var(--yellow-light);
        }

        .primary-button:active {
            transform: scale(.985);
        }

        .primary-button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .button-loader {
            display: none;

            width: 19px;
            height: 19px;

            border: 2px solid rgba(0,0,0,.2);
            border-top-color: #111;

            border-radius: 50%;

            animation: spin .7s linear infinite;
        }

        .primary-button.loading .button-text {
            display: none;
        }

        .primary-button.loading .button-loader {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================
           OTP
        ========================================== */

        .otp-section {
            display: none;
        }

        .otp-section.visible {
            display: block;
        }

        .otp-info {
            margin-bottom: 14px;

            color: #888;

            font-size: 11px;
            line-height: 1.5;
        }

        .otp-input {
            letter-spacing: 7px;
            text-align: center;
            font-size: 20px;
            font-weight: 850;
        }

        .otp-actions {
            display: flex;
            justify-content: space-between;

            margin-top: 10px;
        }

        .text-button {
            border: 0;

            background: transparent;
            color: var(--yellow);

            cursor: pointer;

            font-size: 11px;
            font-weight: 800;
        }

        /* =========================================
           DIVIDER
        ========================================== */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: var(--border);
        }

        .divider span {
            color: #666;

            font-size: 10px;
            font-weight: 800;
            letter-spacing: .8px;
            text-transform: uppercase;
        }

        /* =========================================
           GOOGLE
        ========================================== */

        .google-button {
            width: 100%;
            min-height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            border: 1px solid var(--border);
            border-radius: 15px;

            background: rgba(255,255,255,.035);
            color: var(--white);

            cursor: pointer;

            font-size: 13px;
            font-weight: 800;

            transition:
                background .2s ease,
                border-color .2s ease;
        }

        .google-button:hover {
            border-color: rgba(255,255,255,.18);
            background: rgba(255,255,255,.065);
        }

        .google-icon {
            width: 19px;
            height: 19px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #fff;
            color: #4285F4;

            font-size: 13px;
            font-weight: 900;
        }

        /* =========================================
           REGISTER
        ========================================== */

        .register-link {
            margin-top: 20px;

            color: #777;

            font-size: 12px;
            text-align: center;
        }

        .register-link a {
            color: var(--yellow);
            font-weight: 800;
        }

        /* =========================================
           FOOTER
        ========================================== */

        .footer {
            margin-top: 22px;

            color: #555;

            font-size: 10px;
            font-weight: 600;

            text-align: center;
        }

        @media (min-width: 700px) {

            .page {
                padding-left: 40px;
                padding-right: 40px;
            }

            .card {
                padding: 27px;
            }

        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }

        }
    </style>
</head>

<body>

<div class="page">

    <div class="container">

        <!-- =====================================
             TOPBAR
        ====================================== -->

        <header class="topbar">

            <button
                id="backButton"
                class="back-button"
                type="button"
                aria-label="Go back"
            >
                ←
            </button>

            <div class="brand">

                <img
                    src="../assets/logo.svg"
                    alt="Go Bike"
                    onerror="this.onerror=null;this.src='../assets/logo.png';"
                >

                <strong>
                    GO <span>BIKE</span>
                </strong>

            </div>

            <div class="spacer"></div>

        </header>


        <!-- =====================================
             TITLE
        ====================================== -->

        <section class="title">

            <div
                id="roleBadge"
                class="role-badge"
            >
                👤 Customer
            </div>

            <h1>
                Welcome<br>
                <span>back.</span>
            </h1>

            <p id="description">
                Login to continue with Go Bike.
            </p>

        </section>


        <!-- =====================================
             CARD
        ====================================== -->

        <section class="card">

            <div
                id="alert"
                class="alert"
                role="alert"
            ></div>


            <!-- LOGIN METHOD -->

            <div class="login-tabs">

                <button
                    id="emailTab"
                    class="login-tab active"
                    type="button"
                >
                    Email
                </button>

                <button
                    id="phoneTab"
                    class="login-tab"
                    type="button"
                >
                    Mobile OTP
                </button>

            </div>


            <!-- =================================
                 EMAIL LOGIN
            ================================== -->

            <form
                id="emailForm"
                novalidate
            >

                <div class="field">

                    <label for="email">
                        Email address
                    </label>

                    <div class="input-wrap">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            id="email"
                            class="input"
                            type="email"
                            inputmode="email"
                            autocomplete="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrap">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            id="password"
                            class="input"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            id="passwordToggle"
                            class="password-toggle"
                            type="button"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="forgot-row">

                    <button
                        id="forgotPassword"
                        class="forgot-button"
                        type="button"
                    >
                        Forgot password?
                    </button>

                </div>


                <button
                    id="emailLoginButton"
                    class="primary-button"
                    type="submit"
                >

                    <span class="button-text">
                        Login
                    </span>

                    <span class="button-loader"></span>

                </button>

            </form>


            <!-- =================================
                 PHONE LOGIN
            ================================== -->

            <form
                id="phoneForm"
                class="otp-section"
                novalidate
            >

                <div
                    id="phoneStep"
                >

                    <div class="field">

                        <label for="phone">
                            Mobile number
                        </label>

                        <div class="phone-row">

                            <div class="country-code">
                                +91 🇮🇳
                            </div>

                            <input
                                id="phone"
                                class="input"
                                type="tel"
                                inputmode="numeric"
                                autocomplete="tel"
                                placeholder="10-digit mobile number"
                                maxlength="10"
                            >

                        </div>

                    </div>


                    <div
                        id="recaptcha-container"
                    ></div>


                    <button
                        id="sendOtpButton"
                        class="primary-button"
                        type="button"
                    >

                        <span class="button-text">
                            Send OTP
                        </span>

                        <span class="button-loader"></span>

                    </button>

                </div>


                <div
                    id="otpStep"
                    style="display:none;"
                >

                    <div class="otp-info">

                        Enter the 6-digit OTP sent to
                        <strong id="otpPhone">
                            your mobile
                        </strong>.

                    </div>


                    <div class="field">

                        <label for="otp">
                            Verification code
                        </label>

                        <input
                            id="otp"
                            class="input otp-input"
                            type="text"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                            placeholder="000000"
                        >

                    </div>


                    <button
                        id="verifyOtpButton"
                        class="primary-button"
                        type="button"
                    >

                        <span class="button-text">
                            Verify & Login
                        </span>

                        <span class="button-loader"></span>

                    </button>


                    <div class="otp-actions">

                        <button
                            id="changePhone"
                            class="text-button"
                            type="button"
                        >
                            Change number
                        </button>

                        <button
                            id="resendOtp"
                            class="text-button"
                            type="button"
                        >
                            Resend OTP
                        </button>

                    </div>

                </div>

            </form>


            <!-- GOOGLE -->

            <div class="divider">
                <span>or</span>
            </div>


            <button
                id="googleButton"
                class="google-button"
                type="button"
            >

                <span class="google-icon">
                    G
                </span>

                Continue with Google

            </button>


            <!-- REGISTER -->

            <div class="register-link">

                Don't have an account?

                <a
                    id="registerLink"
                    href="register.html"
                >
                    Create account
                </a>

            </div>

        </section>


        <footer class="footer">

            ©
            <span id="year"></span>
            Go Bike

        </footer>

    </div>

</div>


<script>
(function () {

    "use strict";


    /* =========================================
       ELEMENTS
    ========================================== */

    const roleBadge =
        document.getElementById("roleBadge");

    const description =
        document.getElementById("description");

    const emailTab =
        document.getElementById("emailTab");

    const phoneTab =
        document.getElementById("phoneTab");

    const emailForm =
        document.getElementById("emailForm");

    const phoneForm =
        document.getElementById("phoneForm");

    const email =
        document.getElementById("email");

    const password =
        document.getElementById("password");

    const passwordToggle =
        document.getElementById("passwordToggle");

    const phone =
        document.getElementById("phone");

    const otp =
        document.getElementById("otp");

    const otpPhone =
        document.getElementById("otpPhone");

    const phoneStep =
        document.getElementById("phoneStep");

    const otpStep =
        document.getElementById("otpStep");

    const emailLoginButton =
        document.getElementById(
            "emailLoginButton"
        );

    const sendOtpButton =
        document.getElementById(
            "sendOtpButton"
        );

    const verifyOtpButton =
        document.getElementById(
            "verifyOtpButton"
        );

    const googleButton =
        document.getElementById(
            "googleButton"
        );

    const forgotPassword =
        document.getElementById(
            "forgotPassword"
        );

    const registerLink =
        document.getElementById(
            "registerLink"
        );

    const changePhone =
        document.getElementById(
            "changePhone"
        );

    const resendOtp =
        document.getElementById(
            "resendOtp"
        );

    const backButton =
        document.getElementById(
            "backButton"
        );

    const alertBox =
        document.getElementById(
            "alert"
        );

    const year =
        document.getElementById(
            "year"
        );


    /* =========================================
       ROLE
    ========================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    let role =
        params.get("role");


    try {

        if (
            !role
        ) {

            role =
                localStorage.getItem(
                    "goBikeRole"
                );

        }

    } catch (error) {

        // Ignore storage errors.

    }


    if (
        role !== "driver"
    ) {

        role = "customer";

    }


    try {

        localStorage.setItem(
            "goBikeRole",
            role
        );

    } catch (error) {

        // Ignore storage errors.

    }


    /* =========================================
       ROLE UI
    ========================================== */

    function updateRoleUI() {

        if (
            role === "driver"
        ) {

            roleBadge.textContent =
                "🏍️ Driver";

            description.textContent =
                "Login to go online and start accepting Go Bike deliveries.";

        } else {

            roleBadge.textContent =
                "👤 Customer";

            description.textContent =
                "Login to book a Go Bike parcel delivery.";

        }


        registerLink.href =
            "register.html?role=" +
            encodeURIComponent(
                role
            );

    }


    updateRoleUI();


    /* =========================================
       ALERT
    ========================================== */

    let alertTimer = null;


    function showAlert(
        message,
        type = "error"
    ) {

        window.clearTimeout(
            alertTimer
        );


        alertBox.textContent =
            message;


        alertBox.className =
            "alert show";


        if (
            type === "success"
        ) {

            alertBox.classList.add(
                "success"
            );

        }


        alertTimer =
            window.setTimeout(
                function () {

                    alertBox.classList.remove(
                        "show"
                    );

                },
                5000
            );

    }


    function clearAlert() {

        alertBox.className =
            "alert";

        alertBox.textContent =
            "";

    }


    /* =========================================
       LOADING
    ========================================== */

    function setLoading(
        button,
        loading
    ) {

        if (!button) {
            return;
        }


        button.disabled =
            loading;


        button.classList.toggle(
            "loading",
            loading
        );

    }


    /* =========================================
       EMAIL TAB
    ========================================== */

    emailTab.addEventListener(
        "click",
        function () {

            emailTab.classList.add(
                "active"
            );

            phoneTab.classList.remove(
                "active"
            );

            emailForm.style.display =
                "block";

            phoneForm.classList.remove(
                "visible"
            );

            clearAlert();

        }
    );


    /* =========================================
       PHONE TAB
    ========================================== */

    phoneTab.addEventListener(
        "click",
        function () {

            phoneTab.classList.add(
                "active"
            );

            emailTab.classList.remove(
                "active"
            );

            emailForm.style.display =
                "none";

            phoneForm.classList.add(
                "visible"
            );

            clearAlert();

        }
    );


    /* =========================================
       PASSWORD VISIBILITY
    ========================================== */

    passwordToggle.addEventListener(
        "click",
        function () {

            const hidden =
                password.type === "password";


            password.type =
                hidden
                    ? "text"
                    : "password";


            passwordToggle.textContent =
                hidden
                    ? "🙈"
                    : "👁";

        }
    );


    /* =========================================
       EMAIL LOGIN
    ========================================== */

    emailForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            clearAlert();


            const emailValue =
                email.value
                    .trim()
                    .toLowerCase();


            const passwordValue =
                password.value;


            if (!emailValue) {

                showAlert(
                    "Please enter your email address."
                );

                email.focus();

                return;

            }


            if (
                !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
                    .test(
                        emailValue
                    )
            ) {

                showAlert(
                    "Please enter a valid email address."
                );

                email.focus();

                return;

            }


            if (!passwordValue) {

                showAlert(
                    "Please enter your password."
                );

                password.focus();

                return;

            }


            if (
                !window.GoBikeAuth ||
                typeof window.GoBikeAuth.login !==
                    "function"
            ) {

                showAlert(
                    "Authentication service is not connected."
                );

                return;

            }


            setLoading(
                emailLoginButton,
                true
            );


            try {

                const result =
                    await window.GoBikeAuth.login({
                        email:
                            emailValue,

                        password:
                            passwordValue,

                        role:
                            role
                    });


                if (
                    !result ||
                    result.success !== true
                ) {

                    throw new Error(
                        result &&
                        result.message
                            ? result.message
                            : "Login failed."
                    );

                }


                showAlert(
                    "Login successful. Opening Go Bike...",
                    "success"
                );


                window.setTimeout(
                    function () {

                        window.location.replace(
                            result.redirect ||
                            (
                                role === "driver"
                                    ? "../driver/home.html"
                                    : "../customer/home.html"
                            )
                        );

                    },
                    500
                );


            } catch (error) {

                showAlert(
                    error &&
                    error.message
                        ? error.message
                        : "Unable to login. Please try again."
                );

            } finally {

                setLoading(
                    emailLoginButton,
                    false
                );

            }

        }
    );


    /* =========================================
       PHONE NORMALIZATION
    ========================================== */

    function getPhone() {

        return phone.value
            .replace(/\D/g, "")
            .slice(0, 10);

    }


    phone.addEventListener(
        "input",
        function () {

            phone.value =
                getPhone();

        }
    );


    otp.addEventListener(
        "input",
        function () {

            otp.value =
                otp.value
                    .replace(/\D/g, "")
                    .slice(0, 6);

        }
    );


    /* =========================================
       SEND OTP
    ========================================== */

    sendOtpButton.addEventListener(
        "click",
        async function () {

            clearAlert();


            const phoneValue =
                getPhone();


            if (
                !/^[6-9]\d{9}$/
                    .test(
                        phoneValue
                    )
            ) {

                showAlert(
                    "Enter a valid 10-digit Indian mobile number."
                );

                phone.focus();

                return;

            }


            if (
                !window.GoBikeAuth ||
                typeof window.GoBikeAuth.sendOTP !==
                    "function"
            ) {

                showAlert(
                    "OTP authentication service is not connected."
                );

                return;

            }


            setLoading(
                sendOtpButton,
                true
            );


            try {

                const result =
                    await window.GoBikeAuth.sendOTP(
                        "+91" + phoneValue,
                        "recaptcha-container"
                    );


                if (
                    !result ||
                    result.success !== true
                ) {

                    throw new Error(
                        result &&
                        result.message
                            ? result.message
                            : "Unable to send OTP."
                    );

                }


                otpPhone.textContent =
                    "+91 " +
                    phoneValue;


                phoneStep.style.display =
                    "none";

                otpStep.style.display =
                    "block";


                otp.focus();


                showAlert(
                    "OTP sent successfully.",
                    "success"
                );


            } catch (error) {

                showAlert(
                    error &&
                    error.message
                        ? error.message
                        : "Unable to send OTP."
                );

            } finally {

                setLoading(
                    sendOtpButton,
                    false
                );

            }

        }
    );


    /* =========================================
       VERIFY OTP
    ========================================== */

    verifyOtpButton.addEventListener(
        "click",
        async function () {

            clearAlert();


            const code =
                otp.value
                    .replace(/\D/g, "");


            if (
                code.length !== 6
            ) {

                showAlert(
                    "Please enter the 6-digit OTP."
                );

                otp.focus();

                return;

            }


            if (
                !window.GoBikeAuth ||
                typeof window.GoBikeAuth.verifyOTP !==
                    "function"
            ) {

                showAlert(
                    "OTP authentication service is not connected."
                );

                return;

            }


            setLoading(
                verifyOtpButton,
                true
            );


            try {

                const result =
                    await window.GoBikeAuth.verifyOTP(
                        code,
                        {
                            role:
                                role
                        }
                    );


                if (
                    !result ||
                    result.success !== true
                ) {

                    throw new Error(
                        result &&
                        result.message
                            ? result.message
                            : "OTP verification failed."
                    );

                }


                showAlert(
                    "Verified successfully. Opening Go Bike...",
                    "success"
                );


                window.setTimeout(
                    function () {

                        window.location.replace(
                            result.redirect ||
                            (
                                role === "driver"
                                    ? "../driver/home.html"
                                    : "../customer/home.html"
                            )
                        );

                    },
                    500
                );


            } catch (error) {

                showAlert(
                    error &&
                    error.message
                        ? error.message
                        : "OTP verification failed."
                );

            } finally {

                setLoading(
                    verifyOtpButton,
                    false
                );

            }

        }
    );


    /* =========================================
       CHANGE PHONE
    ========================================== */

    changePhone.addEventListener(
        "click",
        function () {

            otp.value =
                "";

            otpStep.style.display =
                "none";

            phoneStep.style.display =
                "block";

            clearAlert();

            phone.focus();

        }
    );


    /* =========================================
       RESEND OTP
    ========================================== */

    resendOtp.addEventListener(
        "click",
        function () {

            sendOtpButton.click();

        }
    );


    /* =========================================
       GOOGLE
    ========================================== */

    googleButton.addEventListener(
        "click",
        async function () {

            clearAlert();


            if (
                !window.GoBikeAuth ||
                typeof window.GoBikeAuth
                    .loginWithGoogle !==
                    "function"
            ) {

                showAlert(
                    "Google authentication service is not connected."
                );

                return;

            }


            googleButton.disabled =
                true;


            try {

                const result =
                    await window.GoBikeAuth
                        .loginWithGoogle({
                            role:
                                role
                        });


                if (
                    result &&
                    result.pendingRedirect
                ) {

                    showAlert(
                        "Continuing with Google...",
                        "success"
                    );

                    return;

                }


                if (
                    !result ||
                    result.success !== true
                ) {

                    throw new Error(
                        result &&
                        result.message
                            ? result.message
                            : "Google login failed."
                    );

                }


                window.location.replace(
                    result.redirect ||
                    (
                        role === "driver"
                            ? "../driver/home.html"
                            : "../customer/home.html"
                    )
                );


            } catch (error) {

                showAlert(
                    error &&
                    error.message
                        ? error.message
                        : "Unable to login with Google."
                );

            } finally {

                googleButton.disabled =
                    false;

            }

        }
    );


    /* =========================================
       FORGOT PASSWORD
    ========================================== */

    forgotPassword.addEventListener(
        "click",
        async function () {

            clearAlert();


            const emailValue =
                email.value
                    .trim()
                    .toLowerCase();


            if (!emailValue) {

                showAlert(
                    "Enter your email address first."
                );

                email.focus();

                return;

            }


            if (
                !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
                    .test(
                        emailValue
                    )
            ) {

                showAlert(
                    "Please enter a valid email address."
                );

                email.focus();

                return;

            }


            if (
                !window.GoBikeAuth ||
                typeof window.GoBikeAuth
                    .resetPassword !==
                    "function"
            ) {

                showAlert(
                    "Password reset service is not connected."
                );

                return;

            }


            forgotPassword.disabled =
                true;


            try {

                const result =
                    await window.GoBikeAuth
                        .resetPassword(
                            emailValue
                        );


                if (
                    !result ||
                    result.success !== true
                ) {

                    throw new Error(
                        result &&
                        result.message
                            ? result.message
                            : "Unable to send reset email."
                    );

                }


                showAlert(
                    "Password reset email sent. Please check your inbox.",
                    "success"
                );


            } catch (error) {

                showAlert(
                    error &&
                    error.message
                        ? error.message
                        : "Unable to send reset email."
                );

            } finally {

                forgotPassword.disabled =
                    false;

            }

        }
    );


    /* =========================================
       BACK
    ========================================== */

    backButton.addEventListener(
        "click",
        function () {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            } else {

                window.location.replace(
                    "../index.html"
                );

            }

        }
    );


    /* =========================================
       YEAR
    ========================================== */

    year.textContent =
        new Date().getFullYear();


    /* =========================================
       ALREADY LOGGED IN
       Do not force redirect immediately.
       Auth-state is handled centrally by
       protected pages, avoiding redirect loops.
    ========================================== */

})();
</script>
