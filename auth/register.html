<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080808">

  <title>Register | Go Bike</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <a href="../index.html" class="brand">
        <div class="brand-logo">
          <span class="brand-fallback">🛵</span>
        </div>

        <div class="brand-text">
          <strong>GO BIKE</strong>
          <small>PARCEL DELIVERY</small>
        </div>
      </a>


      <div class="auth-heading">

        <span class="eyebrow">
          CREATE ACCOUNT
        </span>

        <h1>
          Join Go Bike
        </h1>

        <p>
          Create your account and start sending parcels.
        </p>

      </div>


      <form id="registerForm" novalidate>

        <div class="form-group">

          <label for="name">
            Full Name
          </label>

          <input
            id="name"
            name="name"
            type="text"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >

        </div>


        <div class="form-group">

          <label for="phone">
            Phone Number
          </label>

          <input
            id="phone"
            name="phone"
            type="tel"
            placeholder="Enter phone number"
            autocomplete="tel"
            inputmode="tel"
            required
          >

        </div>


        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="Enter email address"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>


        <div
          id="registerMessage"
          class="form-message"
          role="alert"
          aria-live="polite"
        ></div>


        <button
          id="registerButton"
          type="submit"
          class="btn btn-primary auth-button"
        >
          Create Account
        </button>

      </form>


      <div class="auth-footer">

        <span>
          Already have an account?
        </span>

        <a href="login.html">
          Login
        </a>

      </div>

    </section>

  </main>


  <!-- Firebase configuration must load first -->
  <script src="../firebase/firebase-config.js"></script>

  <!-- Main application -->
  <script src="../js/app.js"></script>

  <!-- Firebase registration logic -->
  <script
    type="module"
    src="../js/auth.js"
  ></script>

</body>
</html>
