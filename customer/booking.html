<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Bike - Parcel Book Karein</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin:0; padding:0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: white; }
        .header { background: #1e293b; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-weight: 900; font-size: 22px; }
        .orange { color: #f97316; }
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; border: 1px solid #334155; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: white; }
        #map { height: 180px; border-radius: 12px; margin-top: 15px; border: 1px solid #475569; }
        .btn-book { width: 100%; background: #f97316; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .fare-box { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px dashed #f97316; margin-top: 10px; text-align: center; }
        
        .otp-card { background: #064e3b; border: 2px solid #10b981; border-radius: 12px; padding: 20px; text-align: center; margin-top: 15px; }
        .otp-number { font-size: 36px; font-weight: 900; letter-spacing: 8px; color: #34d399; margin: 10px 0; }
        .btn-wa { background: #25D366; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">GO <span class="orange">BIKE</span></div>
        <span style="font-size: 12px; background: #334155; padding: 5px 10px; border-radius: 20px;">📦 Customer Portal</span>
    </div>

    <div class="container">
        <div id="booking-form" class="card">
            <h3>📦 Parcel Ki Details Daalein</h3>
            <input type="tel" id="phone" placeholder="📱 Phone Number (WhatsApp alert ke liye)">
            <input type="text" id="pickup" placeholder="🟢 Pickup Location">
            <input type="text" id="drop" placeholder="🔴 Drop Location">
            <select id="category">
                <option>📄 Documents / Files</option>
                <option>📱 Electronics / Gadget</option>
                <option>👕 Clothes / Personal Belongings</option>
                <option>📦 Heavy Box / Food (Up to 15 KG)</option>
            </select>
            <input type="number" id="distance" placeholder="Distance (KM mein)" oninput="calculateFare()">

            <div class="fare-box">
                <span style="color:#94a3b8; font-size:13px;">Estimated Delivery Charge:</span>
                <h2 id="total-fare" style="color:#f97316;">₹0</h2>
            </div>
            <div id="map"></div>
            <button class="btn-book" onclick="placeOrder()">Confirm & Book Go Bike ➔</button>
        </div>

        <div id="status-card" class="card" style="display: none;">
            <h3 style="color:#10b981;">🛵 Rider On The Way</h3>
            <p style="color:#94a3b8; font-size:13px; margin-top:5px;">Order details WhatsApp par bhej di gayi hain.</p>
            
            <div class="otp-card">
                <p style="color:#a7f3d0; font-size:13px;">Delivery Verification OTP</p>
                <div class="otp-number" id="display-otp">----</div>
            </div>

            <button class="btn-wa" onclick="sendWhatsAppDirect()">💬 Open WhatsApp Receipt</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([28.6139, 77.2090], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const BACKEND_URL = "https://go-bike-backend.vercel.app";
        let lastOrderData = {};

        function calculateFare() {
            let km = document.getElementById('distance').value;
            if(km > 0) {
                let fare = 30 + (km * 10);
                document.getElementById('total-fare').innerText = "₹" + fare;
            } else {
                document.getElementById('total-fare').innerText = "₹0";
            }
        }

        async function placeOrder() {
            let phone = document.getElementById('phone').value;
            let pickup = document.getElementById('pickup').value;
            let drop = document.getElementById('drop').value;
            let fare = document.getElementById('total-fare').innerText;

            if(!phone || !pickup || !drop || fare === "₹0") {
                return alert("Kripya saari details aur Mobile Number sahi se bharein!");
            }

            let otp = Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('gobike_active_otp', otp);

            lastOrderData = { phone, pickup, drop, fare, otp };

            document.getElementById('display-otp').innerText = otp;
            document.getElementById('booking-form').style.display = 'none';
            document.getElementById('status-card').style.display = 'block';

            try {
                await fetch(`${BACKEND_URL}/api/send-whatsapp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customerPhone: "+91" + phone,
                        pickup, drop, fare, otp
                    })
                });
            } catch(e) {}
        }

        function sendWhatsAppDirect() {
            let msg = `📦 *Go Bike Order Confirmed!*%0A%0A🟢 *Pickup:* ${lastOrderData.pickup}%0A🔴 *Drop:* ${lastOrderData.drop}%0A💰 *Fare:* ${lastOrderData.fare}%0A🔑 *OTP:* ${lastOrderData.otp}`;
            window.open(`https://wa.me/91${lastOrderData.phone}?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
