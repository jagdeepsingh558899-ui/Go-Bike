<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <meta
        name="description"
        content="Go Bike customer home - book and track your parcel delivery."
    >

    <title>Go Bike | Home</title>

    <link
        rel="icon"
        type="image/png"
        href="../assets/favicon.png"
    >

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3C6pN8hM4jH7mQ2j5l5J9N8z6JQ8="
        crossorigin=""
    >

    <style>
        :root {
            --black: #080808;
            --black-2: #101010;
            --card: #151515;
            --card-2: #1b1b1b;

            --yellow: #ffd600;
            --yellow-light: #ffe44d;

            --white: #ffffff;
            --muted: #909090;
            --muted-2: #666666;

            --green: #31d07c;
            --red: #ff5757;

            --border: rgba(255,255,255,.09);

            --nav-height: 70px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--black);
        }

        body {
            color: var(--white);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        button,
        input {
            font: inherit;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           APP
        ====================================================== */

        .app {
            position: relative;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            overflow: hidden;

            background: var(--black);
        }

        /* =====================================================
           MAP
        ====================================================== */

        #map {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            background: #202020;

            z-index: 1;
        }

        .leaflet-control-attribution {
            font-size: 8px !important;
            opacity: .65;
        }

        .leaflet-control-zoom {
            display: none;
        }

        .leaflet-container {
            background: #202020;
        }

        /* =====================================================
           TOP GRADIENT
        ====================================================== */

        .top-gradient {
            position: absolute;
            z-index: 10;

            top: 0;
            left: 0;
            right: 0;

            height: 210px;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,.72),
                    rgba(0,0,0,.22),
                    transparent
                );
        }

        /* =====================================================
           TOPBAR
        ====================================================== */

        .topbar {
            position: absolute;
            z-index: 30;

            top: max(14px, env(safe-area-inset-top));
            left: 14px;
            right: 14px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;

            pointer-events: auto;
        }

        .brand-logo {
            width: 42px;
            height: 42px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 5px 16px
                    rgba(0,0,0,.45)
                );
        }

        .brand-name {
            font-size: 18px;
            font-weight: 950;
            letter-spacing: -1px;

            text-shadow:
                0 2px 10px rgba(0,0,0,.6);
        }

        .brand-name span {
            color: var(--yellow);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;

            pointer-events: auto;
        }

        .icon-button {
            position: relative;

            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;

            background: rgba(12,12,12,.78);
            color: var(--white);

            backdrop-filter: blur(12px);

            font-size: 18px;
        }

        .icon-button:active {
            transform: scale(.94);
        }

        .notification-dot {
            position: absolute;

            top: 8px;
            right: 8px;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--yellow);

            border: 1.5px solid #111;
        }

        /* =====================================================
           LOCATION PILL
        ====================================================== */

        .location-pill {
            position: absolute;
            z-index: 20;

            top: 76px;
            left: 14px;
            right: 14px;

            max-width: 500px;
            margin: auto;

            display: flex;
            align-items: center;

            padding: 11px 13px;

            border: 1px solid rgba(255,255,255,.10);
            border-radius: 15px;

            background: rgba(10,10,10,.78);

            backdrop-filter: blur(14px);

            box-shadow:
                0 8px 25px rgba(0,0,0,.25);
        }

        .location-dot {
            width: 9px;
            height: 9px;

            flex: 0 0 9px;

            margin-right: 10px;

            border: 2px solid var(--yellow);
            border-radius: 50%;
        }

        .location-text {
            min-width: 0;
            flex: 1;
        }

        .location-label {
            color: #777;

            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .location-value {
            margin-top: 2px;

            overflow: hidden;

            color: #ddd;

            font-size: 11px;
            font-weight: 700;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .location-refresh {
            width: 32px;
            height: 32px;

            border: 0;
            border-radius: 10px;

            background: rgba(255,214,0,.10);
            color: var(--yellow);

            font-size: 15px;
        }

        /* =====================================================
           RECENTER
        ====================================================== */

        .recenter-button {
            position: absolute;
            z-index: 20;

            right: 14px;

            bottom: calc(
                var(--nav-height) + 305px +
                env(safe-area-inset-bottom)
            );

            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,.10);
            border-radius: 15px;

            background: rgba(10,10,10,.82);
            color: var(--yellow);

            backdrop-filter: blur(12px);

            box-shadow:
                0 8px 25px rgba(0,0,0,.3);

            font-size: 20px;
        }

        .recenter-button:active {
            transform: scale(.94);
        }

        /* =====================================================
           BOTTOM SHEET
        ====================================================== */

        .sheet {
            position: absolute;
            z-index: 40;

            left: 0;
            right: 0;
            bottom: 0;

            max-height: 72vh;

            padding:
                9px
                14px
                calc(
                    var(--nav-height) +
                    18px +
                    env(safe-area-inset-bottom)
                );

            border-radius: 28px 28px 0 0;

            background:
                linear-gradient(
                    180deg,
                    #111111,
                    #0b0b0b
                );

            box-shadow:
                0 -12px 40px rgba(0,0,0,.35);

            overflow-y: auto;

            -webkit-overflow-scrolling: touch;
        }

        .sheet-handle {
            width: 40px;
            height: 4px;

            margin: 0 auto 13px;

            border-radius: 999px;

            background: #444;
        }

        .greeting {
            margin-bottom: 13px;
        }

        .greeting-small {
            color: #777;

            font-size: 10px;
            font-weight: 700;
        }

        .greeting-name {
            margin-top: 2px;

            font-size: 21px;
            font-weight: 900;
            letter-spacing: -.8px;
        }

        .greeting-name span {
            color: var(--yellow);
        }

        /* =====================================================
           SEARCH BOXES
        ====================================================== */

        .route-card {
            padding: 14px;

            border: 1px solid var(--border);
            border-radius: 19px;

            background: rgba(255,255,255,.025);
        }

        .route-row {
            display: flex;
            align-items: center;

            min-height: 48px;
        }

        .route-marker-column {
            width: 22px;

            display: flex;
            flex-direction: column;
            align-items: center;

            align-self: stretch;
        }

        .route-marker {
            width: 11px;
            height: 11px;

            flex: 0 0 11px;

            margin-top: 18px;

            border-radius: 50%;
        }

        .pickup-marker {
            border: 3px solid var(--yellow);
            background: #111;
        }

        .drop-marker {
            background: var(--red);
            box-shadow:
                0 0 0 3px rgba(255,87,87,.13);
        }

        .route-line {
            width: 1px;
            flex: 1;

            min-height: 18px;

            margin: 3px 0;

            border-left: 1px dashed #555;
        }

        .route-input-wrap {
            flex: 1;

            padding-left: 9px;
        }

        .route-label {
            display: block;

            margin-bottom: 3px;

            color: #777;

            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .route-input {
            width: 100%;

            border: 0;
            outline: 0;

            background: transparent;
            color: var(--white);

            font-size: 13px;
            font-weight: 700;
        }

        .route-input::placeholder {
            color: #5f5f5f;
        }

        .route-action {
            width: 34px;
            height: 34px;

            border: 0;
            border-radius: 10px;

            background: rgba(255,255,255,.05);
            color: #999;

            font-size: 14px;
        }

        /* =====================================================
           ESTIMATE
        ====================================================== */

        .estimate {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;

            margin-top: 11px;
        }

        .estimate-item {
            padding: 11px 8px;

            border: 1px solid var(--border);
            border-radius: 13px;

            background: rgba(255,255,255,.025);

            text-align: center;
        }

        .estimate-label {
            color: #666;

            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .estimate-value {
            margin-top: 4px;

            color: var(--white);

            font-size: 13px;
            font-weight: 900;
        }

        .estimate-value.fare {
            color: var(--yellow);
        }

        /* =====================================================
           SERVICE
        ====================================================== */

        .section-title {
            margin: 17px 2px 8px;

            color: #aaa;

            font-size: 10px;
            font-weight: 850;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .service-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .service {
            min-height: 62px;

            display: flex;
            align-items: center;

            padding: 9px;

            border: 1px solid var(--border);
            border-radius: 15px;

            background: rgba(255,255,255,.025);

            color: var(--white);

            text-align: left;
        }

        .service.active {
            border-color: rgba(255,214,0,.45);
            background: rgba(255,214,0,.075);
        }

        .service-icon {
            width: 39px;
            height: 39px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 9px;

            border-radius: 12px;

            background: rgba(255,214,0,.09);

            font-size: 19px;
        }

        .service strong {
            display: block;

            font-size: 11px;
            font-weight: 850;
        }

        .service small {
            display: block;

            margin-top: 3px;

            color: #666;

            font-size: 8px;
        }

        /* =====================================================
           BOOK BUTTON
        ====================================================== */

        .book-button {
            width: 100%;
            min-height: 53px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            margin-top: 12px;

            border: 0;
            border-radius: 16px;

            background: var(--yellow);
            color: #101010;

            font-size: 14px;
            font-weight: 950;

            box-shadow:
                0 8px 25px rgba(255,214,0,.12);
        }

        .book-button:active {
            transform: scale(.985);
        }

        .book-button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        /* =====================================================
           EMPTY / LOCATION MESSAGE
        ====================================================== */

        .map-message {
            position: absolute;
            z-index: 25;

            left: 50%;
            bottom: calc(
                var(--nav-height) + 330px +
                env(safe-area-inset-bottom)
            );

            transform: translateX(-50%);

            width: max-content;
            max-width: calc(100% - 50px);

            padding: 9px 13px;

            border: 1px solid rgba(255,255,255,.10);
            border-radius: 999px;

            background: rgba(10,10,10,.82);

            color: #aaa;

            font-size: 9px;
            font-weight: 700;

            backdrop-filter: blur(10px);

            opacity: 0;
            pointer-events: none;

            transition: opacity .2s ease;
        }

        .map-message.show {
            opacity: 1;
        }

        /* =====================================================
           BOTTOM NAV
        ====================================================== */

        .bottom-nav {
            position: absolute;
            z-index: 60;

            left: 0;
            right: 0;
            bottom: 0;

            height: var(--nav-height);

            padding:
                7px
                9px
                max(7px, env(safe-area-inset-bottom));

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            border-top: 1px solid rgba(255,255,255,.07);

            background:
                rgba(8,8,8,.94);

            backdrop-filter: blur(18px);
        }

        .nav-item {
            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;

            border: 0;

            background: transparent;
            color: #666;

            font-size: 9px;
            font-weight: 750;
        }

        .nav-item .nav-icon {
            font-size: 19px;
            line-height: 1;
        }

        .nav-item.active {
            color: var(--yellow);
        }

        .nav-item.active::before {
            content: "";

            position: absolute;

            top: 0;

            width: 22px;
            height: 2px;

            border-radius: 999px;

            background: var(--yellow);
        }

        .nav-badge {
            position: absolute;

            top: 7px;
            right: 23%;

            min-width: 14px;
            height: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 3px;

            border: 2px solid #080808;
            border-radius: 999px;

            background: var(--red);
            color: #fff;

            font-size: 7px;
            font-weight: 900;
        }

        /* =====================================================
           SEARCH MODAL
        ====================================================== */

        .search-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;

            display: none;

            background: rgba(0,0,0,.65);

            backdrop-filter: blur(5px);
        }

        .search-overlay.show {
            display: block;
        }

        .search-panel {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            max-height: 72vh;

            padding:
                15px
                15px
                calc(18px + env(safe-area-inset-bottom));

            border-radius: 27px 27px 0 0;

            background: #111;

            box-shadow:
                0 -15px 45px rgba(0,0,0,.45);
        }

        .search-header {
            display: flex;
            align-items: center;

            margin-bottom: 13px;
        }

        .search-close {
            width: 38px;
            height: 38px;

            margin-right: 10px;

            border: 0;
            border-radius: 12px;

            background: rgba(255,255,255,.06);
            color: #fff;
        }

        .search-header strong {
            font-size: 15px;
        }

        .search-box {
            width: 100%;
            height: 50px;

            padding: 0 14px;

            border: 1px solid var(--border);
            border-radius: 14px;

            outline: none;

            background: #181818;
            color: #fff;

            font-size: 13px;
        }

        .search-box:focus {
            border-color: rgba(255,214,0,.5);
        }

        .search-results {
            max-height: 42vh;

            margin-top: 10px;

            overflow-y: auto;
        }

        .search-result {
            width: 100%;

            display: flex;
            align-items: center;

            padding: 13px 7px;

            border: 0;
            border-bottom: 1px solid var(--border);

            background: transparent;
            color: #fff;

            text-align: left;
        }

        .result-icon {
            width: 37px;
            height: 37px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 10px;

            border-radius: 11px;

            background: rgba(255,214,0,.08);

            color: var(--yellow);
        }

        .result-text strong {
            display: block;

            font-size: 11px;
        }

        .result-text small {
            display: block;

            margin-top: 3px;

            color: #666;

            font-size: 9px;
        }

        /* =====================================================
           NOTIFICATION PANEL
        ====================================================== */

        .notification-overlay {
            position: fixed;
            inset: 0;
            z-index: 90;

            display: none;

            background: rgba(0,0,0,.4);
        }

        .notification-overlay.show {
            display: block;
        }

        .notification-panel {
            position: absolute;

            top: max(66px, calc(66px + env(safe-area-inset-top)));
            right: 12px;

            width: min(350px, calc(100% - 24px));

            padding: 14px;

            border: 1px solid var(--border);
            border-radius: 20px;

            background: #141414;

            box-shadow:
                0 20px 55px rgba(0,0,0,.45);
        }

        .notification-head {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 10px;
        }

        .notification-head strong {
            font-size: 14px;
        }

        .notification-head button {
            width: 31px;
            height: 31px;

            border: 0;
            border-radius: 9px;

            background: rgba(255,255,255,.05);
            color: #aaa;
        }

        .notification-empty {
            padding: 25px 10px;

            color: #666;

            font-size: 11px;
            text-align: center;
        }

        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (min-width: 800px) {

            .sheet {
                left: 20px;
                right: auto;
                bottom: 20px;

                width: 450px;
                max-height: calc(100vh - 40px);

                border-radius: 27px;

                padding-bottom: 20px;
            }

            .bottom-nav {
                left: 20px;
                right: auto;
                bottom: 20px;

                width: 450px;

                border:
                    1px solid
                    rgba(255,255,255,.07);

                border-radius: 18px;
            }

            .recenter-button {
                right: 25px;
                bottom: 120px;
            }

            .map-message {
                bottom: 120px;
            }

        }

        @media (max-height: 700px) {

            .sheet {
                max-height: 62vh;
            }

            .greeting {
                margin-bottom: 8px;
            }

            .section-title {
                margin-top: 11px;
            }

            .service {
                min-height: 54px;
            }

            .service-icon {
                width: 34px;
                height: 34px;
            }

        }
    </style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         MAP
    ====================================================== -->

    <div id="map"></div>

    <div class="top-gradient"></div>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar">

        <div class="brand">

            <img
                class="brand-logo"
                src="../assets/logo.svg"
                alt="Go Bike"
                onerror="
                    this.onerror=null;
                    this.src='../assets/logo.png';
                "
            >

            <div class="brand-name">
                GO <span>BIKE</span>
            </div>

        </div>


        <div class="top-actions">

            <button
                id="notificationButton"
                class="icon-button"
                type="button"
                aria-label="Notifications"
            >
                🔔
                <span
                    id="notificationDot"
                    class="notification-dot"
                ></span>
            </button>

            <button
                id="profileButton"
                class="icon-button"
                type="button"
                aria-label="Profile"
            >
                👤
            </button>

        </div>

    </header>


    <!-- =====================================================
         CURRENT LOCATION
    ====================================================== -->

    <div class="location-pill">

        <span class="location-dot"></span>

        <div class="location-text">

            <div class="location-label">
                Current location
            </div>

            <div
                id="currentLocation"
                class="location-value"
            >
                Detecting your location...
            </div>

        </div>

        <button
            id="refreshLocation"
            class="location-refresh"
            type="button"
            aria-label="Refresh location"
        >
            ⟳
        </button>

    </div>


    <!-- =====================================================
         RECENTER
    ====================================================== -->

    <button
        id="recenterButton"
        class="recenter-button"
        type="button"
        aria-label="My location"
    >
        ◎
    </button>


    <!-- =====================================================
         MAP MESSAGE
    ====================================================== -->

    <div
        id="mapMessage"
        class="map-message"
    >
        Select pickup and drop locations
    </div>


    <!-- =====================================================
         CUSTOMER SHEET
    ====================================================== -->

    <section class="sheet">

        <div class="sheet-handle"></div>


        <div class="greeting">

            <div class="greeting-small">
                Good day
            </div>

            <div class="greeting-name">
                Hello, <span id="customerName">Customer</span> 👋
            </div>

        </div>


        <!-- ROUTE -->

        <div class="route-card">

            <!-- PICKUP -->

            <div class="route-row">

                <div class="route-marker-column">

                    <div class="route-marker pickup-marker"></div>

                    <div class="route-line"></div>

                </div>


                <div class="route-input-wrap">

                    <label
                        class="route-label"
                        for="pickupInput"
                    >
                        Pickup
                    </label>

                    <input
                        id="pickupInput"
                        class="route-input"
                        type="text"
                        autocomplete="off"
                        placeholder="Where should we pick it up?"
                    >

                </div>


                <button
                    id="pickupSearchButton"
                    class="route-action"
                    type="button"
                    aria-label="Search pickup"
                >
                    🔎
                </button>

            </div>


            <!-- DROP -->

            <div class="route-row">

                <div class="route-marker-column">

                    <div class="route-marker drop-marker"></div>

                </div>


                <div class="route-input-wrap">

                    <label
                        class="route-label"
                        for="dropInput"
                    >
                        Drop
                    </label>

                    <input
                        id="dropInput"
                        class="route-input"
                        type="text"
                        autocomplete="off"
                        placeholder="Where should we deliver it?"
                    >

                </div>


                <button

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

<script>
(function () {

    "use strict";


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const mapElement =
        document.getElementById("map");

    const pickupInput =
        document.getElementById("pickupInput");

    const dropInput =
        document.getElementById("dropInput");

    const distanceValue =
        document.getElementById("distanceValue");

    const etaValue =
        document.getElementById("etaValue");

    const fareValue =
        document.getElementById("fareValue");

    const bookButton =
        document.getElementById("bookButton");

    const currentLocation =
        document.getElementById("currentLocation");

    const mapMessage =
        document.getElementById("mapMessage");

    const searchOverlay =
        document.getElementById("searchOverlay");

    const searchBox =
        document.getElementById("searchBox");

    const searchResults =
        document.getElementById("searchResults");

    const searchTitle =
        document.getElementById("searchTitle");

    const notificationOverlay =
        document.getElementById(
            "notificationOverlay"
        );

    const notificationContent =
        document.getElementById(
            "notificationContent"
        );

    const notificationDot =
        document.getElementById(
            "notificationDot"
        );


    /* =====================================================
       STATE

       These names are intentionally kept stable for the
       upcoming booking/map engines.
    ====================================================== */

    let map = null;

    let currentLocationMarker = null;
    let pickupMarker = null;
    let dropMarker = null;

    let pickupCoordinates = null;
    let dropCoordinates = null;

    let searchMode = "pickup";

    let currentLatLng = null;

    let searchTimer = null;

    let selectedService =
        "bike-parcel";


    /* =====================================================
       DEFAULT MAP

       Temporary India fallback only.

       Real user location replaces this immediately when
       browser geolocation is available.
    ====================================================== */

    const DEFAULT_LOCATION = [
        30.7046,
        76.7179
    ];


    /* =====================================================
       MAP INIT
    ====================================================== */

    function initializeMap() {

        if (
            typeof window.L === "undefined"
        ) {

            showMapMessage(
                "Map service could not be loaded."
            );

            return;

        }


        map =
            L.map(
                mapElement,
                {
                    zoomControl: false,
                    attributionControl: true
                }
            ).setView(
                DEFAULT_LOCATION,
                14
            );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        map.on(
            "click",
            function (event) {

                handleMapClick(
                    event.latlng
                );

            }
        );


        setTimeout(
            function () {

                map.invalidateSize();

            },
            250
        );

    }


    /* =====================================================
       MAP CLICK
    ====================================================== */

    function handleMapClick(
        latlng
    ) {

        if (!pickupCoordinates) {

            setPickup(
                latlng,
                "Selected pickup"
            );

            return;

        }


        if (!dropCoordinates) {

            setDrop(
                latlng,
                "Selected drop"
            );

            return;

        }


        showMapMessage(
            "Pickup and drop are already selected."
        );

    }


    /* =====================================================
       PICKUP
    ====================================================== */

    function setPickup(
        latlng,
        label
    ) {

        pickupCoordinates = {
            lat:
                latlng.lat,

            lng:
                latlng.lng
        };


        if (pickupMarker) {

            map.removeLayer(
                pickupMarker
            );

        }


        pickupMarker =
            L.marker(
                latlng,
                {
                    title:
                        "Pickup"
                }
            ).addTo(map);


        pickupMarker.bindPopup(
            "<strong>Pickup</strong><br>" +
            escapeHtml(label)
        );


        pickupInput.value =
            label;


        if (
            !dropCoordinates
        ) {

            searchMode =
                "drop";

            showMapMessage(
                "Now select your drop location."
            );

        }


        updateRouteEstimate();

    }


    /* =====================================================
       DROP
    ====================================================== */

    function setDrop(
        latlng,
        label
    ) {

        dropCoordinates = {
            lat:
                latlng.lat,

            lng:
                latlng.lng
        };


        if (dropMarker) {

            map.removeLayer(
                dropMarker
            );

        }


        dropMarker =
            L.marker(
                latlng,
                {
                    title:
                        "Drop"
                }
            ).addTo(map);


        dropMarker.bindPopup(
            "<strong>Drop</strong><br>" +
            escapeHtml(label)
        );


        dropInput.value =
            label;


        updateRouteEstimate();

        fitRoute();

    }


    /* =====================================================
       ROUTE ESTIMATE

       Straight-line distance is used as a safe local
       fallback until the routing engine is connected.

       The next map/booking engine will replace this with
       real road distance + routing data.
    ====================================================== */

    function updateRouteEstimate() {

        if (
            !pickupCoordinates ||
            !dropCoordinates
        ) {

            distanceValue.textContent =
                "— km";

            etaValue.textContent =
                "— min";

            fareValue.textContent =
                "₹ —";

            bookButton.disabled =
                true;

            return;

        }


        const distance =
            haversineDistance(
                pickupCoordinates.lat,
                pickupCoordinates.lng,
                dropCoordinates.lat,
                dropCoordinates.lng
            );


        const roundedDistance =
            Math.max(
                .5,
                Math.round(
                    distance * 10
                ) / 10
            );


        /*
         * Approximate bike travel speed.
         * Final fare/ETA engine will be centralized
         * in js/booking.js so customer and driver
         * always see the same values.
         */

        const estimatedMinutes =
            Math.max(
                5,
                Math.ceil(
                    (
                        roundedDistance /
                        25
                    ) * 60
                )
            );


        const baseFare =
            30;

        const perKm =
            10;

        const estimatedFare =
            Math.round(
                baseFare +
                roundedDistance *
                perKm
            );


        distanceValue.textContent =
            roundedDistance +
            " km";


        etaValue.textContent =
            estimatedMinutes +
            " min";


        fareValue.textContent =
            "₹ " +
            estimatedFare;


        bookButton.disabled =
            false;

    }


    /* =====================================================
       HAVERSINE
    ====================================================== */

    function haversineDistance(
        lat1,
        lon1,
        lat2,
        lon2
    ) {

        const R =
            6371;

        const dLat =
            toRadians(
                lat2 - lat1
            );

        const dLon =
            toRadians(
                lon2 - lon1
            );


        const a =
            Math.sin(dLat / 2) *
            Math.sin(dLat / 2) +

            Math.cos(
                toRadians(lat1)
            ) *
            Math.cos(
                toRadians(lat2)
            ) *
            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);


        const c =
            2 *
            Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );


        return R * c;

    }


    function toRadians(
        degrees
    ) {

        return degrees *
            Math.PI /
            180;

    }


    /* =====================================================
       FIT ROUTE
    ====================================================== */

    function fitRoute() {

        if (
            !map ||
            !pickupMarker ||
            !dropMarker
        ) {

            return;

        }


        const bounds =
            L.latLngBounds([
                pickupMarker.getLatLng(),
                dropMarker.getLatLng()
            ]);


        map.fitBounds(
            bounds,
            {
                paddingTopLeft: [
                    30,
                    150
                ],
                paddingBottomRight: [
                    30,
                    380
                ],
                maxZoom: 16
            }
        );

    }


    /* =====================================================
       GEOLOCATION
    ====================================================== */

    function locateUser() {

        if (
            !navigator.geolocation
        ) {

            currentLocation.textContent =
                "Location unavailable";

            return;

        }


        currentLocation.textContent =
            "Finding your location...";


        navigator.geolocation.getCurrentPosition(
            function (position) {

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;


                currentLatLng = {
                    lat,
                    lng
                };


                currentLocation.textContent =
                    "Your current location";


                if (map) {

                    map.setView(
                        [
                            lat,
                            lng
                        ],
                        15
                    );

                }


                if (
                    currentLocationMarker
                ) {

                    map.removeLayer(
                        currentLocationMarker
                    );

                }


                const currentIcon =
                    L.divIcon({
                        className:
                            "go-bike-location",
                        html:
                            `
                            <div style="
                                width:18px;
                                height:18px;
                                border-radius:50%;
                                background:#FFD600;
                                border:4px solid #111;
                                box-shadow:0 0 0 7px rgba(255,214,0,.18);
                            "></div>
                            `,
                        iconSize: [
                            18,
                            18
                        ],
                        iconAnchor: [
                            9,
                            9
                        ]
                    });


                currentLocationMarker =
                    L.marker(
                        [
                            lat,
                            lng
                        ],
                        {
                            icon:
                                currentIcon
                        }
                    ).addTo(map);

            },
            function () {

                currentLocation.textContent =
                    "Location permission unavailable";

                showMapMessage(
                    "Allow location access for better pickup selection."
                );

            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 30000
            }
        );

    }


    /* =====================================================
       SEARCH PANEL
    ====================================================== */

    function openSearch(
        mode
    ) {

        searchMode =
            mode;


        searchTitle.textContent =
            mode === "pickup"
                ? "Search pickup location"
                : "Search drop location";


        searchBox.value =
            mode === "pickup"
                ? pickupInput.value
                : dropInput.value;


        searchResults.innerHTML =
            "";


        searchOverlay.classList.add(
            "show"
        );


        setTimeout(
            function () {

                searchBox.focus();

            },
            120
        );

    }


    function closeSearch() {

        searchOverlay.classList.remove(
            "show"
        );

        searchBox.value =
            "";

        searchResults.innerHTML =
            "";

    }


    /* =====================================================
       LOCATION SEARCH

       Uses OpenStreetMap Nominatim.

       Production implementation should proxy/rate-limit
       requests through a backend when traffic grows.
    ====================================================== */

    async function searchLocation(
        query
    ) {

        if (
            !query ||
            query.trim().length < 3
        ) {

            searchResults.innerHTML =
                "";

            return;

        }


        searchResults.innerHTML =
            `
            <div style="
                padding:20px;
                color:#666;
                font-size:11px;
                text-align:center;
            ">
                Searching...
            </div>
            `;


        try {

            const response =
                await fetch(
                    "https://nominatim.openstreetmap.org/search?" +
                    new URLSearchParams({
                        q:
                            query,

                        format:
                            "json",

                        limit:
                            "6",

                        countrycodes:
                            "in",

                        addressdetails:
                            "1"
                    }),
                    {
                        headers: {
                            Accept:
                                "application/json"
                        }
                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "Location search failed."
                );

            }


            const results =
                await response.json();


            renderSearchResults(
                results
            );

        } catch (error) {

            searchResults.innerHTML =
                `
                <div style="
                    padding:20px;
                    color:#777;
                    font-size:11px;
                    text-align:center;
                ">
                    Unable to search this location.
                </div>
                `;

        }

    }


    function renderSearchResults(
        results
    ) {

        searchResults.innerHTML =
            "";


        if (
            !results ||
            !results.length
        ) {

            searchResults.innerHTML =
                `
                <div style="
                    padding:20px;
                    color:#777;
                    font-size:11px;
                    text-align:center;
                ">
                    No locations found.
                </div>
                `;

            return;

        }


        results.forEach(
            function (result) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";

                button.className =
                    "search-result";


                const icon =
                    document.createElement(
                        "div"
                    );

                icon.className =
                    "result-icon";

                icon.textContent =
                    searchMode === "pickup"
                        ? "●"
                        : "●";


                const text =
                    document.createElement(
                        "div"
                    );

                text.className =
                    "result-text";


                const strong =
                    document.createElement(
                        "strong"
                    );

                strong.textContent =
                    getShortPlaceName(
                        result.display_name
                    );


                const small =
                    document.createElement(
                        "small"
                    );

                small.textContent =
                    result.display_name;


                text.appendChild(
                    strong
                );

                text.appendChild(
                    small
                );


                button.appendChild(
                    icon
                );

                button.appendChild(
                    text
                );


                button.addEventListener(
                    "click",
                    function () {

                        selectSearchResult(
                            result
                        );

                    }
                );


                searchResults.appendChild(
                    button
                );

            }
        );

    }


    function selectSearchResult(
        result
    ) {

        const lat =
            Number(
                result.lat
            );

        const lng =
            Number(
                result.lon
            );


        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
        ) {

            return;

        }


        const latlng =
            L.latLng(
                lat,
                lng
            );


        const name =
            getShortPlaceName(
                result.display_name
            );


        if (
            searchMode === "pickup"
        ) {

            setPickup(
                latlng,
                name
            );

        } else {

            setDrop(
                latlng,
                name
            );

        }


        map.setView(
            latlng,
            16
        );


        closeSearch();

    }


    function getShortPlaceName(
        displayName
    ) {

        if (!displayName) {
            return "Selected location";
        }


        return displayName
            .split(",")
            .slice(0, 2)
            .join(",")
            .trim();

    }


    /* =====================================================
       SEARCH INPUT
    ====================================================== */

    searchBox.addEventListener(
        "input",
        function () {

            const query =
                searchBox.value.trim();


            window.clearTimeout(
                searchTimer
            );


            searchTimer =
                window.setTimeout(
                    function () {

                        searchLocation(
                            query
                        );

                    },
                    450
                );

        }
    );


    /* =====================================================
       INPUT CLICK
    ====================================================== */

    pickupInput.addEventListener(
        "focus",
        function () {

            openSearch(
                "pickup"
            );

        }
    );


    dropInput.addEventListener(
        "focus",
        function () {

            openSearch(
                "drop"
            );

        }
    );


    document
        .getElementById("pickupSearchButton")
        .addEventListener(
            "click",
            function () {

                openSearch(
                    "pickup"
                );

            }
        );


    document
        .getElementById("dropSearchButton")
        .addEventListener(
            "click",
            function () {

                openSearch(
                    "drop"
                );

            }
        );


    document
        .getElementById("searchClose")
        .addEventListener(
            "click",
            closeSearch
        );


    searchOverlay.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                searchOverlay
            ) {

                closeSearch();

            }

        }
    );


    /* =====================================================
       SERVICE SELECTION
    ====================================================== */

    document
        .querySelectorAll(
            ".service"
        )
        .forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        document
                            .querySelectorAll(
                                ".service"
                            )
                            .forEach(
                                function (item) {

                                    item.classList.remove(
                                        "active"
                                    );

                                }
                            );


                        button.classList.add(
                            "active"
                        );


                        selectedService =
                            button.dataset.service;

                    }
                );

            }
        );


    /* =====================================================
       BOOK BUTTON

       The actual Firebase ride creation is deliberately
       delegated to the central booking engine.

       This prevents duplicate ride-creation logic.
    ====================================================== */

    bookButton.addEventListener(
        "click",
        async function () {

            if (
                !pickupCoordinates ||
                !dropCoordinates
            ) {

                showMapMessage(
                    "Please select pickup and drop."
                );

                return;

            }


            if (
                window.GoBikeBooking &&
                typeof window.GoBikeBooking
                    .createRide ===
                    "function"
            ) {

                bookButton.disabled =
                    true;


                try {

                    const result =
                        await window.GoBikeBooking
                            .createRide({
                                pickup: {
                                    address:
                                        pickupInput.value,
                                    lat:
                                        pickupCoordinates.lat,
                                    lng:
                                        pickupCoordinates.lng
                                },

                                drop: {
                                    address:
                                        dropInput.value,
                                    lat:
                                        dropCoordinates.lat,
                                    lng:
                                        dropCoordinates.lng
                                },

                                service:
                                    selectedService
                            });


                    if (
                        result &&
                        result.success
                    ) {

                        window.location.href =
                            "searching.html";

                        return;

                    }


                    throw new Error(
                        result &&
                        result.message
                            ? result.message
                            : "Unable to create booking."
                    );

                } catch (error) {

                    showMapMessage(
                        error.message ||
                        "Unable to create booking."
                    );

                } finally {

                    bookButton.disabled =
                        false;

                }

                return;

            }


            showMapMessage(
                "Booking engine is not connected yet."
            );

        }
    );


    /* =====================================================
       RECENTER
    ====================================================== */

    document
        .getElementById(
            "recenterButton"
        )
        .addEventListener(
            "click",
            function () {

                if (
                    currentLatLng &&
                    map
                ) {

                    map.setView(
                        [
                            currentLatLng.lat,
                            currentLatLng.lng
                        ],
                        16
                    );

                } else {

                    locateUser();

                }

            }
        );


    document
        .getElementById(
            "refreshLocation"
        )
        .addEventListener(
            "click",
            locateUser
        );


    /* =====================================================
       NOTIFICATIONS
    ====================================================== */

    document
        .getElementById(
            "notificationButton"
        )
        .addEventListener(
            "click",
            function () {

                notificationOverlay.classList.add(
                    "show"
                );


                notificationDot.style.display =
                    "none";

            }
        );


    document
        .getElementById(
            "notificationClose"
        )
        .addEventListener(
            "click",
            function () {

                notificationOverlay.classList.remove(
                    "show"
                );

            }
        );


    notificationOverlay.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                notificationOverlay
            ) {

                notificationOverlay.classList.remove(
                    "show"
                );

            }

        }
    );


    /* =====================================================
       TOP PROFILE
    ====================================================== */

    document
        .getElementById(
            "profileButton"
        )
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "profile.html";

            }
        );


    /* =====================================================
       BOTTOM NAV
    ====================================================== */

    document
        .querySelectorAll(
            ".nav-item"
        )
        .forEach(
            function (item) {

                item.addEventListener(
                    "click",
                    function () {

                        const page =
                            item.dataset.page;


                        if (
                            page === "home"
                        ) {

                            return;

                        }


                        const routes = {
                            activity:
                                "history.html",

                            wallet:
                                "wallet.html",

                            profile:
                                "profile.html"
                        };


                        if (
                            routes[page]
                        ) {

                            window.location.href =
                                routes[page];

                        }

                    }
                );

            }
        );


    /* =====================================================
       MAP MESSAGE
    ====================================================== */

    let mapMessageTimer = null;


    function showMapMessage(
        message
    ) {

        mapMessage.textContent =
            message;


        mapMessage.classList.add(
            "show"
        );


        window.clearTimeout(
            mapMessageTimer
        );


        mapMessageTimer =
            window.setTimeout(
                function () {

                    mapMessage.classList.remove(
                        "show"
                    );

                },
                3000
            );

    }


    /* =====================================================
       CUSTOMER NAME
    ====================================================== */

    function loadCustomerName() {

        let name =
            "Customer";


        try {

            const cached =
                JSON.parse(
                    localStorage.getItem(
                        "goBikeUser"
                    ) || "null"
                );


            if (
                cached &&
                cached.name
            ) {

                name =
                    cached.name
                        .split(" ")[0];

            }

        } catch (error) {

            // Firebase profile will be connected
            // by the authentication layer.

        }


        document.getElementById(
            "customerName"
        ).textContent =
            name;

    }


    /* =====================================================
       ESCAPE HTML
    ====================================================== */

    function escapeHtml(
        value
    ) {

        return String(value || "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================================
       INITIALIZE
    ====================================================== */

    initializeMap();

    loadCustomerName();

    locateUser();


})();
</script>

</body>
</html>
