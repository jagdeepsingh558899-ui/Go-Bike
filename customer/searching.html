<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <title>Finding Rider | Go Bike</title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  >

  <link
    rel="stylesheet"
    href="../css/responsive.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      overflow: hidden;
    }

    .searching-page {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #080808;
    }

    .searching-header {
      height: 64px;
      flex-shrink: 0;

      padding: 0 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid rgba(255,255,255,.08);
      background: #080808;

      position: relative;
      z-index: 1000;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      background: #ffd600;
      color: #080808;

      font-size: 20px;
    }

    .header-title strong {
      font-size: 16px;
      letter-spacing: 1px;
    }

    .notification-button {
      width: 42px;
      height: 42px;

      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;

      background: #111;
      color: #fff;

      font-size: 18px;
    }

    /* MAP */

    .searching-map-wrapper {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    #searchingMap {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* SEARCHING CARD */

    .searching-card {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 15px;

      z-index: 600;

      padding: 20px 17px;

      border-radius: 22px;

      background: rgba(8,8,8,.96);
      border: 1px solid rgba(255,255,255,.08);

      box-shadow:
        0 -10px 40px rgba(0,0,0,.35);
    }

    .search-animation {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .search-circle {
      width: 66px;
      height: 66px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(255,214,0,.08);
      border: 2px solid #ffd600;

      animation: pulse 1.5s infinite;
    }

    .search-circle span {
      font-size: 28px;
    }

    @keyframes pulse {

      0% {
        box-shadow: 0 0 0 0 rgba(255,214,0,.35);
      }

      70% {
        box-shadow: 0 0 0 18px rgba(255,214,0,0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(255,214,0,0);
      }

    }

    .searching-title {
      text-align: center;
    }

    .searching-title h1 {
      margin: 0;

      font-size: 21px;
      font-weight: 900;
    }

    .searching-title p {
      margin: 7px 0 0;

      color: #8a8a8a;
      font-size: 12px;
    }

    .dots {
      display: inline-block;
      width: 25px;
      text-align: left;
    }

    /* ROUTE */

    .route-info {
      margin-top: 18px;

      padding: 13px;

      border-radius: 14px;

      background: #111;
      border: 1px solid rgba(255,255,255,.06);
    }

    .route-row {
      display: flex;
      gap: 11px;
      align-items: flex-start;
    }

    .route-marker {
      width: 10px;
      height: 10px;

      margin-top: 4px;
      flex-shrink: 0;

      border-radius: 50%;
      background: #fff;
    }

    .route-marker.drop {
      background: #ffd600;
    }

    .route-text {
      min-width: 0;
      flex: 1;
    }

    .route-label {
      color: #777;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .7px;
    }

    .route-address {
      margin-top: 3px;

      font-size: 11px;
      line-height: 1.35;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .route-divider {
      height: 12px;
      width: 1px;

      margin-left: 4px;

      background: #333;
    }

    /* FARE */

    .fare-row {
      margin-top: 15px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .fare-label {
      color: #8a8a8a;
      font-size: 11px;
    }

    .fare-value {
      color: #ffd600;
      font-size: 20px;
      font-weight: 900;
    }

    /* CANCEL */

    .cancel-button {
      width: 100%;
      min-height: 48px;

      margin-top: 14px;

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 13px;

      background: #151515;
      color: #fff;

      font-size: 13px;
      font-weight: 800;
    }

    .cancel-button:active {
      background: #222;
    }

    /* ERROR */

    .search-error {
      margin-top: 10px;

      text-align: center;

      color: #ff5252;
      font-size: 11px;
    }

    .leaflet-control-zoom {
      margin-top: 12px !important;
      margin-left: 12px !important;
    }

    .leaflet-control-zoom a {
      background: #111 !important;
      color: #fff !important;
      border-color: #333 !important;
    }

  </style>

</head>


<body>

  <main class="searching-page">

    <!-- HEADER -->

    <header class="searching-header">

      <div class="header-title">

        <div class="header-icon">
          🛵
        </div>

        <strong>
          GO BIKE
        </strong>

      </div>


      <button
        class="notification-button"
        type="button"
        aria-label="Notifications"
      >
        🔔
      </button>

    </header>


    <!-- MAP -->

    <section class="searching-map-wrapper">

      <div id="searchingMap"></div>


      <!-- SEARCH CARD -->

      <section class="searching-card">

        <div class="search-animation">

          <div class="search-circle">
            <span>🔎</span>
          </div>

        </div>


        <div class="searching-title">

          <h1>
            Finding your rider<span class="dots">...</span>
          </h1>

          <p>
            We're looking for a nearby Go Bike rider
          </p>

        </div>


        <!-- ROUTE -->

        <div class="route-info">

          <div class="route-row">

            <div class="route-marker"></div>

            <div class="route-text">

              <div class="route-label">
                PICKUP
              </div>

              <div
                id="pickupAddress"
                class="route-address"
              >
                Loading...
              </div>

            </div>

          </div>


          <div class="route-divider"></div>


          <div class="route-row">

            <div class="route-marker drop"></div>

            <div class="route-text">

              <div class="route-label">
                DROP
              </div>

              <div
                id="dropAddress"
                class="route-address"
              >
                Loading...
              </div>

            </div>

          </div>

        </div>


        <!-- FARE -->

        <div class="fare-row">

          <span class="fare-label">
            Estimated Fare
          </span>

          <strong
            id="fareValue"
            class="fare-value"
          >
            ₹--
          </strong>

        </div>


        <!-- ERROR -->

        <div
          id="searchError"
          class="search-error"
          role="alert"
          aria-live="polite"
        ></div>


        <!-- CANCEL -->

        <button
          id="cancelRideButton"
          class="cancel-button"
          type="button"
        >
          CANCEL BOOKING
        </button>

      </section>

    </section>

  </main>


  <!-- LEAFLET -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>


  <!-- FIREBASE -->

  <script src="../firebase/firebase-config.js"></script>


  <!-- SEARCHING LOGIC -->

  <script
    type="module"
    src="../js/searching.js"
  ></script>

</body>

</html>
