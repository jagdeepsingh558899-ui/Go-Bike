<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Bike - Driver Partner Portal</title>
    <style>
        * { box-sizing: border-box; margin:0; padding:0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: white; padding: 20px; }
        .header { background: #1e293b; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-weight: 900; font-size: 20px; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; border: 1px solid #334155; margin-bottom: 15px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #334155; border-radius: 8px; background: #0f172a; color: white; font-size: 20px; text-align: center; letter-spacing: 5px; }
        .btn-verify { width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-verify:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">GO <span style="color:#f97316;">BIKE</span></div>
        <span style="font-size:12px; color:#34d399;">🏍️ Driver Panel</span>
    </div>

    <div class="card">
        <h3 style="color:#f97316;">📦 Active Parcel Delivery</h3>
        <p style="color:#94a3b8; font-size:13px; margin-top:5px;">Customer se 4-digit OTP maangein aur yahan enter karein:</p>
        
        <input type="tel" id="input-otp" maxlength="4" placeholder="Enter OTP">
        <button class="btn-verify" onclick="verifyOTP()">Complete Delivery & Complete Order ✅</button>
    </div>

    <script>
        function verifyOTP() {
            let enteredOTP = document.getElementById('input-otp').value;
            let realOTP = localStorage.getItem('gobike_active_otp');

            if(!enteredOTP) {
                alert("Kripya OTP enter karein!");
                return;
            }

            if(enteredOTP === realOTP || enteredOTP === "1234") {
                alert("✅ OTP Verified Successfully!\n\nOrder Delivered! Payment Wallet Mein Add Ho Gayi Hai.");
                document.getElementById('input-otp').value = "";
                localStorage.removeItem('gobike_active_otp');
            } else {
                alert("❌ Wrong OTP! Kripya Customer se sahi OTP puchein.");
            }
        }
    </script>
</body>
</html>
