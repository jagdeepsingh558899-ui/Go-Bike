<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Bike - Express Parcel Service</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .card { background: #1e293b; border-radius: 20px; padding: 30px; border: 1px solid #334155; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .logo { font-size: 32px; font-weight: 900; margin-bottom: 10px; }
        .orange { color: #f97316; }
        .tagline { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }

        .btn-choice { width: 100%; padding: 16px; margin: 10px 0; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; text-decoration: none; display: block; transition: 0.2s; }
        .btn-customer { background: #f97316; color: white; }
        .btn-customer:hover { background: #ea580c; }
        .btn-driver { background: #334155; color: white; border: 1px solid #475569; }
        .btn-driver:hover { background: #475569; }

        .admin-link { display: inline-block; margin-top: 25px; color: #64748b; font-size: 12px; text-decoration: none; }
        .admin-link:hover { color: #f97316; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">GO <span class="orange">BIKE</span></div>
        <p class="tagline">Fast & Safe Express Parcel Delivery</p>

        <!-- Direct Page Redirect Links -->
        <a href="./customer/booking.html" class="btn-choice btn-customer">📦 I Am Customer (Book Parcel)</a>
        <a href="./driver/dashboard.html" class="btn-choice btn-driver">🏍️ I Am Driver (Start Duty)</a>

        <a href="./admin-secret/index.html" class="admin-link">🔐 Master Admin Control</a>
    </div>

</body>
</html>
