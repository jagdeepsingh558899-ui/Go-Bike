<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#0A0A0A"
    >

    <meta
        name="description"
        content="Go Bike — Fast, Simple, Delivered."
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Go Bike"
    >

    <title>Go Bike | Fast. Simple. Delivered.</title>

    <link rel="manifest" href="manifest.json">

    <link
        rel="icon"
        type="image/png"
        href="assets/favicon.png"
    >

    <link
        rel="apple-touch-icon"
        href="assets/icons/icon-192.png"
    >

    <style>
        :root {
            --gb-black: #0A0A0A;
            --gb-black-2: #111111;
            --gb-yellow: #FFD600;
            --gb-yellow-soft: #FFE44D;
            --gb-white: #FFFFFF;
            --gb-muted: #A3A3A3;
            --gb-border: rgba(255, 255, 255, 0.09);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--gb-black);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            color: var(--gb-white);
            -webkit-font-smoothing: antialiased;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
        }

        .app {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 34%,
                    rgba(255, 214, 0, 0.09),
                    transparent 32%
                ),
                var(--gb-black);
        }

        /* =========================================
           SPLASH
        ========================================= */

        .splash {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 214, 0, 0.08),
                    transparent 36%
                ),
                var(--gb-black);

            transition:
                opacity 0.55s ease,
                visibility 0.55s ease;
        }

        .splash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            width: min(88vw, 360px);
            text-align: center;
        }

        .logo-wrap {
            position: relative;
            width: 132px;
            height: 132px;
            margin: 0 auto 26px;

            display: flex;
            align-items: center;
            justify-content: center;

            animation: logoEnter 0.9s cubic-bezier(.2,.8,.2,1) both;
        }

        .logo-glow {
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: rgba(255, 214, 0, 0.12);
            filter: blur(22px);
            animation: glowPulse 1.8s ease-in-out infinite;
        }

        .logo {
            position: relative;
            z-index: 2;

            width: 104px;
            height: 104px;

            object-fit: contain;

            filter:
                drop-shadow(0 0 16px rgba(255, 214, 0, 0.18));
        }

        .brand-name {
            font-size: 32px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -1.4px;

            animation: textEnter 0.75s 0.25s ease both;
        }

        .brand-name span {
            color: var(--gb-yellow);
        }

        .tagline {
            margin-top: 12px;

            color: var(--gb-muted);

            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.9px;

            animation: textEnter 0.75s 0.4s ease both;
        }

        .loading {
            width: 110px;
            height: 3px;

            margin: 32px auto 0;

            overflow: hidden;
            border-radius: 100px;

            background: rgba(255, 255, 255, 0.08);

            animation: textEnter 0.75s 0.55s ease both;
        }

        .loading-bar {
            width: 35%;
            height: 100%;

            border-radius: inherit;

            background: var(--gb-yellow);

            animation: loading 1.45s ease-in-out infinite;
        }

        /* =========================================
           WELCOME
        ========================================= */

        .welcome {
            position: relative;
            z-index: 2;

            display: flex;
            flex-direction: column;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            padding:
                max(28px, env(safe-area-inset-top))
                20px
                max(24px, env(safe-area-inset-bottom));

            opacity: 0;
            transform: translateY(18px);

            pointer-events: none;

            transition:
                opacity 0.6s ease,
                transform 0.6s ease;
        }

        .welcome.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .top-brand {
            display: flex;
            align-items: center;
            gap: 10px;

            width: max-content;
            margin: 0 auto;
        }

        .top-brand img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .top-brand strong {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.7px;
        }

        .top-brand strong span {
            color: var(--gb-yellow);
        }

        .hero {
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            width: 100%;
            max-width: 480px;
            margin: 0 auto;

            text-align: center;
        }

        .hero-icon {
            position: relative;

            width: 108px;
            height: 108px;

            margin-bottom: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255, 214, 0, 0.16);
            border-radius: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 214, 0, 0.10),
                    rgba(255, 255, 255, 0.025)
                );

            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.45);
        }

        .hero-icon::before {
            content: "";

            position: absolute;
            inset: -12px;

            border: 1px solid rgba(255, 214, 0, 0.05);
            border-radius: 40px;
        }

        .hero-icon img {
            width: 74px;
            height: 74px;
            object-fit: contain;
        }

        .hero h1 {
            max-width: 420px;

            font-size: clamp(34px, 9vw, 52px);
            line-height: 0.98;
            font-weight: 900;
            letter-spacing: -2.2px;
        }

        .hero h1 span {
            color: var(--gb-yellow);
        }

        .hero p {
            max-width: 340px;

            margin-top: 18px;

            color: var(--gb-muted);

            font-size: 15px;
            line-height: 1.55;
            font-weight: 500;
        }

        .role-section {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .role-title {
            margin-bottom: 12px;

            color: #8F8F8F;

            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.3px;
            text-transform: uppercase;
            text-align: center;
        }

        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .role-button {
            position: relative;

            min-height: 112px;

            padding: 18px 14px;

            border: 1px solid var(--gb-border);
            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.055),
                    rgba(255, 255, 255, 0.018)
                );

            color: var(--gb-white);

            cursor: pointer;

            text-align: left;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .role-button:active {
            transform: scale(0.97);
        }

        .role-button:hover {
            border-color: rgba(255, 214, 0, 0.35);
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 214, 0, 0.09),
                    rgba(255, 255, 255, 0.025)
                );
        }

        .role-icon {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 42px;
            height: 42px;

            margin-bottom: 12px;

            border-radius: 13px;

            background: var(--gb-yellow);
            color: #111;

            font-size: 20px;
            font-weight: 900;
        }

        .role-button strong {
            display: block;

            font-size: 15px;
            font-weight: 850;
        }

        .role-button small {
            display: block;

            margin-top: 4px;

            color: #888;

            font-size: 11px;
            line-height: 1.35;
        }

        .footer {
            padding-top: 18px;

            color: #666;

            font-size: 10px;
            font-weight: 600;

            text-align: center;
        }

        /* =========================================
           TOAST
        ========================================= */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 2000;

            width: max-content;
            max-width: calc(100vw - 40px);

            padding: 12px 16px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;

            background: rgba(20, 20, 20, 0.96);

            color: white;

            font-size: 13px;
            font-weight: 600;

            transform:
                translate(-50%, 20px);

            opacity: 0;
            pointer-events: none;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes logoEnter {
            0% {
                opacity: 0;
                transform: scale(0.55) rotate(-8deg);
            }

            65% {
                opacity: 1;
                transform: scale(1.06) rotate(1deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        @keyframes glowPulse {
            0%,
            100% {
                opacity: 0.45;
                transform: scale(0.92);
            }

            50% {
                opacity: 0.85;
                transform: scale(1.08);
            }
        }

        @keyframes textEnter {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loading {
            0% {
                transform: translateX(-120%);
            }

            50% {
                transform: translateX(130%);
            }

            100% {
                transform: translateX(320%);
            }
        }

        @media (min-width: 700px) {
            .welcome {
                padding-left: 40px;
                padding-right: 40px;
            }

            .hero-icon {
                width: 124px;
                height: 124px;
            }

            .hero-icon img {
                width: 84px;
                height: 84px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================================
         SPLASH SCREEN
    ========================================== -->

    <section
        id="splash"
        class="splash"
        aria-label="Go Bike loading"
    >
        <div class="splash-content">

            <div class="logo-wrap">

                <div class="logo-glow"></div>

                <img
                    class="logo"
                    src="assets/logo.svg"
                    alt="Go Bike"
                    onerror="this.onerror=null;this.src='assets/logo.png';"
                >

            </div>

            <div class="brand-name">
                GO <span>BIKE</span>
            </div>

            <div class="tagline">
                FAST. SIMPLE. DELIVERED.
            </div>

            <div
                class="loading"
                aria-hidden="true"
            >
                <div class="loading-bar"></div>
            </div>

        </div>
    </section>


    <!-- =========================================
         WELCOME / ROLE SELECTION
    ========================================== -->

    <main
        id="welcome"
        class="welcome"
    >

        <div class="top-brand">

            <img
                src="assets/logo.svg"
                alt="Go Bike"
                onerror="this.onerror=null;this.src='assets/logo.png';"
            >

            <strong>
                GO <span>BIKE</span>
            </strong>

        </div>


        <section class="hero">

            <div class="hero-icon">

                <img
                    src="assets/logo.svg"
                    alt=""
                    aria-hidden="true"
                    onerror="this.onerror=null;this.src='assets/logo.png';"
                >

            </div>

            <h1>
                Fast.
                <span>Simple.</span>
                Delivered.
            </h1>

            <p>
                Send parcels quickly and safely,
                or earn by delivering with Go Bike.
            </p>

        </section>


        <section class="role-section">

            <div class="role-title">
                Continue as
            </div>

            <div class="role-grid">

                <button
                    type="button"
                    class="role-button"
                    data-role="customer"
                    aria-label="Join as Customer"
                >

                    <span class="role-icon">
                        👤
                    </span>

                    <strong>
                        Customer
                    </strong>

                    <small>
                        Send a parcel
                    </small>

                </button>


                <button
                    type="button"
                    class="role-button"
                    data-role="driver"
                    aria-label="Join as Driver"
                >

                    <span class="role-icon">
                        🏍️
                    </span>

                    <strong>
                        Driver
                    </strong>

                    <small>
                        Earn with Go Bike
                    </small>

                </button>

            </div>

        </section>


        <footer class="footer">
            © <span id="year"></span> Go Bike. All rights reserved.
        </footer>

    </main>


    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>

</div>


<script>
(function () {

    "use strict";

    const splash = document.getElementById("splash");
    const welcome = document.getElementById("welcome");
    const toast = document.getElementById("toast");
    const year = document.getElementById("year");

    const SPLASH_DURATION = 1800;

    if (year) {
        year.textContent = new Date().getFullYear();
    }


    function showToast(message) {

        if (!toast) {
            return;
        }

        toast.textContent = message;
        toast.classList.add("show");

        window.clearTimeout(showToast.timer);

        showToast.timer = window.setTimeout(function () {
            toast.classList.remove("show");
        }, 2600);
    }


    function getStoredRole() {

        try {
            return localStorage.getItem("goBikeRole");
        } catch (error) {
            return null;
        }
    }


    function saveRole(role) {

        try {
            localStorage.setItem("goBikeRole", role);
        } catch (error) {
            // Storage may be unavailable in private/restricted browsers.
        }
    }


    function openRole(role) {

        if (role !== "customer" && role !== "driver") {
            return;
        }

        saveRole(role);

        /*
         * Authentication is intentionally handled by auth/ pages.
         *
         * Customer:
         * auth/login.html?role=customer
         *
         * Driver:
         * auth/login.html?role=driver
         */

        window.location.href =
            "auth/login.html?role=" +
            encodeURIComponent(role);
    }


    document
        .querySelectorAll(".role-button")
        .forEach(function (button) {

            button.addEventListener("click", function () {

                const role = button.dataset.role;

                if (!role) {
                    showToast("Please select an account type.");
                    return;
                }

                openRole(role);
            });

        });


    function showWelcome() {

        if (splash) {
            splash.classList.add("hidden");
        }

        if (welcome) {
            window.requestAnimationFrame(function () {
                welcome.classList.add("visible");
            });
        }
    }


    /*
     * Splash is intentionally short.
     * Returning users should never be forced to watch
     * a long animation on every launch.
     */

    window.setTimeout(
        showWelcome,
        SPLASH_DURATION
    );


    /*
     * If the page is restored from browser back/forward cache,
     * make sure the app is visible.
     */

    window.addEventListener(
        "pageshow",
        function (event) {

            if (event.persisted) {
                showWelcome();
            }

        }
    );


    /*
     * Prevent accidental double navigation.
     */

    let navigating = false;

    document
        .querySelectorAll(".role-button")
        .forEach(function (button) {

            button.addEventListener("click", function () {

                if (navigating) {
                    return;
                }

                navigating = true;

                button.style.pointerEvents = "none";

            }, {
                once: false
            });

        });

})();
</script>

</body>
</html>
