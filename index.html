<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <meta
        name="description"
        content="Go Bike — Fast, simple and reliable bike parcel delivery."
    >

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>Go Bike</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/favicon.png"
    >

    <style>
        :root {
            --black: #080808;
            --black-2: #101010;
            --yellow: #FFD600;
            --yellow-2: #FFE44D;
            --white: #FFFFFF;
            --muted: #8D8D8D;
            --border: rgba(255,255,255,.10);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--black);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            overflow-x: hidden;

            color: var(--white);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
        }

        /* =========================================
           APP
        ========================================== */

        .app {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 22%,
                    rgba(255,214,0,.10),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(255,214,0,.035),
                    transparent 35%
                ),
                var(--black);
        }

        /* =========================================
           SPLASH
        ========================================== */

        .splash {
            position: fixed;
            inset: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--black);

            transition:
                opacity .65s ease,
                visibility .65s ease;
        }

        .splash.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;

            transform: translateY(10px);

            animation:
                splashContent
                1s
                cubic-bezier(.22,1,.36,1)
                forwards;
        }

        @keyframes splashContent {

            to {
                transform: translateY(0);
            }

        }

        .logo-box {
            position: relative;

            width: 112px;
            height: 112px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;
        }

        .logo-glow {
            position: absolute;
            inset: 8px;

            border-radius: 34px;

            background: rgba(255,214,0,.12);

            filter: blur(20px);

            animation:
                glowPulse
                1.6s
                ease-in-out
                infinite;
        }

        @keyframes glowPulse {

            0%,
            100% {
                opacity: .45;
                transform: scale(.88);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }

        }

        .logo {
            position: relative;
            z-index: 2;

            width: 92px;
            height: 92px;

            object-fit: contain;

            animation:
                logoReveal
                .9s
                cubic-bezier(.22,1,.36,1)
                forwards;
        }

        @keyframes logoReveal {

            0% {
                opacity: 0;
                transform: scale(.65) rotate(-8deg);
            }

            70% {
                opacity: 1;
                transform: scale(1.06) rotate(1deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }

        }

        .splash-name {
            font-size: 30px;
            font-weight: 950;
            letter-spacing: -1.7px;

            opacity: 0;

            animation:
                nameReveal
                .7s
                .35s
                ease
                forwards;
        }

        .splash-name span {
            color: var(--yellow);
        }

        @keyframes nameReveal {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .splash-tagline {
            margin-top: 7px;

            color: #696969;

            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;

            opacity: 0;

            animation:
                nameReveal
                .7s
                .5s
                ease
                forwards;
        }

        /* =========================================
           MAIN
        ========================================== */

        .main {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(30px, env(safe-area-inset-top))
                22px
                max(28px, env(safe-area-inset-bottom));
        }

        .container {
            width: 100%;
            max-width: 480px;

            text-align: center;
        }

        .top-logo {
            width: 62px;
            height: 62px;

            object-fit: contain;

            margin-bottom: 20px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 7px 11px;

            margin-bottom: 15px;

            border: 1px solid rgba(255,214,0,.15);
            border-radius: 999px;

            background: rgba(255,214,0,.055);

            color: var(--yellow);

            font-size: 10px;
            font-weight: 850;
            letter-spacing: .8px;
            text-transform: uppercase;
        }

        .eyebrow-dot {
            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: var(--yellow);

            box-shadow:
                0 0 10px
                rgba(255,214,0,.8);
        }

        h1 {
            font-size: clamp(40px, 12vw, 62px);
            line-height: .92;

            font-weight: 950;
            letter-spacing: -3.5px;
        }

        h1 span {
            color: var(--yellow);
        }

        .subtitle {
            max-width: 390px;

            margin: 18px auto 0;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.55;
        }

        /* =========================================
           OPTIONS
        ========================================== */

        .options {
            display: grid;
            gap: 12px;

            margin-top: 34px;
        }

        .role-button {
            position: relative;

            width: 100%;
            min-height: 82px;

            display: flex;
            align-items: center;

            padding: 14px 16px;

            border: 1px solid var(--border);
            border-radius: 21px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.018)
                );

            color: var(--white);

            text-align: left;

            cursor: pointer;

            overflow: hidden;

            transition:
                transform .2s ease,
                border-color .2s ease,
                background .2s ease;
        }

        .role-button::after {
            content: "";

            position: absolute;

            width: 100px;
            height: 100px;

            right: -45px;
            bottom: -55px;

            border-radius: 50%;

            background: rgba(255,214,0,.08);
        }

        .role-button:hover {
            border-color: rgba(255,214,0,.35);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,214,0,.08),
                    rgba(255,255,255,.025)
                );
        }

        .role-button:active {
            transform: scale(.985);
        }

        .role-icon {
            width: 54px;
            height: 54px;

            flex: 0 0 54px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 14px;

            border-radius: 17px;

            background: rgba(255,214,0,.10);

            font-size: 25px;
        }

        .role-info {
            flex: 1;
        }

        .role-info strong {
            display: block;

            font-size: 15px;
            font-weight: 900;

            letter-spacing: -.2px;
        }

        .role-info small {
            display: block;

            margin-top: 5px;

            color: #777;

            font-size: 11px;
            line-height: 1.35;
        }

        .arrow {
            color: var(--yellow);

            font-size: 21px;
            font-weight: 700;
        }

        /* =========================================
           TRUST
        ========================================== */

        .trust {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;

            margin-top: 25px;
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 5px;

            color: #5F5F5F;

            font-size: 9px;
            font-weight: 700;
        }

        .trust-item span {
            color: #777;
            font-size: 12px;
        }

        /* =========================================
           FOOTER
        ========================================== */

        .footer {
            margin-top: 30px;

            color: #4E4E4E;

            font-size: 9px;
            line-height: 1.5;
        }

        .footer a {
            color: #777;
        }

        /* =========================================
           LOADING
        ========================================== */

        .screen-loading {
            position: fixed;
            inset: 0;
            z-index: 200;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(8,8,8,.88);

            backdrop-filter: blur(8px);
        }

        .screen-loading.show {
            display: flex;
        }

        .loader {
            width: 30px;
            height: 30px;

            border: 3px solid rgba(255,214,0,.18);
            border-top-color: var(--yellow);

            border-radius: 50%;

            animation:
                spin
                .7s
                linear
                infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        /* =========================================
           DESKTOP
        ========================================== */

        @media (min-width: 700px) {

            .main {
                padding-left: 40px;
                padding-right: 40px;
            }

            .role-button {
                min-height: 92px;
            }

        }

        /* =========================================
           REDUCED MOTION
        ========================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }

        }
    </style>
</head>

<body>

    <!-- =========================================
         SPLASH
    ========================================== -->

    <div
        id="splash"
        class="splash"
        aria-hidden="true"
    >

        <div class="splash-content">

            <div class="logo-box">

                <div class="logo-glow"></div>

                <img
                    class="logo"
                    src="assets/logo.svg"
                    alt="Go Bike"
                    onerror="
                        this.onerror=null;
                        this.src='assets/logo.png';
                    "
                >

            </div>

            <div class="splash-name">
                GO <span>BIKE</span>
            </div>

            <div class="splash-tagline">
                Fast • Simple • Reliable
            </div>

        </div>

    </div>


    <!-- =========================================
         MAIN SCREEN
    ========================================== -->

    <main class="main">

        <div class="container">

            <img
                class="top-logo"
                src="assets/logo.svg"
                alt="Go Bike"
                onerror="
                    this.onerror=null;
                    this.src='assets/logo.png';
                "
            >


            <div class="eyebrow">
                <span class="eyebrow-dot"></span>
                Bike Parcel Delivery
            </div>


            <h1>
                Move it.<br>
                <span>Go Bike.</span>
            </h1>


            <p class="subtitle">
                Send parcels quickly with trusted drivers,
                live tracking and transparent pricing.
            </p>


            <!-- =====================================
                 ROLE OPTIONS
            ====================================== -->

            <div class="options">

                <button
                    id="customerButton"
                    class="role-button"
                    type="button"
                >

                    <div class="role-icon">
                        📦
                    </div>

                    <div class="role-info">

                        <strong>
                            Join as Customer
                        </strong>

                        <small>
                            Book a bike parcel and track it live.
                        </small>

                    </div>

                    <div class="arrow">
                        →
                    </div>

                </button>


                <button
                    id="driverButton"
                    class="role-button"
                    type="button"
                >

                    <div class="role-icon">
                        🏍️
                    </div>

                    <div class="role-info">

                        <strong>
                            Join as Driver
                        </strong>

                        <small>
                            Deliver parcels and earn with Go Bike.
                        </small>

                    </div>

                    <div class="arrow">
                        →
                    </div>

                </button>

            </div>


            <!-- =====================================
                 TRUST
            ====================================== -->

            <div class="trust">

                <div class="trust-item">
                    <span>✓</span>
                    Live Tracking
                </div>

                <div class="trust-item">
                    <span>✓</span>
                    Transparent Fare
                </div>

                <div class="trust-item">
                    <span>✓</span>
                    Secure OTP
                </div>

            </div>


            <footer class="footer">

                By continuing, you agree to Go Bike's
                <a href="terms.html">
                    Terms
                </a>
                and
                <a href="privacy.html">
                    Privacy Policy
                </a>.

                <br><br>

                ©
                <span id="year"></span>
                Go Bike

            </footer>

        </div>

    </main>


    <!-- =========================================
         LOADING
    ========================================== -->

    <div
        id="screenLoading"
        class="screen-loading"
        aria-hidden="true"
    >

        <div class="loader"></div>

    </div>


    <script>
    (function () {

        "use strict";


        const splash =
            document.getElementById(
                "splash"
            );

        const customerButton =
            document.getElementById(
                "customerButton"
            );

        const driverButton =
            document.getElementById(
                "driverButton"
            );

        const screenLoading =
            document.getElementById(
                "screenLoading"
            );

        const year =
            document.getElementById(
                "year"
            );


        /* =====================================
           YEAR
        ====================================== */

        year.textContent =
            new Date().getFullYear();


        /* =====================================
           SPLASH

           First visit:
           Show full animation.

           Returning visit:
           Short splash so the app still feels
           branded without becoming annoying.
        ====================================== */

        const splashSeenKey =
            "goBikeSplashSeen";


        let splashDelay =
            1700;


        try {

            if (
                sessionStorage.getItem(
                    splashSeenKey
                ) === "1"
            ) {

                splashDelay = 700;

            }

        } catch (error) {

            // Storage can be unavailable.

        }


        window.setTimeout(
            function () {

                splash.classList.add(
                    "hide"
                );


                try {

                    sessionStorage.setItem(
                        splashSeenKey,
                        "1"
                    );

                } catch (error) {

                    // Ignore storage errors.

                }

            },
            splashDelay
        );


        /* =====================================
           NAVIGATION
        ====================================== */

        function openRole(
            selectedRole
        ) {

            screenLoading.classList.add(
                "show"
            );


            try {

                localStorage.setItem(
                    "goBikeRole",
                    selectedRole
                );

            } catch (error) {

                // Ignore storage errors.

            }


            window.setTimeout(
                function () {

                    window.location.href =
                        "auth/login.html?role=" +
                        encodeURIComponent(
                            selectedRole
                        );

                },
                220
            );

        }


        /* =====================================
           CUSTOMER
        ====================================== */

        customerButton.addEventListener(
            "click",
            function () {

                openRole(
                    "customer"
                );

            }
        );


        /* =====================================
           DRIVER
        ====================================== */

        driverButton.addEventListener(
            "click",
            function () {

                openRole(
                    "driver"
                );

            }
        );


        /* =====================================
           PREVENT ACCIDENTAL DOUBLE CLICK
        ====================================== */

        window.addEventListener(
            "pageshow",
            function () {

                screenLoading.classList.remove(
                    "show"
                );

            }
        );


    })();
    </script>

</body>
</html>
