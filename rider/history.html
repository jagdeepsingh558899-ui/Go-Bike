<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">

<title>Go Bike | Ride History</title>

<style>
:root{
    --black:#080808;
    --panel:#111;
    --panel2:#171717;
    --yellow:#ffd600;
    --white:#fff;
    --muted:#777;
    --muted2:#555;
    --border:rgba(255,255,255,.08);
    --green:#28d477;
    --red:#ff5656;
    --orange:#ffad32;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
    background:var(--black);
    color:var(--white);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    padding-bottom:30px;
}

button{
    font:inherit;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.page{
    width:100%;
    max-width:620px;
    min-height:100vh;
    margin:auto;
    padding:15px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    gap:11px;
}

.back{
    width:43px;
    height:43px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--panel);
    color:#fff;
    font-size:20px;
}

.header-copy{
    flex:1;
}

.header-copy strong{
    display:block;
    font-size:17px;
    font-weight:950;
}

.header-copy span{
    display:block;
    margin-top:2px;
    color:#666;
    font-size:8px;
}

/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:18px;
}

.summary-card{
    padding:14px 10px;
    border:1px solid var(--border);
    border-radius:15px;
    background:var(--panel);
    text-align:center;
}

.summary-card strong{
    display:block;
    font-size:17px;
    font-weight:950;
}

.summary-card span{
    display:block;
    margin-top:4px;
    color:#666;
    font-size:6px;
    font-weight:900;
    text-transform:uppercase;
}

.summary-card.completed strong{
    color:var(--green);
}

.summary-card.cancelled strong{
    color:var(--red);
}

/* FILTERS */

.section-title{
    margin:21px 3px 8px;
    color:#555;
    font-size:7px;
    font-weight:950;
    letter-spacing:.8px;
    text-transform:uppercase;
}

.filters{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.filter{
    min-height:41px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#121212;
    color:#777;
    font-size:8px;
    font-weight:950;
}

.filter.active{
    border-color:rgba(255,214,0,.4);
    background:rgba(255,214,0,.08);
    color:var(--yellow);
}

/* SEARCH */

.search{
    position:relative;
    margin-top:9px;
}

.search input{
    width:100%;
    height:44px;
    padding:0 14px 0 39px;
    border:1px solid var(--border);
    border-radius:13px;
    outline:none;
    background:var(--panel);
    color:#fff;
    font-size:9px;
}

.search input::placeholder{
    color:#555;
}

.search-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#666;
    font-size:13px;
}

/* HISTORY CARD */

.history-card{
    overflow:hidden;
    margin-top:10px;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--panel);
}

.history-header{
    min-height:51px;
    padding:0 14px;
    display:flex;
    align-items:center;
    border-bottom:1px solid var(--border);
}

.history-header strong{
    font-size:10px;
    font-weight:950;
}

.history-header span{
    margin-left:auto;
    color:#555;
    font-size:7px;
}

/* RIDE ITEM */

.ride{
    padding:14px;
    border-bottom:1px solid var(--border);
}

.ride:last-child{
    border-bottom:0;
}

.ride-top{
    display:flex;
    align-items:center;
    gap:10px;
}

.ride-icon{
    width:40px;
    height:40px;
    flex:0 0 40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:#1b1b1b;
    font-size:17px;
}

.ride-title{
    min-width:0;
    flex:1;
}

.ride-title strong{
    display:block;
    overflow:hidden;
    font-size:9px;
    font-weight:950;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.ride-title span{
    display:block;
    margin-top:4px;
    color:#666;
    font-size:6px;
}

.status{
    padding:5px 7px;
    border-radius:7px;
    font-size:6px;
    font-weight:950;
}

.status.completed{
    background:rgba(40,212,119,.1);
    color:var(--green);
}

.status.cancelled{
    background:rgba(255,86,86,.1);
    color:var(--red);
}

.status.ongoing{
    background:rgba(255,214,0,.1);
    color:var(--yellow);
}

.status.pending{
    background:rgba(255,173,50,.1);
    color:var(--orange);
}

/* ROUTE */

.route{
    margin-top:14px;
    padding-left:6px;
}

.route-row{
    position:relative;
    min-height:36px;
    padding-left:22px;
}

.route-row:first-child::after{
    content:"";
    position:absolute;
    left:5px;
    top:14px;
    width:1px;
    height:27px;
    background:#333;
}

.dot{
    position:absolute;
    left:1px;
    top:4px;
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--yellow);
}

.dot.drop{
    border-radius:2px;
    background:#fff;
}

.route-row span{
    display:block;
    overflow:hidden;
    color:#777;
    font-size:7px;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.route-row strong{
    display:block;
    margin-top:2px;
    overflow:hidden;
    color:#ddd;
    font-size:8px;
    white-space:nowrap;
    text-overflow:ellipsis;
}

/* RIDE META */

.ride-meta{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:11px;
}

.meta{
    padding:8px;
    border-radius:9px;
    background:#171717;
}

.meta span{
    display:block;
    color:#555;
    font-size:5px;
    font-weight:900;
    text-transform:uppercase;
}

.meta strong{
    display:block;
    margin-top:3px;
    color:#ddd;
    font-size:7px;
}

.earning{
    color:var(--green)!important;
}

/* DETAIL BUTTON */

.details-btn{
    width:100%;
    min-height:38px;
    margin-top:10px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#151515;
    color:#aaa;
    font-size:7px;
    font-weight:950;
}

.details-btn:active{
    transform:scale(.98);
}

/* EMPTY */

.empty{
    padding:45px 20px;
    text-align:center;
}

.empty-icon{
    font-size:30px;
}

.empty strong{
    display:block;
    margin-top:10px;
    font-size:10px;
}

.empty span{
    display:block;
    margin-top:5px;
    color:#555;
    font-size:7px;
}

/* MODAL */

.modal{
    position:fixed;
    z-index:1000;
    inset:0;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.75);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:620px;
    max-height:88vh;
    overflow:auto;
    padding:18px;
    border-radius:22px 22px 0 0;
    background:#121212;
    box-shadow:0 -20px 60px rgba(0,0,0,.5);
}

.modal-head{
    display:flex;
    align-items:center;
}

.modal-head strong{
    font-size:13px;
}

.modal-close{
    width:35px;
    height:35px;
    margin-left:auto;
    border:1px solid var(--border);
    border-radius:10px;
    background:#1b1b1b;
    color:#fff;
}

.detail-block{
    margin-top:15px;
    padding:13px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#171717;
}

.detail-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.detail-row:last-child{
    border-bottom:0;
}

.detail-row span{
    color:#666;
    font-size:7px;
}

.detail-row strong{
    max-width:65%;
    text-align:right;
    color:#ddd;
    font-size:8px;
}

/* LOADING */

.loading{
    position:fixed;
    z-index:2000;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#080808;
}

.loading.hide{
    display:none;
}

.spinner{
    width:34px;
    height:34px;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* TOAST */

.toast{
    position:fixed;
    z-index:3000;
    left:50%;
    bottom:24px;
    max-width:calc(100% - 30px);
    padding:10px 14px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#1a1a1a;
    color:#ddd;
    font-size:8px;
    font-weight:800;
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,10px);
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.footer{
    padding:22px 5px;
    text-align:center;
    color:#444;
    font-size:7px;
}

.footer span{
    color:var(--yellow);
}

@media(min-width:700px){

    .page{
        padding-top:25px;
    }

}
</style>
</head>

<body>

<main class="page">

    <header class="header">

        <button
            id="backButton"
            class="back"
            type="button">
            ←
        </button>

        <div class="header-copy">

            <strong>
                Ride History
            </strong>

            <span>
                Your complete Go Bike activity
            </span>

        </div>

    </header>


    <section class="summary">

        <div class="summary-card">

            <strong id="totalCount">
                0
            </strong>

            <span>
                Total Rides
            </span>

        </div>

        <div class="summary-card completed">

            <strong id="completedCount">
                0
            </strong>

            <span>
                Completed
            </span>

        </div>

        <div class="summary-card cancelled">

            <strong id="cancelledCount">
                0
            </strong>

            <span>
                Cancelled
            </span>

        </div>

    </section>


    <div class="section-title">
        Filter Rides
    </div>

    <div class="filters">

        <button
            class="filter active"
            data-filter="all"
            type="button">
            ALL
        </button>

        <button
            class="filter"
            data-filter="completed"
            type="button">
            COMPLETED
        </button>

        <button
            class="filter"
            data-filter="cancelled"
            type="button">
            CANCELLED
        </button>

    </div>


    <div class="search">

        <span class="search-icon">
            ⌕
        </span>

        <input
            id="searchInput"
            type="search"
            placeholder="Search ride, pickup or drop..."
            autocomplete="off">

    </div>


    <div class="section-title">
        Your Rides
    </div>


    <section class="history-card">

        <div class="history-header">

            <strong>
                Ride Activity
            </strong>

            <span id="resultCount">
                0 rides
            </span>

        </div>

        <div id="rideList">

            <div class="empty">

                <div class="empty-icon">
                    🛵
                </div>

                <strong>
                    No rides yet
                </strong>

                <span>
                    Your completed Go Bike rides will appear here.
                </span>

            </div>

        </div>

    </section>


    <footer class="footer">

        GO <span>BIKE</span>
        • Driver Ride History

    </footer>

</main>


<!-- DETAILS MODAL -->

<div
    id="detailsModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-head">

            <strong>
                Ride Details
            </strong>

            <button
                id="closeModal"
                class="modal-close"
                type="button">
                ×
            </button>

        </div>

        <div
            id="detailContent">
        </div>

    </div>

</div>


<div
    id="loading"
    class="loading">

    <div class="spinner"></div>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>
(function(){

"use strict";


const state = {

    driverId:null,

    rides:[],

    filter:"all",

    search:""

};


const $ =
    id => document.getElementById(id);


/* =========================================================
   DRIVER ID
========================================================= */

function getDriverId(){

    try{

        return (
            localStorage.getItem(
                "goBikeDriverId"
            ) ||
            localStorage.getItem(
                "driverId"
            ) ||
            localStorage.getItem(
                "userId"
            ) ||
            null
        );

    }catch(error){

        return null;

    }

}


/* =========================================================
   API
========================================================= */

function getApi(){

    return (
        window.GoBikeRideEngine ||
        window.GoBikeDriver ||
        window.GoBikeAuth ||
        null
    );

}


/* =========================================================
   NORMALIZE STATUS
========================================================= */

function normalizeStatus(
ride
){

    const status =
        String(
            ride.status ||
            ride.rideStatus ||
            ride.state ||
            ""
        ).toLowerCase()
        .trim();


    if(
        [
            "completed",
            "complete",
            "finished",
            "success"
        ].includes(status)
    ){

        return "completed";

    }


    if(
        [
            "cancelled",
            "canceled",
            "rejected"
        ].includes(status)
    ){

        return "cancelled";

    }


    if(
        [
            "accepted",
            "arriving",
            "arrived",
            "picked_up",
            "ongoing",
            "started"
        ].includes(status)
    ){

        return "ongoing";

    }


    return status ||
        "pending";

}


/* =========================================================
   DATE
========================================================= */

function getDate(
ride
){

    const value =
        ride.completedAt ||
        ride.cancelledAt ||
        ride.updatedAt ||
        ride.createdAt ||
        ride.timestamp;


    if(
        value instanceof Date
    ){

        return value;

    }


    if(
        value &&
        typeof value.toDate ===
        "function"
    ){

        try{

            return value.toDate();

        }catch(error){}

    }


    if(
        typeof value ===
        "number"
    ){

        return new Date(
            value
        );

    }


    if(
        typeof value ===
        "string"
    ){

        const date =
            new Date(
                value
            );


        if(
            !Number.isNaN(
                date.getTime()
            )
        ){

            return date;

        }

    }


    return null;

}


/* =========================================================
   NUMBER
========================================================= */

function num(
value
){

    const n =
        Number(value);


    return Number.isFinite(n)
        ? n
        : 0;

}


/* =========================================================
   MONEY
========================================================= */

function money(
value
){

    return "₹" +
        Math.max(
            0,
            Math.round(
                num(value)
            )
        ).toLocaleString(
            "en-IN"
        );

}


/* =========================================================
   EARNING
========================================================= */

function earning(
ride
){

    return num(

        ride.driverEarning ??
        ride.driverAmount ??
        ride.netDriverFare ??
        ride.driverFare ??
        ride.earning ??
        ride.earnings ??
        ride.amount ??
        ride.totalFare ??
        ride.fare ??
        0

    );

}


/* =========================================================
   FARE
========================================================= */

function fare(
ride
){

    return num(

        ride.customerFare ??
        ride.totalFare ??
        ride.fare ??
        ride.amount ??
        ride.price ??
        0

    );

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(
ride
){

    const value =
        ride.distanceKm ??
        ride.distance ??
        ride.km ??
        0;


    const n =
        num(value);


    if(
        n <= 0
    ){

        return "—";

    }


    return n.toFixed(
        n < 10 ? 1 : 0
    ) +
    " km";

}


/* =========================================================
   DURATION
========================================================= */

function duration(
ride
){

    const minutes =
        num(

            ride.durationMinutes ??
            ride.duration ??
            ride.timeMinutes ??
            0

        );


    if(
        minutes <= 0
    ){

        return "—";

    }


    if(
        minutes < 60
    ){

        return Math.round(
            minutes
        ) +
        " min";

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    const remaining =
        Math.round(
            minutes % 60
        );


    return (
        hours +
        "h " +
        remaining +
        "m"
    );

}


/* =========================================================
   PICKUP
========================================================= */

function pickup(
ride
){

    return (
        ride.pickupAddress ||
        ride.pickup?.address ||
        ride.pickup?.name ||
        ride.pickupLocation?.address ||
        ride.from ||
        "Pickup location"
    );

}


/* =========================================================
   DROP
========================================================= */

function drop(
ride
){

    return (
        ride.dropAddress ||
        ride.drop?.address ||
        ride.drop?.name ||
        ride.dropLocation?.address ||
        ride.to ||
        "Drop location"
    );

}


/* =========================================================
   SERVICE
========================================================= */

function service(
ride
){

    return (
        ride.serviceType ||
        ride.rideType ||
        ride.vehicleType ||
        "Bike"
    );

}


/* =========================================================
   RIDE ID
========================================================= */

function rideId(
ride
){

    return String(

        ride.id ||
        ride.rideId ||
        ride.bookingId ||
        "N/A"

    );

}


/* =========================================================
   NORMALIZE RIDES
========================================================= */

function normalizeRides(
value
){

    if(
        !Array.isArray(value)
    ){

        return [];

    }


    return value
        .filter(
            item =>
                item &&
                typeof item ===
                "object"
        )
        .map(
            item => ({

                ...item,

                normalizedStatus:
                    normalizeStatus(
                        item
                    )

            })
        );

}


/* =========================================================
   LOAD RIDES
========================================================= */

async function loadRides(){

    const api =
        getApi();


    if(
        api
    ){

        const methods = [

            "getDriverRideHistory",
            "getRideHistory",
            "getCompletedRides",
            "getDriverRides",
            "getRides"

        ];


        for(
            const method of methods
        ){

            if(
                typeof api[method] !==
                "function"
            ){

                continue;

            }


            try{

                const result =
                    await api[method](
                        state.driverId
                    );


                const rides =
                    Array.isArray(result)
                        ? result
                        : result?.rides;


                if(
                    Array.isArray(rides)
                ){

                    state.rides =
                        normalizeRides(
                            rides
                        );

                    return;

                }

            }catch(error){

                console.warn(
                    method,
                    error
                );

            }

        }

    }


    /* Firebase fallback */

    if(
        window.firebase &&
        firebase.firestore &&
        state.driverId
    ){

        try{

            const snapshot =
                await firebase.firestore()
                    .collection("rides")
                    .where(
                        "driverId",
                        "==",
                        state.driverId
                    )
                    .limit(200)
                    .get();


            const rides = [];


            snapshot.forEach(
                doc => {

                    rides.push({

                        id:doc.id,

                        ...doc.data()

                    });

                }
            );


            state.rides =
                normalizeRides(
                    rides
                );


            return;

        }catch(error){

            console.warn(
                "Firebase history:",
                error
            );

        }

    }


    /* Local fallback */

    try{

        const raw =
            localStorage.getItem(
                "goBikeRideHistory"
            );


        if(raw){

            state.rides =
                normalizeRides(
                    JSON.parse(
                        raw
                    )
                );

            return;

        }

    }catch(error){}


    state.rides = [];

}


/* =========================================================
   FILTER
========================================================= */

function filteredRides(){

    const query =
        state.search
            .trim()
            .toLowerCase();


    return [...state.rides]
        .filter(
            ride => {

                if(
                    state.filter !==
                    "all" &&
                    ride.normalizedStatus !==
                    state.filter
                ){

                    return false;

                }


                if(
                    !query
                ){

                    return true;

                }


                const searchable = [

                    rideId(ride),

                    pickup(ride),

                    drop(ride),

                    service(ride),

                    ride.status

                ]
                .join(" ")
                .toLowerCase();


                return searchable
                    .includes(
                        query
                    );

            }
        )
        .sort(
            (
                a,
                b
            ) => {

                const ad =
                    getDate(a)?.getTime() ||
                    0;


                const bd =
                    getDate(b)?.getTime() ||
                    0;


                return bd - ad;

            }
        );

}


/* =========================================================
   RENDER SUMMARY
========================================================= */

function renderSummary(){

    const total =
        state.rides.length;


    const completed =
        state.rides.filter(
            ride =>
                ride.normalizedStatus ===
                "completed"
        ).length;


    const cancelled =
        state.rides.filter(
            ride =>
                ride.normalizedStatus ===
                "cancelled"
        ).length;


    $("totalCount")
        .textContent =
        total;


    $("completedCount")
        .textContent =
        completed;


    $("cancelledCount")
        .textContent =
        cancelled;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    renderSummary();


    const rides =
        filteredRides();


    $("resultCount")
        .textContent =
        rides.length +
        (
            rides.length === 1
                ? " ride"
                : " rides"
        );


    const list =
        $("rideList");


    list.innerHTML = "";


    if(
        !rides.length
    ){

        list.innerHTML =

            '<div class="empty">' +

                '<div class="empty-icon">🛵</div>' +

                '<strong>No rides found</strong>' +

                '<span>Try another filter or search.</span>' +

            '</div>';

        return;

    }


    rides.forEach(
        (ride,index) => {

            list.appendChild(
                createRideCard(
                    ride,
                    index
                )
            );

        }
    );

}


/* =========================================================
   CREATE CARD
========================================================= */

function createRideCard(
ride,
index
){

    const article =
        document.createElement(
            "article"
        );


    article.className =
        "ride";


    const status =
        ride.normalizedStatus;


    const statusText =
        status === "completed"
            ? "COMPLETED"
            : status === "cancelled"
                ? "CANCELLED"
                : status === "ongoing"
                    ? "ONGOING"
                    : "PENDING";


    const date =
        getDate(
            ride
        );


    article.innerHTML =

        '<div class="ride-top">' +

            '<div class="ride-icon">🛵</div>' +

            '<div class="ride-title">' +

                '<strong></strong>' +

                '<span></span>' +

            '</div>' +

            '<span class="status ' +
                status +
            '">' +
                statusText +
            '</span>' +

        '</div>' +


        '<div class="route">' +

            '<div class="route-row">' +

                '<i class="dot"></i>' +

                '<span>PICKUP</span>' +

                '<strong class="pickup-text"></strong>' +

            '</div>' +

            '<div class="route-row">' +

                '<i class="dot drop"></i>' +

                '<span>DROP</span>' +

                '<strong class="drop-text"></strong>' +

            '</div>' +

        '</div>' +


        '<div class="ride-meta">' +

            '<div class="meta">' +

                '<span>Distance</span>' +

                '<strong>' +
                    escapeHtml(
                        distance(ride)
                    ) +
                '</strong>' +

            '</div>' +

            '<div class="meta">' +

                '<span>Time</span>' +

                '<strong>' +
                    escapeHtml(
                        duration(ride)
                    ) +
                '</strong>' +

            '</div>' +

            '<div class="meta">' +

                '<span>Driver Earning</span>' +

                '<strong class="earning">' +
                    escapeHtml(
                        money(
                            earning(ride)
                        )
                    ) +
                '</strong>' +

            '</div>' +

        '</div>' +


        '<button class="details-btn" type="button">' +

            'VIEW RIDE DETAILS' +

        '</button>';


    article
        .querySelector(
            ".ride-title strong"
        )
        .textContent =
        service(ride) +
        " • #" +
        rideId(ride).slice(-8);


    article
        .querySelector(
            ".ride-title span"
        )
        .textContent =
        formatDate(
            date
        );


    article
        .querySelector(
            ".pickup-text"
        )
        .textContent =
        pickup(ride);


    article
        .querySelector(
            ".drop-text"
        )
        .textContent =
        drop(ride);


    article
        .querySelector(
            ".details-btn"
        )
        .addEventListener(
            "click",
            () => openDetails(ride)
        );


    return article;

}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(
date
){

    if(
        !date
    ){

        return "Date unavailable";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    ) +
    " • " +
    date.toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   DETAILS
========================================================= */

function openDetails(
ride
){

    const status =
        ride.normalizedStatus;


    const statusText =
        status.toUpperCase();


    const pickupAddress =
        pickup(ride);


    const dropAddress =
        drop(ride);


    const customerFare =
        fare(ride);


    const driverEarning =
        earning(ride);


    const commission =
        num(
            ride.commission ??
            ride.platformFee ??
            Math.max(
                0,
                customerFare -
                driverEarning
            )
        );


    const otpPickup =
        ride.pickupOtp ||
        ride.pickupOTP ||
        ride.startOtp ||
        "—";


    const otpDrop =
        ride.dropOtp ||
        ride.dropOTP ||
        ride.endOtp ||
        "—";


    $("detailContent")
        .innerHTML =

        '<div class="detail-block">' +

            detailRow(
                "Status",
                statusText
            ) +

            detailRow(
                "Ride ID",
                rideId(ride)
            ) +

            detailRow(
                "Service",
                service(ride)
            ) +

            detailRow(
                "Date & Time",
                formatDate(
                    getDate(ride)
                )
            ) +

        '</div>' +


        '<div class="detail-block">' +

            detailRow(
                "Pickup",
                pickupAddress
            ) +

            detailRow(
                "Drop",
                dropAddress
            ) +

            detailRow(
                "Distance",
                distance(ride)
            ) +

            detailRow(
                "Duration",
                duration(ride)
            ) +

        '</div>' +


        '<div class="detail-block">' +

            detailRow(
                "Customer Fare",
                money(
                    customerFare
                )
            ) +

            detailRow(
                "Go Bike Commission",
                "-" +
                money(
                    commission
                )
            ) +

            detailRow(
                "Driver Earning",
                money(
                    driverEarning
                )
            ) +

        '</div>' +


        '<div class="detail-block">' +

            detailRow(
                "Pickup OTP",
                otpPickup
            ) +

            detailRow(
                "Drop OTP",
                otpDrop
            ) +

        '</div>';


    $("detailsModal")
        .classList.add(
            "show"
        );

}


/* =========================================================
   DETAIL ROW
========================================================= */

function detailRow(
label,
value
){

    return (

        '<div class="detail-row">' +

            '<span>' +
                escapeHtml(
                    label
                ) +
            '</span>' +

            '<strong>' +
                escapeHtml(
                    value
                ) +
            '</strong>' +

        '</div>'

    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   FILTER EVENTS
========================================================= */

document
    .querySelectorAll(
        ".filter"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    document
                        .querySelectorAll(
                            ".filter"
                        )
                        .forEach(
                            item =>
                                item.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    this.classList.add(
                        "active"
                    );


                    state.filter =
                        this.dataset.filter ||
                        "all";


                    render();

                }
            );

        }
    );


/* =========================================================
   SEARCH
========================================================= */

$("searchInput")
    .addEventListener(
        "input",
        function(){

            state.search =
                this.value;


            render();

        }
    );


/* =========================================================
   MODAL
========================================================= */

function closeModal(){

    $("detailsModal")
        .classList.remove(
            "show"
        );

}


$("closeModal")
    .addEventListener(
        "click",
        closeModal
    );


$("detailsModal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                closeModal();

            }

        }
    );


/* =========================================================
   BACK
========================================================= */

$("backButton")
    .addEventListener(
        "click",
        function(){

            if(
                document.referrer &&
                document.referrer.includes(
                    "/rider/"
                )
            ){

                history.back();

            }else{

                window.location.href =
                    "home.html";

            }

        }
    );


/* =========================================================
   TOAST
========================================================= */

function showToast(
message
){

    const toast =
        $("toast");


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2300
    );

}


/* =========================================================
   INIT
========================================================= */

async function init(){

    state.driverId =
        getDriverId();


    try{

        await loadRides();

    }catch(error){

        console.error(
            "History initialization:",
            error
        );

        showToast(
            "Ride history could not be loaded."
        );

    }


    render();


    $("loading")
        .classList.add(
            "hide"
        );

}


document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            loadRides()
                .then(
                    render
                )
                .catch(
                    console.error
                );

        }

    }
);


init();

})();
</script>

</body>
</html>
