<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    >

    <meta name="theme-color" content="#080808">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Go Bike | Live Ride</title>

    <style>
        :root{
            --black:#080808;
            --panel:#111;
            --yellow:#ffd600;
            --white:#fff;
            --muted:#777;
            --red:#ff5252;
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        html,
        body{
            width:100%;
            min-height:100%;
            background:var(--black);
            color:var(--white);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .loader{
            width:100%;
            max-width:430px;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:25px;
            background:var(--black);
        }

        .card{
            width:100%;
            padding:28px 22px;
            border:1px solid rgba(255,255,255,.08);
            border-radius:24px;
            background:
                linear-gradient(
                    180deg,
                    #151515,
                    #0d0d0d
                );
            text-align:center;
            box-shadow:
                0 20px 60px rgba(0,0,0,.45);
        }

        .logo{
            width:64px;
            height:64px;
            margin:0 auto 18px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:20px;
            background:var(--yellow);
            color:#080808;
            font-size:28px;
            font-weight:1000;
            box-shadow:
                0 0 35px rgba(255,214,0,.15);
        }

        h1{
            font-size:18px;
            font-weight:950;
        }

        p{
            margin-top:8px;
            color:var(--muted);
            font-size:11px;
            line-height:1.6;
        }

        .spinner{
            width:32px;
            height:32px;
            margin:22px auto 0;
            border:3px solid rgba(255,255,255,.08);
            border-top-color:var(--yellow);
            border-radius:50%;
            animation:spin .75s linear infinite;
        }

        .error{
            display:none;
            margin-top:18px;
            padding:12px;
            border-radius:12px;
            background:rgba(255,82,82,.08);
            border:1px solid rgba(255,82,82,.18);
            color:#ff8585;
            font-size:10px;
            line-height:1.5;
        }

        .error.show{
            display:block;
        }

        .buttons{
            display:none;
            gap:8px;
            margin-top:14px;
        }

        .buttons.show{
            display:grid;
            grid-template-columns:1fr 1fr;
        }

        button{
            min-height:44px;
            border:0;
            border-radius:12px;
            background:#1b1b1b;
            color:#aaa;
            font-size:10px;
            font-weight:900;
        }

        button.primary{
            background:var(--yellow);
            color:#080808;
        }

        @keyframes spin{
            to{
                transform:rotate(360deg);
            }
        }
    </style>
</head>

<body>

<main class="loader">

    <section class="card">

        <div class="logo">
            GB
        </div>

        <h1>
            Opening Live Ride
        </h1>

        <p id="message">
            Checking your active Go Bike ride...
        </p>

        <div
            id="spinner"
            class="spinner">
        </div>

        <div
            id="error"
            class="error">
        </div>

        <div
            id="buttons"
            class="buttons">

            <button
                id="backButton"
                type="button">
                MY RIDES
            </button>

            <button
                id="retryButton"
                class="primary"
                type="button">
                TRY AGAIN
            </button>

        </div>

    </section>

</main>


<script>
(function(){

    "use strict";


    /*
     * =====================================================
     * GO BIKE
     * RIDER LIVE ENTRY CONTROLLER
     *
     * This page intentionally does NOT contain another
     * live map.
     *
     * Its only job is to safely resolve the active ride
     * and forward the driver to:
     *
     * rider/live-map.html
     * =====================================================
     */


    const MAP_PAGE =
        "live-map.html";

    const RIDES_PAGE =
        "rides.html";

    const LOGIN_PAGE =
        "../auth/login.html";


    const $ = id =>
        document.getElementById(id);


    let redirecting = false;


    /*
     * -----------------------------------------------------
     * UI
     * -----------------------------------------------------
     */

    function message(text){

        $("message")
            .textContent =
            text;

    }


    function showError(text){

        $("spinner")
            .style.display =
            "none";

        $("error")
            .textContent =
            text;

        $("error")
            .classList.add(
                "show"
            );

        $("buttons")
            .classList.add(
                "show"
            );

    }


    function hideError(){

        $("error")
            .classList.remove(
                "show"
            );

        $("buttons")
            .classList.remove(
                "show"
            );

        $("spinner")
            .style.display =
            "block";

    }


    /*
     * -----------------------------------------------------
     * QUERY PARAMETERS
     * -----------------------------------------------------
     */

    function getQuery(){

        return new URLSearchParams(
            window.location.search
        );

    }


    function cleanValue(value){

        if(
            value === null ||
            value === undefined
        ){

            return "";

        }

        return String(value)
            .trim();

    }


    /*
     * -----------------------------------------------------
     * ACTIVE RIDE STORAGE
     *
     * Several storage names are supported so the page
     * remains compatible with the rest of the Go Bike
     * project while we move toward one canonical key.
     * -----------------------------------------------------
     */

    function readJsonStorage(
        storage,
        key
    ){

        try{

            const value =
                storage.getItem(
                    key
                );

            if(!value){
                return null;
            }

            return JSON.parse(
                value
            );

        }catch(error){

            return null;

        }

    }


    function getStoredRide(){

        const keys = [

            "goBikeActiveRide",
            "gobikeActiveRide",
            "activeGoBikeRide",
            "activeRide",
            "currentRide",
            "goBikeRide",
            "gobikeRide"

        ];


        for(
            const key
            of keys
        ){

            const sessionRide =
                readJsonStorage(
                    sessionStorage,
                    key
                );


            if(
                sessionRide &&
                typeof sessionRide ===
                "object"
            ){

                return sessionRide;

            }


            const localRide =
                readJsonStorage(
                    localStorage,
                    key
                );


            if(
                localRide &&
                typeof localRide ===
                "object"
            ){

                return localRide;

            }

        }


        return null;

    }


    /*
     * -----------------------------------------------------
     * RIDE ID RESOLUTION
     * -----------------------------------------------------
     */

    function getRideId(
        ride,
        query
    ){

        const queryId =
            cleanValue(
                query.get(
                    "rideId"
                )
            );


        if(queryId){
            return queryId;
        }


        if(!ride){
            return "";
        }


        const candidates = [

            ride.id,
            ride.rideId,
            ride.requestId,
            ride.rideID,
            ride.bookingId,
            ride.bookingID

        ];


        for(
            const value
            of candidates
        ){

            const id =
                cleanValue(
                    value
                );


            if(id){
                return id;
            }

        }


        return "";

    }


    /*
     * -----------------------------------------------------
     * STAGE RESOLUTION
     * -----------------------------------------------------
     */

    function getStage(
        ride,
        query
    ){

        const queryStage =
            cleanValue(
                query.get(
                    "stage"
                )
            );


        if(
            queryStage ===
            "pickup" ||
            queryStage ===
            "drop"
        ){

            return queryStage;

        }


        if(!ride){

            return "pickup";

        }


        const status =
            cleanValue(
                ride.status ||
                ride.rideStatus ||
                ride.stage
            )
            .toLowerCase();


        if([

            "in_progress",
            "in-progress",
            "started",
            "ongoing",
            "picked_up",
            "picked-up",
            "to_drop",
            "drop"

        ].includes(status)){

            return "drop";

        }


        return "pickup";

    }


    /*
     * -----------------------------------------------------
     * BASIC RIDE VALIDATION
     * -----------------------------------------------------
     */

    function isUsableRide(
        ride
    ){

        if(
            !ride ||
            typeof ride !==
            "object"
        ){

            return false;

        }


        const id =
            cleanValue(
                ride.id ||
                ride.rideId ||
                ride.requestId ||
                ride.bookingId
            );


        return Boolean(
            id
        );

    }


    /*
     * -----------------------------------------------------
     * COMPLETED/CANCELLED RIDE CHECK
     *
     * A completed ride should not be reopened through
     * this entry controller.
     * -----------------------------------------------------
     */

    function isClosedRide(
        ride
    ){

        if(!ride){
            return false;
        }


        const status =
            cleanValue(
                ride.status ||
                ride.rideStatus
            )
            .toLowerCase();


        return [

            "completed",
            "complete",
            "finished",
            "cancelled",
            "canceled",
            "rejected",
            "declined"

        ].includes(
            status
        );

    }


    /*
     * -----------------------------------------------------
     * AUTH CHECK
     *
     * We intentionally support Firebase if it has already
     * been initialized by the project. If auth is not
     * available, the controller does not falsely reject the
     * user because live.html can also be entered from an
     * existing driver session.
     * -----------------------------------------------------
     */

    function getCurrentUser(){

        try{

            if(
                window.firebase &&
                firebase.auth &&
                typeof firebase
                    .auth ===
                    "function"
            ){

                return firebase
                    .auth()
                    .currentUser ||
                    null;

            }

        }catch(error){

            console.warn(
                "Go Bike auth:",
                error
            );

        }


        return null;

    }


    /*
     * -----------------------------------------------------
     * BUILD DESTINATION
     * -----------------------------------------------------
     */

    function buildMapUrl(
        rideId,
        stage
    ){

        const params =
            new URLSearchParams();


        params.set(
            "rideId",
            rideId
        );


        params.set(
            "stage",
            stage
        );


        return (
            MAP_PAGE +
            "?" +
            params.toString()
        );

    }


    /*
     * -----------------------------------------------------
     * SAVE CANONICAL ACTIVE RIDE
     * -----------------------------------------------------
     *
     * live-map.html reads this key first.
     * -----------------------------------------------------
     */

    function saveCanonicalRide(
        ride
    ){

        if(!ride){
            return;
        }


        try{

            sessionStorage.setItem(
                "goBikeActiveRide",
                JSON.stringify(
                    ride
                )
            );

        }catch(error){

            console.warn(
                "Session storage:",
                error
            );

        }


        /*
         * Do not blindly create multiple long-lived local
         * copies. Session storage is the canonical bridge
         * for this live navigation flow.
         */

    }


    /*
     * -----------------------------------------------------
     * OPEN LIVE MAP
     * -----------------------------------------------------
     */

    function openLiveMap(
        rideId,
        stage,
        ride
    ){

        if(redirecting){
            return;
        }


        redirecting =
            true;


        saveCanonicalRide(
            ride
        );


        message(
            "Opening your live navigation..."
        );


        $("spinner")
            .style.display =
            "block";


        window.location.replace(
            buildMapUrl(
                rideId,
                stage
            )
        );

    }


    /*
     * -----------------------------------------------------
     * OPTIONAL PROJECT API
     * -----------------------------------------------------
     */

    function getRideEngine(){

        return (

            window.GoBikeRideEngine ||
            window.GoBikeDriver ||
            window.GoBikeRides ||
            window.GoBikeAPI ||
            null

        );

    }


    async function fetchRideFromEngine(
        rideId
    ){

        const api =
            getRideEngine();


        if(
            !api ||
            !rideId
        ){

            return null;

        }


        const methods = [

            "getRide",
            "getRideById",
            "getDriverRide",
            "getActiveRide",
            "fetchRide"

        ];


        for(
            const method
            of methods
        ){

            if(
                typeof api[method] !==
                "function"
            ){

                continue;

            }


            try{

                const result =
                    await api[method](
                        rideId
                    );


                const ride =
                    result?.ride ||
                    result?.data ||
                    result;


                if(
                    ride &&
                    typeof ride ===
                    "object"
                ){

                    return ride;

                }

            }catch(error){

                console.warn(
                    "Go Bike ride engine:",
                    method,
                    error
                );

            }

        }


        return null;

    }


    /*
     * -----------------------------------------------------
     * FIRESTORE FALLBACK
     * -----------------------------------------------------
     */

    async function fetchRideFromFirestore(
        rideId
    ){

        if(
            !rideId ||
            !window.firebase ||
            !firebase.firestore
        ){

            return null;

        }


        try{

            const snapshot =
                await firebase
                    .firestore()
                    .collection(
                        "rides"
                    )
                    .doc(
                        rideId
                    )
                    .get();


            if(
                !snapshot.exists
            ){

                return null;

            }


            return {

                id:
                    snapshot.id,

                ...snapshot.data()

            };

        }catch(error){

            console.warn(
                "Go Bike Firestore:",
                error
            );


            return null;

        }

    }


    /*
     * -----------------------------------------------------
     * REAL ACTIVE RIDE RESOLUTION
     * -----------------------------------------------------
     */

    async function resolveRide(){

        const query =
            getQuery();


        let ride =
            getStoredRide();


        let rideId =
            getRideId(
                ride,
                query
            );


        /*
         * If URL contains a rideId, it has priority.
         * This prevents an old stored ride from opening
         * accidentally when the driver clicked a new ride.
         */

        if(rideId){

            const engineRide =
                await fetchRideFromEngine(
                    rideId
                );


            if(engineRide){

                ride =
                    {
                        ...(ride || {}),
                        ...engineRide
                    };

            }else{

                const firestoreRide =
                    await fetchRideFromFirestore(
                        rideId
                    );


                if(firestoreRide){

                    ride =
                        {
                            ...(ride || {}),
                            ...firestoreRide
                        };

                }

            }

        }


        if(
            !ride &&
            !rideId
        ){

            /*
             * No ride in URL and no active ride in storage.
             */

            return {

                ride:null,

                rideId:"",

                stage:"pickup"

            };

        }


        rideId =
            getRideId(
                ride,
                query
            );


        const stage =
            getStage(
                ride,
                query
            );


        return {

            ride,

            rideId,

            stage

        };

    }


    /*
     * -----------------------------------------------------
     * DRIVER OWNERSHIP CHECK
     * -----------------------------------------------------
     *
     * This is only a client-side navigation safeguard.
     * Actual ride ownership must always be enforced by
     * Firebase Security Rules/backend.
     * -----------------------------------------------------
     */

    function belongsToCurrentDriver(
        ride
    ){

        if(!ride){
            return true;
        }


        const user =
            getCurrentUser();


        if(!user){
            return true;
        }


        const driverId =
            cleanValue(
                ride.driverId ||
                ride.riderId ||
                ride.assignedDriverId ||
                ride.acceptedBy
            );


        if(!driverId){
            return true;
        }


        return (
            driverId ===
            user.uid
        );

    }


    /*
     * -----------------------------------------------------
     * MAIN
     * -----------------------------------------------------
     */

    async function init(){

        hideError();


        message(
            "Checking your active Go Bike ride..."
        );


        try{

            const result =
                await resolveRide();


            const ride =
                result.ride;


            const rideId =
                result.rideId;


            const stage =
                result.stage;


            if(
                !rideId
            ){

                showError(
                    "No active ride was found. Open a ride from My Rides first."
                );

                return;

            }


            if(
                ride &&
                isClosedRide(
                    ride
                )
            ){

                showError(
                    "This ride is already completed or cancelled."
                );

                return;

            }


            if(
                ride &&
                !belongsToCurrentDriver(
                    ride
                )
            ){

                showError(
                    "This ride is not assigned to your driver account."
                );

                return;

            }


            /*
             * If we only have rideId, live-map.html can still
             * resolve the ride through its own Firebase/API
             * logic.
             */

            message(
                "Ride found. Starting live navigation..."
            );


            setTimeout(
                () => {

                    openLiveMap(
                        rideId,
                        stage,
                        ride
                    );

                },
                250
            );

        }catch(error){

            console.error(
                "Go Bike live controller:",
                error
            );


            showError(
                "Unable to open the live ride. Please try again."
            );

        }

    }


    /*
     * -----------------------------------------------------
     * BUTTONS
     * -----------------------------------------------------
     */

    $("backButton")
        .addEventListener(
            "click",
            function(){

                window.location.href =
                    RIDES_PAGE;

            }
        );


    $("retryButton")
        .addEventListener(
            "click",
            function(){

                redirecting =
                    false;

                init();

            }
        );


    /*
     * -----------------------------------------------------
     * START
     * -----------------------------------------------------
     */

    init();

})();
</script>

</body>
</html>
