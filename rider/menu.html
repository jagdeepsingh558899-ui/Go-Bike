<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    >

    <meta name="theme-color" content="#080808">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Go Bike | Driver Menu</title>

    <style>
        :root{
            --black:#080808;
            --panel:#111111;
            --panel2:#171717;
            --yellow:#ffd600;
            --white:#ffffff;
            --muted:#8c8c8c;
            --border:rgba(255,255,255,.08);
            --red:#ff5252;
            --green:#22c55e;
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        html,
        body{
            width:100%;
            min-height:100%;
            background:var(--black);
            color:var(--white);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        body{
            min-height:100vh;
            overflow-x:hidden;
        }

        .page{
            width:100%;
            max-width:520px;
            min-height:100vh;
            margin:0 auto;
            padding:
                calc(14px + env(safe-area-inset-top))
                15px
                calc(24px + env(safe-area-inset-bottom));
        }

        .header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            margin-bottom:20px;
        }

        .back-btn,
        .notification-btn{
            width:44px;
            height:44px;
            border:1px solid var(--border);
            border-radius:14px;
            background:var(--panel);
            color:var(--white);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            font-weight:900;
            cursor:pointer;
        }

        .title{
            flex:1;
            text-align:center;
        }

        .title h1{
            font-size:18px;
            font-weight:950;
        }

        .title p{
            margin-top:3px;
            color:var(--muted);
            font-size:9px;
            font-weight:700;
        }

        .profile-card{
            position:relative;
            overflow:hidden;
            padding:18px;
            border-radius:23px;
            background:
                linear-gradient(
                    135deg,
                    #1b1b1b,
                    #101010
                );
            border:1px solid var(--border);
            box-shadow:0 15px 40px rgba(0,0,0,.25);
        }

        .profile-card::after{
            content:"";
            position:absolute;
            width:150px;
            height:150px;
            right:-75px;
            top:-75px;
            border-radius:50%;
            background:rgba(255,214,0,.07);
        }

        .profile-row{
            position:relative;
            z-index:2;
            display:flex;
            align-items:center;
            gap:13px;
        }

        .avatar{
            width:58px;
            height:58px;
            flex-shrink:0;
            border-radius:19px;
            background:var(--yellow);
            color:#080808;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            font-weight:1000;
            overflow:hidden;
        }

        .avatar img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:none;
        }

        .profile-info{
            min-width:0;
            flex:1;
        }

        .profile-name{
            font-size:15px;
            font-weight:950;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .profile-phone{
            margin-top:4px;
            color:var(--muted);
            font-size:9px;
            font-weight:700;
        }

        .profile-role{
            display:inline-flex;
            align-items:center;
            gap:5px;
            margin-top:8px;
            padding:5px 8px;
            border-radius:8px;
            background:rgba(255,214,0,.1);
            color:var(--yellow);
            font-size:8px;
            font-weight:900;
        }

        .profile-role::before{
            content:"";
            width:5px;
            height:5px;
            border-radius:50%;
            background:var(--yellow);
        }

        .edit-btn{
            position:relative;
            z-index:3;
            width:35px;
            height:35px;
            border:1px solid var(--border);
            border-radius:11px;
            background:#191919;
            color:var(--white);
            font-size:13px;
            cursor:pointer;
        }

        .section-title{
            margin:
                23px
                4px
                9px;
            color:#777;
            font-size:9px;
            font-weight:900;
            text-transform:uppercase;
            letter-spacing:.8px;
        }

        .menu-list{
            display:flex;
            flex-direction:column;
            gap:7px;
        }

        .menu-item{
            width:100%;
            min-height:58px;
            display:flex;
            align-items:center;
            gap:12px;
            padding:10px 12px;
            border:1px solid var(--border);
            border-radius:17px;
            background:var(--panel);
            color:var(--white);
            text-align:left;
            cursor:pointer;
            transition:
                transform .15s ease,
                background .15s ease;
        }

        .menu-item:active{
            transform:scale(.985);
            background:#191919;
        }

        .menu-icon{
            width:38px;
            height:38px;
            flex-shrink:0;
            border-radius:12px;
            background:#191919;
            display:flex;
            align-items:center;
            justify-content:center;
            color:var(--yellow);
            font-size:17px;
            font-weight:900;
        }

        .menu-content{
            min-width:0;
            flex:1;
        }

        .menu-name{
            font-size:11px;
            font-weight:900;
        }

        .menu-description{
            margin-top:3px;
            color:var(--muted);
            font-size:8px;
            line-height:1.3;
        }

        .arrow{
            color:#555;
            font-size:18px;
            font-weight:900;
        }

        .badge{
            min-width:18px;
            height:18px;
            padding:0 5px;
            border-radius:9px;
            background:var(--yellow);
            color:#080808;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:8px;
            font-weight:1000;
        }

        .status-card{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            margin-top:8px;
            padding:13px;
            border-radius:17px;
            background:#111;
            border:1px solid var(--border);
        }

        .status-info{
            min-width:0;
        }

        .status-title{
            font-size:10px;
            font-weight:900;
        }

        .status-subtitle{
            margin-top:3px;
            color:var(--muted);
            font-size:8px;
        }

        .status-pill{
            display:flex;
            align-items:center;
            gap:6px;
            padding:7px 9px;
            border-radius:10px;
            background:#191919;
            color:#999;
            font-size:8px;
            font-weight:900;
        }

        .status-dot{
            width:6px;
            height:6px;
            border-radius:50%;
            background:#666;
        }

        .status-pill.online{
            color:var(--green);
        }

        .status-pill.online .status-dot{
            background:var(--green);
        }

        .danger{
            color:#ff8585;
        }

        .danger .menu-icon{
            color:var(--red);
        }

        .version{
            margin-top:24px;
            text-align:center;
            color:#4f4f4f;
            font-size:8px;
            line-height:1.6;
        }

        .notification-dot{
            position:absolute;
            width:7px;
            height:7px;
            margin-left:26px;
            margin-top:-25px;
            border-radius:50%;
            background:var(--yellow);
            box-shadow:0 0 0 3px #111;
            display:none;
        }

        .notification-dot.show{
            display:block;
        }

        .modal{
            position:fixed;
            inset:0;
            z-index:5000;
            display:none;
            align-items:flex-end;
            justify-content:center;
            background:rgba(0,0,0,.65);
            backdrop-filter:blur(5px);
            -webkit-backdrop-filter:blur(5px);
        }

        .modal.show{
            display:flex;
        }

        .modal-card{
            width:100%;
            max-width:520px;
            padding:
                20px
                17px
                calc(18px + env(safe-area-inset-bottom));
            border-radius:25px 25px 0 0;
            background:#121212;
            border-top:1px solid var(--border);
        }

        .modal-handle{
            width:38px;
            height:4px;
            margin:0 auto 17px;
            border-radius:10px;
            background:#3d3d3d;
        }

        .modal-title{
            font-size:16px;
            font-weight:950;
        }

        .modal-text{
            margin-top:7px;
            color:#888;
            font-size:10px;
            line-height:1.55;
        }

        .modal-actions{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:9px;
            margin-top:18px;
        }

        .modal-btn{
            min-height:45px;
            border:0;
            border-radius:13px;
            background:#202020;
            color:#fff;
            font-size:10px;
            font-weight:900;
            cursor:pointer;
        }

        .modal-btn.primary{
            background:var(--yellow);
            color:#080808;
        }

        .modal-btn.danger-btn{
            background:#2a1212;
            color:#ff8b8b;
        }
    </style>
</head>

<body>

<main class="page">

    <header class="header">

        <button
            id="backButton"
            class="back-btn"
            type="button"
            aria-label="Back">
            ←
        </button>

        <div class="title">
            <h1>Go Bike</h1>
            <p>Driver Menu</p>
        </div>

        <button
            id="notificationButton"

            type="button"
            aria-label="Notifications">
            ♢
            <span

    </header>


    <!-- PROFILE -->

    <section class="profile-card">

        <div class="profile-row">

            <div

                class="avatar">

                <span id="avatarText">
                    GB

                <img
                    id="avatarImage"
                    alt="Driver profile">

            <div class="profile-info">

                <div
                    id="profileName"
                    class="profile-name">
                    Go Bike Driver
                </div>

                <div
                    id="profilePhone"

                    Driver account
                </div>

                <div class="profile-role">
                    DRIVER
                </div>

            </div>

            <button

                class="edit-btn"
                type="button"
                aria-label="Edit profile">
                ✎

        </div>

    </section>


    <!-- STATUS -->

    <div class="status-card">

        <div class="status-info">

            <div class="status-title">
                Driver Status
            </div>

            <div
                id="statusSubtitle"
                class="status-subtitle">
                You are currently offline.
            </div>

        </div>

        <div
            id="statusPill"
            class="status-pill">

            <span class="status-dot"></span>

            <span id="statusText">
                OFFLINE
            </span>

        </div>

    </div>


    <!-- RIDE -->

    <div class="section-title">
        Ride
    </div>

    <div class="menu-list">

        <button
            class="menu-item"
            data-page="home.html"
            type="button">

            <span class="menu-icon">
                ⌂
            </span>

            <span class="menu-content">

                <span class="menu-name">
                    Home
                </span>

                <span class="menu-description">
                    Dashboard and nearby ride requests
                </span>

            </span>

            <span class="arrow">
                ›
            </span>

        </button>


        <button
            id="liveRideButton"
            class="menu-item"
            type="button">

            <span class="menu-icon">
                ◉
            </span>

            <span class="menu-content">

                <span class="menu-name">
                    Live Ride
                </span>

                <span class="menu-description">
                    Open active ride and navigation
                </span>

            </span>

            <span
                id="liveRideBadge"
                class="badge"
                style="display:none">
                LIVE
            </span>

            <span
                id="liveRideArrow"
                class="arrow">
                ›
            </span>

        </button>


        <button
            class="menu-item"
            data-page="map.html"
            type="button">

            <span class="menu-icon">
                ⌖
            </span>

            <span class="menu-content">

                <span class="menu-name">
                    Driver Map
                </span>

                <span class="menu-description">
                    Current location and online availability
                </span>

            </span>

            <span class="arrow">
                ›
            </span>

        </button>


        <button
            class="menu-item"
            data-page="requests.html"
            type="button">

            <span class="menu-icon">
                ⇄
            </span>

            <span class="menu-content">

                <span class="menu-name">
                    Ride Requests
                </span>

                <span class="menu-description">
                    View and manage incoming requests
                </span>

            </span>

            <span class="arrow">
                ›
            </span>

        </button>

    </div>


    <!-- MONEY -->

    <div class="section-title">
        Money & Activity
    </div>

    <div class="menu-list">

        <button
            class="menu-item"
            data-page="earnings.html"
            type="button">

            <span class="menu-icon">
                ₹
            </span>

            <span class="menu-content">

                <span class="menu-name">
                    Earnings
                </span>

                <span class="menu-description">
                    Daily, weekly and total earnings
                </span>

            </span>

            <span class="arrow">
                ›
            </span>

        </button>


        <button
            class="menu-item"
            data-page="history.html"
            type="button">

            <span class="menu-icon">
                ≡
            </span>

            <span class="menu-content">

                <span class="menu-name">
                    Ride History
                </span>

                <span class="menu-description">

        <button

            <span class="menu-icon">

            <span class="menu-content">

                <span class="menu-name">

                    Personal and driver information

        <button

            </span>

            <span class="menu-content">

                <span class="menu-name">

                </span>

                <span class="menu-description">
                    Ride and account notifications

            </span>

            <span

                style="display:none">

        <button
            class="menu-item"
            data-page="settings.html"

            <span class="menu-icon">
                ⚙

                <span class="menu-name">

<!-- LOGOUT MODAL -->

<div
    id="logoutModal"
    class="modal"
    role="dialog"
    aria-modal="true">

    <div class="modal-card">

        <div class="modal-handle"></div>

        <div class="modal-title">
            Logout from Go Bike?
        </div>

        <div class="modal-text">
            Your active ride, if any, must be handled before
            logging out. You can sign in again anytime.
        </div>

        <div class="modal-actions">

            <button
                id="cancelLogout"
                class="modal-btn"
                type="button">
                CANCEL
            </button>

            <button
                id="confirmLogout"
                class="modal-btn danger-btn"
                type="button">
                LOGOUT
            </button>

        </div>

    </div>

</div>


<script>
(function(){

    "use strict";


    /*
     * =====================================================
     * GO BIKE DRIVER MENU
     *
     * Navigation controller
     * Firebase-compatible authentication
     * Driver profile rendering
     * Online status
     * Active ride detection
     *
     * IMPORTANT:
     * Actual authentication/security must be enforced by
     * Firebase Auth + Firestore Security Rules.
     * =====================================================
     */


    const LOGIN_PAGE =
        "../auth/login.html";

    const HOME_PAGE =
        "home.html";

    const PROFILE_PAGE =
        "profile.html";

    const LIVE_PAGE =
        "live.html";


    const STORAGE_ONLINE =
        "goBikeDriverOnline";

    const STORAGE_ACTIVE_RIDE =
        "goBikeActiveRide";


    const $ =
        id =>
        document.getElementById(id);


    /*
     * -----------------------------------------------------
     * NAVIGATION
     * -----------------------------------------------------
     */

    function go(
        page
    ){

        if(!page){
            return;
        }


        window.location.href =
            page;

    }


    document
        .querySelectorAll(
            "[data-page]"
        )
        .forEach(
            function(button){

                button.addEventListener(
                    "click",
                    function(){

                        go(
                            button.dataset.page
                        );

                    }
                );

            }
        );


    $("backButton")
        .addEventListener(
            "click",
            function(){

                /*
                 * Prefer browser history when available.
                 * Otherwise return to driver home.
                 */

                if(
                    window.history.length >
                    1
                ){

                    window.history.back();

                }else{

                    go(
                        HOME_PAGE
                    );

                }

            }
        );


    $("notificationButton")
        .addEventListener(
            "click",
            function(){

                go(
                    "notifications.html"
                );

            }
        );


    $("editProfileButton")
        .addEventListener(
            "click",
            function(){

                go(
                    PROFILE_PAGE
                );

            }
        );


    $("termsButton")
        .addEventListener(
            "click",
            function(){

                /*
                 * Keep this compatible with projects that
                 * have not created a separate legal page yet.
                 */

                const candidates = [

                    "terms.html",
                    "settings.html"

                ];


                go(
                    candidates[0]
                );

            }
        );


    /*
     * -----------------------------------------------------
     * ACTIVE RIDE
     * -----------------------------------------------------
     */

    function getActiveRide(){

        const keys = [

            STORAGE_ACTIVE_RIDE,
            "gobikeActiveRide",
            "activeGoBikeRide",
            "activeRide",
            "currentRide"

        ];


        for(
            const key
            of keys
        ){

            /*
             * Session storage first.
             */

            try{

                const raw =
                    sessionStorage.getItem(
                        key
                    );


                if(raw){

                    const value =
                        JSON.parse(
                            raw
                        );


                    if(
                        value &&
                        typeof value ===
                        "object"
                    ){

                        return value;

                    }

                }

            }catch(error){}


            /*
             * Local storage fallback.
             */

            try{

                const raw =
                    localStorage.getItem(
                        key
                    );


                if(raw){

                    const value =
                        JSON.parse(
                            raw
                        );


                    if(
                        value &&
                        typeof value ===
                        "object"
                    ){

                        return value;

                    }

                }

            }catch(error){}

        }


        return null;

    }


    function isClosedRide(
        ride
    ){

        if(!ride){
            return false;
        }


        const status =
            String(
                ride.status ||
                ride.rideStatus ||
                ""
            )
            .trim()
            .toLowerCase();


        return [

            "completed",
            "complete",
            "finished",
            "cancelled",
            "canceled",
            "rejected",
            "declined"

        ].includes(
            status
        );

    }


    function updateLiveRideUI(){

        const ride =
            getActiveRide();


        const badge =
            $("liveRideBadge");


        if(
            ride &&
            !isClosedRide(
                ride
            )
        ){

            badge.style.display =
                "flex";

        }else{

            badge.style.display =
                "none";

        }

    }


    $("liveRideButton")
        .addEventListener(
            "click",
            function(){

                const ride =
                    getActiveRide();


                if(
                    ride &&
                    !isClosedRide(
                        ride
                    )
                ){

                    go(
                        LIVE_PAGE
                    );

                }else{

                    go(
                        "rides.html"
                    );

                }

            }
        );


    /*
     * -----------------------------------------------------
     * ONLINE STATUS
     * -----------------------------------------------------
     */

    function getOnline(){

        try{

            return (
                localStorage.getItem(
                    STORAGE_ONLINE
                ) ===
                "true"
            );

        }catch(error){

            return false;

        }

    }


    function renderOnline(){

        const online =
            getOnline();


        const pill =
            $("statusPill");


        const text =
            $("statusText");


        const subtitle =
            $("statusSubtitle");


        if(online){

            pill.classList.add(
                "online"
            );


            text.textContent =
                "ONLINE";


            subtitle.textContent =
                "You are available for nearby ride requests.";

        }else{

            pill.classList.remove(
                "online"
            );


            text.textContent =
                "OFFLINE";


            subtitle.textContent =
                "You are currently offline.";

        }

    }


    /*
     * -----------------------------------------------------
     * PROFILE STORAGE
     * -----------------------------------------------------
     */

    function readJson(
        storage,
        key
    ){

        try{

            const raw =
                storage.getItem(
                    key
                );


            if(!raw){
                return null;
            }


            const value =
                JSON.parse(
                    raw
                );


            return (
                value &&
                typeof value ===
                "object"
            )
                ? value
                : null;

        }catch(error){

            return null;

        }

    }


    function getStoredProfile(){

        const keys = [

            "goBikeDriverProfile",
            "gobikeDriverProfile",
            "driverProfile",
            "userProfile",
            "goBikeUser",
            "currentUser"

        ];


        for(
            const key
            of keys
        ){

            const session =
                readJson(
                    sessionStorage,
                    key
                );


            if(session){
                return session;
            }


            const local =
                readJson(
                    localStorage,
                    key
                );


            if(local){
                return local;
            }

        }


        return null;

    }


    function getFirebaseUser(){

        try{

            if(
                window.firebase &&
                typeof firebase.auth ===
                "function"
            ){

                return firebase
                    .auth()
                    .currentUser ||
                    null;

            }

        }catch(error){

            console.warn(
                "Go Bike auth:",
                error
            );

        }


        return null;

    }


    function getFirstName(
        name
    ){

        const value =
            String(
                name || ""
            )
            .trim();


        if(!value){
            return "";
        }


        return value
            .split(/\s+/)[0];

    }


    function getInitials(
        name
    ){

        const value =
            String(
                name || ""
            )
            .trim();


        if(!value){
            return "GB";
        }


        const parts =
            value.split(
                /\s+/
            );


        if(parts.length === 1){

            return parts[0]
                .slice(0,2)
                .toUpperCase();

        }


        return (
            parts[0][0] +
            parts[parts.length - 1][0]
        )
        .toUpperCase();

    }


    function renderProfile(){

        const profile =
            getStoredProfile();


        const firebaseUser =
            getFirebaseUser();


        const name =
            profile?.name ||
            profile?.fullName ||
            profile?.displayName ||
            firebaseUser?.displayName ||
            "Go Bike Driver";


        const phone =
            profile?.phone ||
            profile?.phoneNumber ||
            firebaseUser?.phoneNumber ||
            profile?.email ||
            firebaseUser?.email ||
            "Driver account";


        const photo =
            profile?.photoURL ||
            profile?.photoUrl ||
            profile?.photo ||
            firebaseUser?.photoURL ||
            "";


        $("profileName")
            .textContent =
            name;


        $("profilePhone")
            .textContent =
            phone;


        $("avatarText")
            .textContent =
            getInitials(
                name
            );


        if(photo){

            $("avatarImage")
                .src =
                photo;


            $("avatarImage")
                .style.display =
                "block";


            $("avatarText")
                .style.display =
                "none";

        }

    }


    /*
     * -----------------------------------------------------
     * NOTIFICATION COUNT
     * -----------------------------------------------------
     */

    function getNotificationCount(){

        const keys = [

            "goBikeUnreadNotifications",
            "gobikeUnreadNotifications",
            "unreadNotifications"

        ];


        for(
            const key
            of keys
        ){

            try{

                const value =
                    Number(
                        localStorage.getItem(
                            key
                        )
                    );


                if(
                    Number.isFinite(
                        value
                    ) &&
                    value > 0
                ){

                    return Math.min(
                        value,
                        99
                    );

                }

            }catch(error){}

        }


        return 0;

    }


    function renderNotifications(){

        const count =
            getNotificationCount();


        const badge =
            $("notificationBadge");


        const dot =
            $("notificationDot");


        if(count > 0){

            badge.style.display =
                "flex";


            badge.textContent =
                count > 99
                    ? "99+"
                    : String(
                        count
                    );


            dot.classList.add(
                "show"
            );

        }else{

            badge.style.display =
                "none";


            dot.classList.remove(
                "show"
            );

        }

    }


    /*
     * -----------------------------------------------------
     * LOGOUT
     * -----------------------------------------------------
     */

    $("logoutButton")
        .addEventListener(
            "click",
            function(){

                $("logoutModal")
                    .classList.add(
                        "show"
                    );

            }
        );


    $("cancelLogout")
        .addEventListener(
            "click",
            function(){

                $("logoutModal")
                    .classList.remove(
                        "show"
                    );

            }
        );


    $("logoutModal")
        .addEventListener(
            "click",
            function(event){

                if(
                    event.target ===
                    $("logoutModal")
                ){

                    $("logoutModal")
                        .classList.remove(
                            "show"
                        );

                }

            }
        );


    $("confirmLogout")
        .addEventListener(
            "click",
            async function(){

                const button =
                    $("confirmLogout");


                button.disabled =
                    true;


                button.textContent =
                    "LOGGING OUT...";


                /*
                 * Driver must not remain online after logout.
                 */

                try{

                    localStorage.setItem(
                        STORAGE_ONLINE,
                        "false"
                    );

                }catch(error){}


                /*
                 * Firebase Auth logout.
                 */

                try{

                    if(
                        window.firebase &&
                        typeof firebase.auth ===
                        "function"
                    ){

                        await firebase
                            .auth()
                            .signOut();

                    }

                }catch(error){

                    console.error(
                        "Go Bike logout:",
                        error
                    );

                    /*
                     * Do not block local session cleanup if
                     * Firebase logout fails.
                     */

                }


                /*
                 * Remove only UI/session cache.
                 *
                 * Do NOT delete Firestore ride records here.
                 */

                const removableKeys = [

                    "goBikeDriverProfile",
                    "gobikeDriverProfile",
                    "driverProfile",
                    "goBikeUser",
                    "currentUser"

                ];


                removableKeys.forEach(
                    function(key){

                        try{
                            sessionStorage.removeItem(
                                key
                            );
                        }catch(error){}

                    }
                );


                /*
                 * Do not remove the active ride automatically.
                 * The backend remains source of truth.
                 */


                window.location.replace(
                    LOGIN_PAGE
                );

            }
        );


    /*
     * -----------------------------------------------------
     * AUTH STATE LISTENER
     * -----------------------------------------------------
     *
     * If Firebase is available, update profile when auth
     * state becomes available.
     * -----------------------------------------------------
     */

    function attachAuthListener(){

        try{

            if(
                window.firebase &&
                typeof firebase.auth ===
                "function"
            ){

                firebase
                    .auth()
                    .onAuthStateChanged(
                        function(user){

                            if(user){

                                renderProfile();

                            }

                        }
                    );

            }

        }catch(error){

            console.warn(
                "Go Bike auth listener:",
                error
            );

        }

    }


    /*
     * -----------------------------------------------------
     * STORAGE EVENT
     * -----------------------------------------------------
     */

    window.addEventListener(
        "storage",
        function(event){

            if(
                event.key ===
                STORAGE_ONLINE
            ){

                renderOnline();

            }


            if(
                event.key ===
                STORAGE_ACTIVE_RIDE
            ){

                updateLiveRideUI();

            }


            if(
                event.key ===
                "goBikeUnreadNotifications"
            ){

                renderNotifications();

            }

        }
    );


    /*
     * -----------------------------------------------------
     * INIT
     * -----------------------------------------------------
     */

    function init(){

        renderProfile();

        renderOnline();

        updateLiveRideUI();

        renderNotifications();

        attachAuthListener();

    }


    init();

})();
</script>
