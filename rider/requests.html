<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<title>Go Bike | Ride Requests</title>

<style>
:root{
    --black:#080808;
    --panel:#111;
    --panel2:#171717;
    --yellow:#ffd600;
    --white:#fff;
    --muted:#777;
    --border:rgba(255,255,255,.08);
    --green:#25d47a;
    --red:#ff5555;
    --orange:#ffad32;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
    background:var(--black);
    color:var(--white);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    padding-bottom:25px;
}

button{
    font:inherit;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.page{
    width:100%;
    max-width:650px;
    min-height:100vh;
    margin:auto;
    padding:14px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    gap:10px;
}

.back-btn,
.refresh-btn{
    width:43px;
    height:43px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--panel);
    color:#fff;
    font-size:18px;
}

.header-copy{
    flex:1;
}

.header-copy strong{
    display:block;
    font-size:17px;
    font-weight:950;
}

.header-copy span{
    display:block;
    margin-top:3px;
    color:#555;
    font-size:7px;
    font-weight:700;
}

/* ONLINE */

.online-card{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:15px;
    padding:12px 14px;
    border:1px solid rgba(37,212,122,.14);
    border-radius:15px;
    background:rgba(37,212,122,.04);
}

.online-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 5px rgba(37,212,122,.08);
}

.online-copy{
    flex:1;
}

.online-copy strong{
    display:block;
    color:#ddd;
    font-size:8px;
    font-weight:950;
}

.online-copy span{
    display:block;
    margin-top:3px;
    color:#555;
    font-size:6px;
}

.online-toggle{
    position:relative;
    width:42px;
    height:24px;
    border:0;
    border-radius:20px;
    background:#333;
}

.online-toggle::after{
    content:"";
    position:absolute;
    top:3px;
    left:3px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#777;
    transition:.2s;
}

.online-toggle.active{
    background:var(--green);
}

.online-toggle.active::after{
    left:21px;
    background:#fff;
}

/* FILTER */

.filter-row{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-top:15px;
    padding-bottom:2px;
}

.filter-row::-webkit-scrollbar{
    display:none;
}

.filter{
    flex:0 0 auto;
    padding:9px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#111;
    color:#777;
    font-size:7px;
    font-weight:900;
}

.filter.active{
    border-color:rgba(255,214,0,.35);
    background:rgba(255,214,0,.08);
    color:var(--yellow);
}

/* REQUEST */

.request{
    position:relative;
    overflow:hidden;
    margin-top:15px;
    border:1px solid var(--border);
    border-radius:21px;
    background:var(--panel);
}

.request.priority{
    border-color:rgba(255,214,0,.22);
}

.request-head{
    display:flex;
    align-items:center;
    gap:9px;
    padding:14px;
    border-bottom:1px solid var(--border);
}

.service-icon{
    width:39px;
    height:39px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:rgba(255,214,0,.1);
    color:var(--yellow);
    font-size:19px;
}

.request-title{
    flex:1;
}

.request-title strong{
    display:block;
    color:#eee;
    font-size:10px;
    font-weight:950;
}

.request-title span{
    display:block;
    margin-top:4px;
    color:#555;
    font-size:6px;
}

.new-badge{
    padding:6px 8px;
    border-radius:7px;
    background:rgba(255,214,0,.1);
    color:var(--yellow);
    font-size:6px;
    font-weight:950;
}

.request-body{
    padding:14px;
}

/* MAP */

.map{
    position:relative;
    height:145px;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:14px;
    background:
        linear-gradient(135deg,#171717 25%,transparent 25%) 0 0/35px 35px,
        linear-gradient(315deg,#151515 25%,transparent 25%) 0 0/35px 35px,
        #0e0e0e;
}

.road{
    position:absolute;
    height:6px;
    border-radius:10px;
    background:#292929;
}

.road.a{
    width:130%;
    top:48%;
    left:-15%;
    transform:rotate(-17deg);
}

.road.b{
    width:95%;
    top:69%;
    left:8%;
    transform:rotate(25deg);
}

.road.c{
    width:75%;
    top:25%;
    left:25%;
    transform:rotate(62deg);
}

.road.d{
    width:60%;
    top:75%;
    left:-10%;
    transform:rotate(-52deg);
}

.route-line{
    position:absolute;
    z-index:2;
    left:26%;
    top:38%;
    width:48%;
    height:3px;
    background:var(--yellow);
    transform:rotate(-24deg);
    transform-origin:left center;
    box-shadow:0 0 8px rgba(255,214,0,.35);
}

.map-pin{
    position:absolute;
    z-index:4;
    width:16px;
    height:16px;
    border:3px solid #111;
    border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 0 6px rgba(255,214,0,.13);
}

.map-pin.pickup{
    left:23%;
    top:57%;
}

.map-pin.drop{
    right:22%;
    top:25%;
    border-radius:4px;
    background:#fff;
    box-shadow:0 0 0 6px rgba(255,255,255,.1);
}

.map-label{
    position:absolute;
    z-index:5;
    padding:5px 7px;
    border-radius:6px;
    background:#090909;
    color:#aaa;
    font-size:5px;
    font-weight:950;
}

.map-label.pickup{
    left:16%;
    top:68%;
}

.map-label.drop{
    right:15%;
    top:13%;
}

/* ROUTE */

.route{
    margin-top:14px;
}

.route-row{
    position:relative;
    display:flex;
    gap:10px;
    min-height:56px;
}

.route-row:first-child::after{
    content:"";
    position:absolute;
    left:6px;
    top:14px;
    height:42px;
    border-left:1px dashed #444;
}

.route-dot{
    position:relative;
    z-index:2;
    width:13px;
    height:13px;
    flex:0 0 13px;
    margin-top:2px;
    border-radius:50%;
    background:var(--yellow);
}

.route-dot.drop{
    border-radius:3px;
    background:#fff;
}

.route-copy{
    min-width:0;
    flex:1;
}

.route-copy span{
    display:block;
    color:#555;
    font-size:5px;
    font-weight:900;
}

.route-copy strong{
    display:block;
    margin-top:4px;
    color:#ddd;
    font-size:8px;
    line-height:1.35;
}

/* META */

.meta{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:4px;
}

.meta-item{
    padding:11px 6px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#151515;
    text-align:center;
}

.meta-item strong{
    display:block;
    color:#eee;
    font-size:10px;
    font-weight:950;
}

.meta-item span{
    display:block;
    margin-top:4px;
    color:#555;
    font-size:5px;
    font-weight:900;
    text-transform:uppercase;
}

/* EARNING */

.earning{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:9px;
    padding:13px;
    border:1px solid rgba(37,212,122,.13);
    border-radius:13px;
    background:rgba(37,212,122,.04);
}

.earning-copy span{
    display:block;
    color:#666;
    font-size:6px;
}

.earning-copy strong{
    display:block;
    margin-top:4px;
    color:var(--green);
    font-size:18px;
    font-weight:950;
}

.earning-note{
    color:#555;
    font-size:6px;
    text-align:right;
}

/* TIMER */

.timer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:10px;
    padding:10px 12px;
    border-radius:11px;
    background:#151515;
}

.timer span{
    color:#666;
    font-size:6px;
}

.timer strong{
    color:var(--orange);
    font-size:9px;
    font-weight:950;
}

/* ACTIONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1.45fr;
    gap:8px;
    margin-top:11px;
}

.action{
    min-height:44px;
    border:1px solid var(--border);
    border-radius:12px;
    background:#181818;
    color:#aaa;
    font-size:7px;
    font-weight:950;
}

.action.accept{
    border-color:rgba(255,214,0,.4);
    background:var(--yellow);
    color:#090909;
}

.action:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.action:not(:disabled):active{
    transform:scale(.98);
}

/* EMPTY */

.empty{
    display:none;
    margin-top:25px;
    padding:38px 20px;
    border:1px dashed #292929;
    border-radius:20px;
    background:#0e0e0e;
    text-align:center;
}

.empty.show{
    display:block;
}

.empty-icon{
    font-size:30px;
    opacity:.5;
}

.empty strong{
    display:block;
    margin-top:10px;
    color:#aaa;
    font-size:10px;
}

.empty span{
    display:block;
    max-width:260px;
    margin:6px auto 0;
    color:#555;
    font-size:7px;
    line-height:1.5;
}

/* NAV */

.bottom-nav{
    position:sticky;
    bottom:10px;
    z-index:20;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    margin-top:18px;
    padding:6px;
    border:1px solid var(--border);
    border-radius:17px;
    background:rgba(15,15,15,.95);
    backdrop-filter:blur(12px);
}

.nav-item{
    min-height:42px;
    border:0;
    border-radius:11px;
    background:transparent;
    color:#555;
    font-size:6px;
    font-weight:900;
}

.nav-item.active{
    background:rgba(255,214,0,.09);
    color:var(--yellow);
}

/* LOADING */

.loading{
    position:fixed;
    z-index:100;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#080808;
}

.loading.hide{
    display:none;
}

.spinner{
    width:34px;
    height:34px;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* TOAST */

.toast{
    position:fixed;
    z-index:200;
    left:50%;
    bottom:25px;
    max-width:calc(100% - 30px);
    padding:11px 14px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#1b1b1b;
    color:#ddd;
    font-size:8px;
    font-weight:800;
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,10px);
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* RESPONSIVE */

@media(max-width:370px){

    .page{
        padding:11px;
    }

    .meta-item strong{
        font-size:9px;
    }

    .earning-copy strong{
        font-size:16px;
    }

}
</style>
</head>

<body>

<main class="page">

<header class="header">

    <button
        id="backButton"
        class="back-btn"
        type="button"
        aria-label="Back">
        ←
    </button>

    <div class="header-copy">
        <strong>Ride Requests</strong>
        <span>Nearby delivery requests for you</span>
    </div>

    <button
        id="refreshButton"
        class="refresh-btn"
        type="button"
        aria-label="Refresh">
        ↻
    </button>

</header>


<section class="online-card">

    <div class="online-dot"></div>

    <div class="online-copy">
        <strong id="onlineTitle">
            You're Online
        </strong>

        <span id="onlineDescription">
            You can receive nearby ride requests.
        </span>
    </div>

    <button
        id="onlineToggle"
        class="online-toggle active"
        type="button"
        aria-label="Toggle online status">
    </button>

</section>


<div class="filter-row">

    <button
        class="filter active"
        data-filter="all"
        type="button">
        All Requests
    </button>

    <button
        class="filter"
        data-filter="bike"
        type="button">
        Bike
    </button>

    <button
        class="filter"
        data-filter="parcel"
        type="button">
        Parcel
    </button>

    <button
        class="filter"
        data-filter="nearby"
        type="button">
        Nearby
    </button>

</div>


<section
    id="requestsContainer"
    aria-live="polite">
</section>


<section
    id="emptyState"
    class="empty">

    <div class="empty-icon">
        🏍️
    </div>

    <strong id="emptyTitle">
        No ride requests
    </strong>

    <span id="emptyDescription">
        Stay online and we'll show new nearby requests here automatically.
    </span>

</section>


<nav class="bottom-nav">

    <button
        class="nav-item"
        data-page="home.html"
        type="button">
        HOME
    </button>

    <button
        class="nav-item active"
        data-page="requests.html"
        type="button">
        REQUESTS
    </button>

    <button
        class="nav-item"
        data-page="history.html"
        type="button">
        HISTORY
    </button>

    <button
        class="nav-item"
        data-page="profile.html"
        type="button">
        PROFILE
    </button>

</nav>

</main>


<div
    id="loading"
    class="loading">

    <div class="spinner"></div>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>
(function(){

"use strict";


const state = {

    requests:[],

    filtered:[],

    filter:"all",

    online:true,

    timers:new Map(),

    loading:false

};


/* =========================================================
   HELPERS
========================================================= */

const $ =
    id => document.getElementById(id);


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function num(value){

    const n =
        Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}


function money(value){

    return "₹" +
        Math.max(
            0,
            Math.round(
                num(value)
            )
        ).toLocaleString("en-IN");

}


function getApi(){

    return (
        window.GoBikeRideEngine ||
        window.GoBikeDriver ||
        window.GoBikeRequests ||
        null
    );

}


function rideId(ride,index){

    return String(
        ride?.id ||
        ride?.rideId ||
        ride?.requestId ||
        "request-" + index
    );

}


function serviceType(ride){

    return String(
        ride?.serviceType ||
        ride?.rideType ||
        ride?.type ||
        "bike"
    ).toLowerCase();

}


function pickup(ride){

    return (
        ride?.pickupAddress ||
        ride?.pickup?.address ||
        ride?.pickup?.name ||
        ride?.pickupLocation?.address ||
        ride?.from ||
        "Pickup location"
    );

}


function drop(ride){

    return (
        ride?.dropAddress ||
        ride?.drop?.address ||
        ride?.drop?.name ||
        ride?.dropLocation?.address ||
        ride?.to ||
        "Drop location"
    );

}


function distance(ride){

    const value =
        num(
            ride?.distanceKm ??
            ride?.distance ??
            ride?.km
        );

    return value
        ? value.toFixed(value < 10 ? 1 : 0) + " km"
        : "—";

}


function duration(ride){

    const value =
        num(
            ride?.durationMinutes ??
            ride?.duration ??
            ride?.etaMinutes
        );

    if(!value){
        return "—";
    }

    return Math.round(value) + " min";

}


function earning(ride){

    return num(
        ride?.driverEarning ??
        ride?.driverFare ??
        ride?.driverAmount ??
        ride?.estimatedEarning ??
        ride?.earning ??
        ride?.amount ??
        ride?.fare
    );

}


function requestAge(ride){

    const created =
        ride?.createdAt ||
        ride?.requestedAt ||
        ride?.timestamp;

    if(!created){
        return 60;
    }

    let date;

    try{

        if(
            created &&
            typeof created.toDate ===
            "function"
        ){

            date =
                created.toDate();

        }else{

            date =
                new Date(created);

        }

    }catch(error){

        return 60;

    }

    if(
        !date ||
        Number.isNaN(
            date.getTime()
        )
    ){

        return 60;

    }

    return Math.max(
        0,
        Math.floor(
            (Date.now() -
            date.getTime()) /
            1000
        )
    );

}


/* =========================================================
   DEMO FALLBACK
========================================================= */

function demoRequests(){

    return [

        {
            id:"demo-ride-001",

            serviceType:"bike",

            pickupAddress:
                "Sector 17, Chandigarh",

            dropAddress:
                "Phase 7, Mohali",

            distanceKm:8.4,

            durationMinutes:22,

            estimatedEarning:142,

            customerName:"Customer",

            createdAt:
                new Date(
                    Date.now() - 15000
                ).toISOString(),

            status:"requested"

        },

        {
            id:"demo-parcel-002",

            serviceType:"parcel",

            pickupAddress:
                "Industrial Area, Chandigarh",

            dropAddress:
                "Kharar Main Road, Mohali",

            distanceKm:11.2,

            durationMinutes:28,

            estimatedEarning:186,

            customerName:"Parcel Customer",

            createdAt:
                new Date(
                    Date.now() - 38000
                ).toISOString(),

            status:"requested"

        }

    ];

}


/* =========================================================
   LOAD REQUESTS
========================================================= */

async function loadRequests(){

    if(state.loading){
        return;
    }

    state.loading = true;


    try{

        const api =
            getApi();


        if(api){

            const methods = [

                "getNearbyRequests",
                "getRideRequests",
                "getPendingRequests",
                "fetchRequests",
                "loadRequests"

            ];


            for(
                const method of methods
            ){

                if(
                    typeof api[method] !==
                    "function"
                ){
                    continue;
                }


                try{

                    const result =
                        await api[method]();


                    const requests =
                        Array.isArray(result)
                            ? result
                            : (
                                result?.requests ||
                                result?.rides ||
                                []
                            );


                    if(
                        Array.isArray(
                            requests
                        )
                    ){

                        state.requests =
                            requests;

                        state.loading =
                            false;

                        render();

                        return;

                    }

                }catch(error){

                    console.warn(
                        "Go Bike request engine:",
                        method,
                        error
                    );

                }

            }

        }


        /*
         * Firestore fallback.
         * Only used when Firebase has already
         * been initialized by the canonical app
         * configuration.
         */

        if(
            window.firebase &&
            firebase.firestore
        ){

            const db =
                firebase.firestore();


            const snapshot =
                await db
                    .collection("rides")
                    .where(
                        "status",
                        "==",
                        "requested"
                    )
                    .limit(20)
                    .get();


            state.requests =
                snapshot.docs.map(
                    doc => ({
                        id:doc.id,
                        ...doc.data()
                    })
                );


            state.loading =
                false;

            render();

            return;

        }


        /*
         * Development fallback only.
         * It keeps the UI usable before Firebase
         * request listeners are connected.
         */

        state.requests =
            demoRequests();

    }catch(error){

        console.error(
            "Go Bike requests:",
            error
        );

        if(
            !state.requests.length
        ){

            state.requests =
                demoRequests();

        }

    }


    state.loading =
        false;

    render();

}


/* =========================================================
   FILTER
========================================================= */

function applyFilter(){

    const filter =
        state.filter;


    state.filtered =
        state.requests.filter(
            ride => {

                if(filter === "all"){
                    return true;
                }


                const type =
                    serviceType(
                        ride
                    );


                if(filter === "nearby"){

                    const d =
                        num(
                            ride.distanceToDriver ??
                            ride.driverDistance ??
                            ride.distanceFromDriver
                        );

                    return !d || d <= 10;

                }


                return type === filter;

            }
        );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    applyFilter();


    const container =
        $("requestsContainer");


    container.innerHTML =
        "";


    if(
        !state.online
    ){

        showEmpty(
            "You're offline",
            "Go online to receive nearby ride requests."
        );

        return;

    }


    if(
        !state.filtered.length
    ){

        showEmpty(
            "No ride requests",
            "Stay online and we'll show new nearby requests here automatically."
        );

        return;

    }


    $("emptyState")
        .classList.remove(
            "show"
        );


    state.filtered.forEach(
        (ride,index) => {

            container.appendChild(
                createRequestCard(
                    ride,
                    index
                )
            );

        }
    );


    startTimers();

}

/* =========================================================
   TIMER
========================================================= */

const REQUEST_TIMEOUT =
    60;


function timerText(age){

    const remaining =
        Math.max(
            0,
            REQUEST_TIMEOUT -
            Number(age || 0)
        );


    if(remaining <= 0){
        return "EXPIRED";
    }


    return (
        "00:" +
        String(
            remaining
        ).padStart(2,"0")
    );

}


function startTimers(){

    document
        .querySelectorAll(
            ".request-timer"
        )
        .forEach(
            timer => {

                const created =
                    timer.dataset.created;

                const age =
                    Number(
                        timer.dataset.age ||
                        0
                    );


                let seconds =
                    age;


                if(created){

                    const date =
                        new Date(
                            created
                        );

                    if(
                        !Number.isNaN(
                            date.getTime()
                        )
                    ){

                        seconds =
                            Math.floor(
                                (
                                    Date.now() -
                                    date.getTime()
                                ) / 1000
                            );

                    }

                }


                const key =
                    timer.closest(
                        ".request"
                    )?.dataset.id;


                if(
                    key &&
                    state.timers.has(key)
                ){

                    clearInterval(
                        state.timers.get(
                            key
                        )
                    );

                }


                const interval =
                    setInterval(
                        () => {

                            seconds++;

                            timer.textContent =
                                timerText(
                                    seconds
                                );


                            if(
                                seconds >=
                                REQUEST_TIMEOUT
                            ){

                                clearInterval(
                                    interval
                                );


                                const card =
                                    timer.closest(
                                        ".request"
                                    );


                                if(card){

                                    card
                                        .querySelectorAll(
                                            "button"
                                        )
                                        .forEach(
                                            btn =>
                                                btn.disabled =
                                                    true
                                        );

                                    card
                                        .style.opacity =
                                            ".55";

                                }

                            }

                        },
                        1000
                    );


                if(key){

                    state.timers.set(
                        key,
                        interval
                    );

                }

            }
        );

}


/* =========================================================
   ACCEPT
========================================================= */

async function acceptRide(
    ride,
    card
){

    const id =
        rideId(
            ride,
            0
        );


    const buttons =
        card.querySelectorAll(
            "button"
        );


    buttons.forEach(
        btn =>
            btn.disabled = true
    );


    const acceptButton =
        card.querySelector(
            '[data-action="accept"]'
        );


    acceptButton.textContent =
        "ACCEPTING...";


    try{

        const api =
            getApi();


        let result =
            null;


        if(
            api &&
            typeof api.acceptRide ===
            "function"
        ){

            result =
                await api.acceptRide(
                    id,
                    ride
                );

        }else if(
            api &&
            typeof api.acceptRequest ===
            "function"
        ){

            result =
                await api.acceptRequest(
                    id,
                    ride
                );

        }else if(
            window.firebase &&
            firebase.firestore
        ){

            const user =
                firebase.auth &&
                firebase.auth().currentUser;


            if(!user){

                throw new Error(
                    "Driver is not logged in."
                );

            }


            await firebase
                .firestore()
                .collection("rides")
                .doc(id)
                .update({

                    status:"accepted",

                    driverId:
                        user.uid,

                    acceptedAt:
                        new Date()

                });


            result = {
                success:true
            };

        }else{

            /*
             * UI fallback for the fresh project.
             * Once the central ride engine exists,
             * its acceptRide() method takes priority.
             */

            result = {
                success:true
            };

        }


        if(
            result === false ||
            result?.success === false
        ){

            throw new Error(
                result?.message ||
                "Ride could not be accepted."
            );

        }


        try{

            sessionStorage.setItem(
                "goBikeActiveRideId",
                id
            );

            sessionStorage.setItem(
                "goBikeActiveRide",
                JSON.stringify(
                    ride
                )
            );

        }catch(error){}


        showToast(
            "Ride accepted. Opening navigation..."
        );


        setTimeout(
            () => {

                /*
                 * Driver first goes to pickup
                 * navigation/live-map screen.
                 */

                location.href =
                    "live-map.html?rideId=" +
                    encodeURIComponent(id) +
                    "&stage=pickup";

            },
            500
        );


    }catch(error){

        console.error(
            "Go Bike accept ride:",
            error
        );


        buttons.forEach(
            btn =>
                btn.disabled = false
        );


        acceptButton.textContent =
            "ACCEPT RIDE";


        showToast(
            error?.message ||
            "Unable to accept this ride."
        );

    }

}


/* =========================================================
   REJECT
========================================================= */

async function rejectRide(
    ride,
    card
){

    const id =
        rideId(
            ride,
            0
        );


    const rejectButton =
        card.querySelector(
            '[data-action="reject"]'
        );


    const acceptButton =
        card.querySelector(
            '[data-action="accept"]'
        );


    rejectButton.disabled =
        true;

    acceptButton.disabled =
        true;

    rejectButton.textContent =
        "REJECTING...";


    try{

        const api =
            getApi();


        if(
            api &&
            typeof api.rejectRide ===
            "function"
        ){

            await api.rejectRide(
                id,
                ride
            );

        }else if(
            api &&
            typeof api.rejectRequest ===
            "function"
        ){

            await api.rejectRequest(
                id,
                ride
            );

        }else if(
            window.firebase &&
            firebase.firestore
        ){

            await firebase
                .firestore()
                .collection("rides")
                .doc(id)
                .update({

                    status:"rejected",

                    rejectedAt:
                        new Date()

                });

        }


        state.requests =
            state.requests.filter(
                item =>
                    rideId(
                        item,
                        0
                    ) !== id
            );


        showToast(
            "Ride request rejected."
        );


        render();

    }catch(error){

        console.error(
            "Go Bike reject ride:",
            error
        );


        rejectButton.disabled =
            false;

        acceptButton.disabled =
            false;

        rejectButton.textContent =
            "REJECT";


        showToast(
            error?.message ||
            "Unable to reject request."
        );

    }

}


/* =========================================================
   ONLINE STATUS
========================================================= */

function updateOnlineUI(){

    const toggle =
        $("onlineToggle");


    toggle.classList.toggle(
        "active",
        state.online
    );


    $("onlineTitle")
        .textContent =
        state.online
            ? "You're Online"
            : "You're Offline";


    $("onlineDescription")
        .textContent =
        state.online
            ? "You can receive nearby ride requests."
            : "Go online to receive new requests.";


    const dot =
        document.querySelector(
            ".online-dot"
        );


    dot.style.background =
        state.online
            ? "var(--green)"
            : "#555";


    dot.style.boxShadow =
        state.online
            ? "0 0 0 5px rgba(37,212,122,.08)"
            : "none";


    try{

        localStorage.setItem(
            "goBikeDriverOnline",
            state.online
                ? "true"
                : "false"
        );

    }catch(error){}


    const api =
        getApi();


    if(
        api &&
        typeof api.setOnlineStatus ===
        "function"
    ){

        Promise.resolve(
            api.setOnlineStatus(
                state.online
            )
        ).catch(
            error =>
                console.warn(
                    error
                )
        );

    }


    render();

}

/* =========================================================
   REALTIME LISTENER BRIDGE
========================================================= */

function connectRealtime(){

    const api =
        getApi();


    if(!api){
        return;
    }


    const callbacks = [

        "subscribeToRequests",
        "listenForRequests",
        "onRideRequests",
        "watchRideRequests"

    ];


    for(
        const method of callbacks
    ){

        if(
            typeof api[method] !==
            "function"
        ){
            continue;
        }


        try{

            api[method](
                requests => {

                    if(
                        Array.isArray(
                            requests
                        )
                    ){

                        state.requests =
                            requests;

                        render();

                    }

                }
            );


            break;

        }catch(error){

            console.warn(
                "Realtime request listener:",
                error
            );

        }

    }

}


/* =========================================================
   INIT
========================================================= */

async function init(){

    try{

        const stored =
            localStorage.getItem(
                "goBikeDriverOnline"
            );


        if(stored !== null){

            state.online =
                stored === "true";

        }

    }catch(error){}


    updateOnlineUI();

    await loadRequests();

    connectRealtime();


    /*
     * Refresh fallback every 15 seconds.
     * A real-time engine can update the screen
     * immediately; this simply keeps the page
     * resilient if the listener is temporarily
     * unavailable.
     */

    setInterval(
        () => {

            if(
                state.online &&
                document.visibilityState ===
                "visible"
            ){

                loadRequests();

            }

        },
        15000
    );


    $("loading")
        .classList.add(
            "hide"
        );

}


let toastTimer;

function showToast(message){

    const toast =
        $("toast");


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2300
        );

}


init();

})();
