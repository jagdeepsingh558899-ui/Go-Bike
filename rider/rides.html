<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<title>Go Bike | My Rides</title>

<style>
:root{
    --black:#080808;
    --panel:#111;
    --panel2:#171717;
    --yellow:#ffd600;
    --white:#fff;
    --muted:#777;
    --green:#27d980;
    --red:#ff5555;
    --orange:#ffad32;
    --blue:#58a6ff;
    --border:rgba(255,255,255,.08);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
    background:var(--black);
    color:var(--white);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    padding-bottom:25px;
}

button{
    font:inherit;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.page{
    width:100%;
    max-width:650px;
    min-height:100vh;
    margin:auto;
    padding:14px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn{
    width:43px;
    height:43px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--panel);
    color:#fff;
    font-size:18px;
}

.header-copy{
    flex:1;
}

.header-copy strong{
    display:block;
    font-size:17px;
    font-weight:950;
}

.header-copy span{
    display:block;
    margin-top:3px;
    color:#555;
    font-size:7px;
    font-weight:700;
}

/* FILTER */

.filter-row{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-top:16px;
    padding-bottom:2px;
}

.filter-row::-webkit-scrollbar{
    display:none;
}

.filter{
    flex:0 0 auto;
    padding:9px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#111;
    color:#777;
    font-size:7px;
    font-weight:950;
}

.filter.active{
    border-color:rgba(255,214,0,.4);
    background:rgba(255,214,0,.09);
    color:var(--yellow);
}

/* SECTION */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:19px 2px 9px;
}

.section-title strong{
    color:#ddd;
    font-size:9px;
    font-weight:950;
}

.section-title span{
    color:#555;
    font-size:6px;
}

/* ACTIVE RIDE */

.active-card{
    overflow:hidden;
    border:1px solid rgba(255,214,0,.22);
    border-radius:21px;
    background:var(--panel);
}

.active-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px;
    border-bottom:1px solid var(--border);
}

.service-icon{
    width:41px;
    height:41px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:rgba(255,214,0,.1);
    color:var(--yellow);
    font-size:19px;
}

.active-title{
    flex:1;
}

.active-title strong{
    display:block;
    font-size:10px;
    font-weight:950;
}

.active-title span{
    display:block;
    margin-top:4px;
    color:#555;
    font-size:6px;
}

.status{
    padding:7px 9px;
    border-radius:8px;
    background:rgba(255,214,0,.1);
    color:var(--yellow);
    font-size:6px;
    font-weight:950;
}

/* PROGRESS */

.progress{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    padding:12px 14px;
    border-bottom:1px solid var(--border);
}

.progress-item{
    position:relative;
    text-align:center;
}

.progress-item:not(:last-child)::after{
    content:"";
    position:absolute;
    top:8px;
    left:58%;
    width:84%;
    border-top:1px dashed #333;
}

.progress-dot{
    position:relative;
    z-index:2;
    width:16px;
    height:16px;
    margin:auto;
    border:2px solid #444;
    border-radius:50%;
    background:#151515;
}

.progress-item.done .progress-dot{
    border-color:var(--green);
    background:var(--green);
}

.progress-item.current .progress-dot{
    border-color:var(--yellow);
    background:var(--yellow);
    box-shadow:0 0 0 5px rgba(255,214,0,.08);
}

.progress-item span{
    display:block;
    margin-top:6px;
    color:#555;
    font-size:5px;
    font-weight:950;
}

.progress-item.done span,
.progress-item.current span{
    color:#bbb;
}

/* ROUTE */

.route{
    padding:14px;
}

.route-row{
    position:relative;
    display:flex;
    gap:10px;
    min-height:59px;
}

.route-row:first-child::after{
    content:"";
    position:absolute;
    left:6px;
    top:15px;
    height:44px;
    border-left:1px dashed #444;
}

.route-dot{
    position:relative;
    z-index:2;
    width:13px;
    height:13px;
    flex:0 0 13px;
    margin-top:2px;
    border-radius:50%;
    background:var(--yellow);
}

.route-dot.drop{
    border-radius:3px;
    background:#fff;
}

.route-copy{
    min-width:0;
    flex:1;
}

.route-copy small{
    display:block;
    color:#555;
    font-size:5px;
    font-weight:950;
}

.route-copy strong{
    display:block;
    margin-top:4px;
    color:#ddd;
    font-size:8px;
    line-height:1.4;
}

/* RIDE STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    padding:0 14px 14px;
}

.stat{
    padding:11px 6px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#151515;
    text-align:center;
}

.stat strong{
    display:block;
    color:#eee;
    font-size:10px;
    font-weight:950;
}

.stat span{
    display:block;
    margin-top:4px;
    color:#555;
    font-size:5px;
    font-weight:900;
    text-transform:uppercase;
}

/* OTP */

.otp-box{
    margin:0 14px 12px;
    padding:13px;
    border:1px solid rgba(88,166,255,.18);
    border-radius:13px;
    background:rgba(88,166,255,.045);
}

.otp-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.otp-head strong{
    color:#ddd;
    font-size:8px;
    font-weight:950;
}

.otp-head span{
    color:#58a6ff;
    font-size:6px;
    font-weight:900;
}

.otp-digits{
    display:flex;
    gap:7px;
    margin-top:9px;
}

.otp-digit{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #303030;
    border-radius:10px;
    background:#101010;
    color:#fff;
    font-size:15px;
    font-weight:950;
}

.otp-note{
    margin-top:8px;
    color:#555;
    font-size:6px;
    line-height:1.5;
}

/* ACTIONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1.35fr;
    gap:8px;
    padding:0 14px 14px;
}

.action{
    min-height:44px;
    border:1px solid var(--border);
    border-radius:12px;
    background:#181818;
    color:#aaa;
    font-size:7px;
    font-weight:950;
}

.action.primary{
    border-color:rgba(255,214,0,.35);
    background:var(--yellow);
    color:#090909;
}

.action:active{
    transform:scale(.98);
}

/* RIDE CARD */

.ride-card{
    margin-top:9px;
    padding:14px;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--panel);
}

.ride-top{
    display:flex;
    align-items:center;
    gap:9px;
}

.ride-service{
    width:37px;
    height:37px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:#171717;
    font-size:17px;
}

.ride-info{
    flex:1;
    min-width:0;
}

.ride-info strong{
    display:block;
    color:#ddd;
    font-size:9px;
    font-weight:950;
}

.ride-info span{
    display:block;
    margin-top:3px;
    color:#555;
    font-size:6px;
}

.ride-status{
    padding:6px 8px;
    border-radius:7px;
    background:#181818;
    color:#777;
    font-size:5px;
    font-weight:950;
}

.ride-status.completed{
    color:var(--green);
    background:rgba(39,217,128,.07);
}

.ride-status.cancelled{
    color:var(--red);
    background:rgba(255,85,85,.07);
}

.ride-route{
    margin-top:12px;
    padding-top:11px;
    border-top:1px solid var(--border);
}

.location{
    display:flex;
    gap:8px;
    align-items:flex-start;
}

.location + .location{
    margin-top:8px;
}

.location-dot{
    width:8px;
    height:8px;
    flex:0 0 8px;
    margin-top:3px;
    border-radius:50%;
    background:var(--yellow);
}

.location-dot.drop{
    border-radius:2px;
    background:#fff;
}

.location span{
    min-width:0;
    color:#999;
    font-size:6px;
    line-height:1.4;
}

.ride-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:12px;
    padding-top:11px;
    border-top:1px solid var(--border);
}

.ride-date{
    color:#555;
    font-size:6px;
}

.ride-earning{
    color:var(--green);
    font-size:11px;
    font-weight:950;
}

/* EMPTY */

.empty{
    display:none;
    margin-top:14px;
    padding:38px 20px;
    border:1px dashed #292929;
    border-radius:19px;
    background:#0e0e0e;
    text-align:center;
}

.empty.show{
    display:block;
}

.empty-icon{
    font-size:30px;
    opacity:.5;
}

.empty strong{
    display:block;
    margin-top:10px;
    color:#aaa;
    font-size:10px;
}

.empty span{
    display:block;
    max-width:280px;
    margin:6px auto 0;
    color:#555;
    font-size:7px;
    line-height:1.5;
}

/* BOTTOM NAV */

.bottom-nav{
    position:sticky;
    bottom:10px;
    z-index:20;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    margin-top:20px;
    padding:6px;
    border:1px solid var(--border);
    border-radius:17px;
    background:rgba(15,15,15,.95);
    backdrop-filter:blur(12px);
}

.nav-item{
    min-height:42px;
    border:0;
    border-radius:11px;
    background:transparent;
    color:#555;
    font-size:6px;
    font-weight:900;
}

.nav-item.active{
    background:rgba(255,214,0,.09);
    color:var(--yellow);
}

/* LOADING */

.loading{
    position:fixed;
    z-index:100;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#080808;
}

.loading.hide{
    display:none;
}

.spinner{
    width:34px;
    height:34px;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* TOAST */

.toast{
    position:fixed;
    z-index:200;
    left:50%;
    bottom:25px;
    max-width:calc(100% - 30px);
    padding:11px 14px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#1b1b1b;
    color:#ddd;
    font-size:8px;
    font-weight:800;
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,10px);
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}
</style>
</head>

<body>

<main class="page">

<header class="header">

    <button
        id="backButton"
        class="icon-btn"
        type="button"
        aria-label="Back">
        ←
    </button>

    <div class="header-copy">
        <strong>My Rides</strong>
        <span>Active and completed delivery rides</span>
    </div>

    <button
        id="refreshButton"
        class="icon-btn"
        type="button"
        aria-label="Refresh">
        ↻
    </button>

</header>


<div class="filter-row">

    <button
        class="filter active"
        data-filter="all"
        type="button">
        ALL
    </button>

    <button
        class="filter"
        data-filter="active"
        type="button">
        ACTIVE
    </button>

    <button
        class="filter"
        data-filter="completed"
        type="button">
        COMPLETED
    </button>

    <button
        class="filter"
        data-filter="cancelled"
        type="button">
        CANCELLED
    </button>

</div>


<section
    id="activeSection"
    style="display:none;">

    <div class="section-title">
        <strong>Current Ride</strong>
        <span id="activeRideLabel">
            In progress
        </span>
    </div>

    <div
        id="activeContainer">
    </div>

</section>


<section>

    <div class="section-title">
        <strong>Ride History</strong>
        <span id="historyCount">
            0 rides
        </span>
    </div>

    <div
        id="historyContainer">
    </div>

</section>


<section
    id="emptyState"
    class="empty">

    <div class="empty-icon">
        🏍️
    </div>

    <strong id="emptyTitle">
        No rides found
    </strong>

    <span id="emptyDescription">
        Your rides will appear here after you accept a request.
    </span>

</section>


<nav class="bottom-nav">

    <button
        class="nav-item"
        data-page="home.html"
        type="button">
        HOME
    </button>

    <button
        class="nav-item"
        data-page="requests.html"
        type="button">
        REQUESTS
    </button>

    <button
        class="nav-item active"
        data-page="rides.html"
        type="button">
        RIDES
    </button>

    <button
        class="nav-item"
        data-page="profile.html"
        type="button">
        PROFILE
    </button>

</nav>

</main>


<div
    id="loading"
    class="loading">

    <div class="spinner"></div>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>
(function(){

"use strict";


const state = {

    rides:[],

    filter:"all",

    activeRide:null,

    loading:false

};


/* =========================================================
   HELPERS
========================================================= */

const $ =
    id => document.getElementById(id);


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function num(value){

    const n =
        Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}


function money(value){

    return "₹" +
        Math.max(
            0,
            Math.round(
                num(value)
            )
        ).toLocaleString("en-IN");

}


function getApi(){

    return (
        window.GoBikeRideEngine ||
        window.GoBikeDriver ||
        window.GoBikeRides ||
        null
    );

}


function rideId(ride,index){

    return String(
        ride?.id ||
        ride?.rideId ||
        ride?.requestId ||
        "ride-" + index
    );

}


function serviceType(ride){

    return String(
        ride?.serviceType ||
        ride?.rideType ||
        ride?.type ||
        "bike"
    ).toLowerCase();

}


function isParcel(ride){

    return serviceType(ride)
        .includes("parcel");

}


function pickup(ride){

    return (
        ride?.pickupAddress ||
        ride?.pickup?.address ||
        ride?.pickup?.name ||
        ride?.pickupLocation?.address ||
        ride?.from ||
        "Pickup location"
    );

}


function drop(ride){

    return (
        ride?.dropAddress ||
        ride?.drop?.address ||
        ride?.drop?.name ||
        ride?.dropLocation?.address ||
        ride?.to ||
        "Drop location"
    );

}


function distance(ride){

    const d =
        num(
            ride?.distanceKm ??
            ride?.distance ??
            ride?.km
        );

    return d
        ? d.toFixed(d < 10 ? 1 : 0) + " km"
        : "—";

}


function duration(ride){

    const d =
        num(
            ride?.durationMinutes ??
            ride?.duration ??
            ride?.etaMinutes
        );

    return d
        ? Math.round(d) + " min"
        : "—";

}


function earning(ride){

    return num(
        ride?.driverEarning ??
        ride?.driverFare ??
        ride?.driverAmount ??
        ride?.estimatedEarning ??
        ride?.earning ??
        ride?.amount ??
        ride?.fare
    );

}


function rideStatus(ride){

    return String(
        ride?.status ||
        ride?.rideStatus ||
        "completed"
    ).toLowerCase();

}


function normalizeStatus(status){

    if([
        "requested",
        "searching",
        "accepted",
        "arrived",
        "pickup",
        "picked_up",
        "in_progress",
        "ongoing",
        "started"
    ].includes(status)){

        return "active";

    }


    if([
        "cancelled",
        "canceled",
        "rejected"
    ].includes(status)){

        return "cancelled";

    }


    if([
        "completed",
        "complete",
        "finished",
        "delivered"
    ].includes(status)){

        return "completed";

    }


    return status;

}


function dateText(value){

    if(!value){
        return "Recent ride";
    }


    try{

        let date;


        if(
            typeof value.toDate ===
            "function"
        ){

            date =
                value.toDate();

        }else{

            date =
                new Date(value);

        }


        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return "Recent ride";

        }


        return date.toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        );

    }catch(error){

        return "Recent ride";

    }

}


/* =========================================================
   FALLBACK
========================================================= */

function demoRides(){

    return [

        {
            id:"demo-active-001",

            serviceType:"bike",

            pickupAddress:
                "Sector 17, Chandigarh",

            dropAddress:
                "Phase 7, Mohali",

            distanceKm:8.4,

            durationMinutes:22,

            driverEarning:142,

            status:"in_progress",

            otpPickup:"4821",

            otpDrop:"7394",

            createdAt:
                new Date().toISOString()

        },

        {
            id:"demo-completed-002",

            serviceType:"bike",

            pickupAddress:
                "Sector 22, Chandigarh",

            dropAddress:
                "Industrial Area, Mohali",

            distanceKm:7.2,

            durationMinutes:19,

            driverEarning:128,

            status:"completed",

            createdAt:
                new Date(
                    Date.now() -
                    86400000
                ).toISOString()

        },

        {
            id:"demo-completed-003",

            serviceType:"parcel",

            pickupAddress:
                "Phase 3B2, Mohali",

            dropAddress:
                "Kharar",

            distanceKm:10.6,

            durationMinutes:27,

            driverEarning:171,

            status:"completed",

            createdAt:
                new Date(
                    Date.now() -
                    172800000
                ).toISOString()

        }

    ];

}


/* =========================================================
   LOAD RIDES
========================================================= */

async function loadRides(){

    if(state.loading){
        return;
    }


    state.loading =
        true;


    try{

        const api =
            getApi();


        if(api){

            const methods = [

                "getDriverRides",
                "getMyRides",
                "getRides",
                "fetchRides",
                "loadRides"

            ];


            for(
                const method of methods
            ){

                if(
                    typeof api[method] !==
                    "function"
                ){
                    continue;
                }


                try{

                    const result =
                        await api[method]();


                    const rides =
                        Array.isArray(result)
                            ? result
                            : (
                                result?.rides ||
                                result?.data ||
                                []
                            );


                    if(
                        Array.isArray(rides)
                    ){

                        state.rides =
                            rides;

                        state.loading =
                            false;

                        render();

                        return;

                    }

                }catch(error){

                    console.warn(
                        "Go Bike ride loader:",
                        method,
                        error
                    );

                }

            }

        }


        /*
         * Firestore fallback.
         */

        if(
            window.firebase &&
            firebase.firestore
        ){

            const user =
                firebase.auth &&
                firebase.auth().currentUser;


            if(user){

                const snapshot =
                    await firebase
                        .firestore()
                        .collection("rides")
                        .where(
                            "driverId",
                            "==",
                            user.uid
                        )
                        .limit(50)
                        .get();


                state.rides =
                    snapshot.docs.map(
                        doc => ({
                            id:doc.id,
                            ...doc.data()
                        })
                    );


                state.loading =
                    false;

                render();

                return;

            }

        }


        /*
         * Development fallback.
         */

        state.rides =
            demoRides();

    }catch(error){

        console.error(
            "Go Bike rides:",
            error
        );


        if(
            !state.rides.length
        ){

            state.rides =
                demoRides();

        }

    }


    state.loading =
        false;

    render();

}


/* =========================================================
   ACTIVE RIDE
========================================================= */

function findActiveRide(){

    return (
        state.rides.find(
            ride =>
                normalizeStatus(
                    rideStatus(ride)
                ) === "active"
        ) ||
        null
    );

}


/* =========================================================
   ACTIVE CARD
========================================================= */

function renderActive(){

    const section =
        $("activeSection");

    const container =
        $("activeContainer");


    state.activeRide =
        findActiveRide();


    if(
        !state.activeRide
    ){

        section.style.display =
            "none";

        container.innerHTML =
            "";

        return;

    }


    section.style.display =
        "block";


    container.innerHTML =
        createActiveCard(
            state.activeRide
        );


    bindActiveActions(
        state.activeRide
    );

}


function getProgressState(ride){

    const status =
        rideStatus(ride);


    if([
        "accepted",
        "arrived"
    ].includes(status)){

        return 1;

    }


    if([
        "pickup",
        "picked_up",
        "in_progress",
        "ongoing",
        "started"
    ].includes(status)){

        return 2;

    }


    return 1;

}


function createActiveCard(ride){

    const status =
        rideStatus(ride);


    const progress =
        getProgressState(
            ride
        );


    const pickupOtp =
        String(
            ride?.pickupOtp ??
            ride?.pickupOTP ??
            ride?.otpPickup ??
            ride?.pickupVerificationCode ??
            "----"
        );


    const dropOtp =
        String(
            ride?.dropOtp ??
            ride?.dropOTP ??
            ride?.otpDrop ??
            ride?.dropVerificationCode ??
            "----"
        );


    const currentLabel =
        progress === 2
            ? "Going to Drop"
            : "Going to Pickup";


    return `

        <article class="active-card">

            <div class="active-head">

                <div class="service-icon">
                    ${isParcel(ride) ? "📦" : "🏍️"}
                </div>

                <div class="active-title">

                    <strong>
                        ${isParcel(ride)
                            ? "Parcel Delivery"
                            : "Bike Ride"}
                    </strong>

                    <span>
                        ${escapeHtml(
                            ride.customerName ||
                            "Customer"
                        )}
                        • ${currentLabel}
                    </span>

                </div>

                <div class="status">
                    ${escapeHtml(
                        status.replace(
                            /_/g,
                            " "
                        ).toUpperCase()
                    )}
                </div>

            </div>


            <div class="progress">

                <div class="progress-item done">

                    <div class="progress-dot"></div>

                    <span>
                        ACCEPTED
                    </span>

                </div>


                <div class="
                    progress-item
                    ${progress >= 1 ? "current" : ""}
                    ${progress > 1 ? "done" : ""}
                ">

                    <div class="progress-dot"></div>

                    <span>
                        PICKUP
                    </span>

                </div>


                <div class="
                    progress-item
                    ${progress >= 2 ? "current" : ""}
                ">

                    <div class="progress-dot"></div>

                    <span>
                        DROP
                    </span>

                </div>

            </div>


            <div class="route">

                <div class="route-row">

                    <div class="route-dot"></div>

                    <div class="route-copy">

                        <small>
                            PICKUP
                        </small>

                        <strong>
                            ${escapeHtml(
                                pickup(ride)
                            )}
                        </strong>

                    </div>

                </div>


                <div class="route-row">

                    <div class="route-dot drop"></div>

                    <div class="route-copy">

                        <small>
                            DROP
                        </small>

                        <strong>
                            ${escapeHtml(
                                drop(ride)
                            )}
                        </strong>

                    </div>

                </div>

            </div>


            <div class="stats">

                <div class="stat">

                    <strong>
                        ${escapeHtml(
                            distance(ride)
                        )}
                    </strong>

                    <span>
                        Distance
                    </span>

                </div>


                <div class="stat">

                    <strong>
                        ${escapeHtml(
                            duration(ride)
                        )}
                    </strong>

                    <span>
                        ETA
                    </span>

                </div>


                <div class="stat">

                    <strong>
                        ${money(
                            earning(ride)
                        )}
                    </strong>

                    <span>
                        Earning
                    </span>

                </div>

            </div>


            <div class="otp-box">

                <div class="otp-head">

                    <strong>
                        4-Digit Ride OTP
                    </strong>

                    <span>
                        ${progress >= 2
                            ? "DROP OTP"
                            : "PICKUP OTP"}
                    </span>

                </div>


                <div class="otp-digits">

                    ${formatOtp(
                        progress >= 2
                            ? dropOtp
                            : pickupOtp
                    )}

                </div>


                <div class="otp-note">
                    Ask the customer for the correct
                    4-digit OTP before starting/completing
                    the applicable trip stage.
                </div>

            </div>


            <div class="actions">

                <button
                    class="action"
                    data-active-action="cancel"
                    type="button">
                    CANCEL
                </button>

                <button
                    class="action primary"
                    data-active-action="navigate"
                    type="button">
                    ${progress >= 2
                        ? "NAVIGATE TO DROP"
                        : "NAVIGATE TO PICKUP"}
                </button>

            </div>

        </article>
    `;

}


function formatOtp(otp){

    const clean =
        String(
            otp || "----"
        )
        .replace(
            /\D/g,
            ""
        )
        .slice(
            0,
            4
        );


    const digits =
        clean
        .padEnd(
            4,
            "-"
        )
        .split("");


    return digits.map(
        digit => `
            <div class="otp-digit">
                ${escapeHtml(digit)}
            </div>
        `
    ).join("");

}


/* =========================================================
   ACTIVE ACTIONS
========================================================= */

function bindActiveActions(ride){

    const cancel =
        document.querySelector(
            '[data-active-action="cancel"]'
        );


    const navigate =
        document.querySelector(
            '[data-active-action="navigate"]'
        );


    if(cancel){

        cancel.addEventListener(
            "click",
            () =>
                cancelRide(
                    ride
                )
        );

    }


    if(navigate){

        navigate.addEventListener(
            "click",
            () =>
                openNavigation(
                    ride
                )
        );

    }

}


/* =========================================================
   NAVIGATION
========================================================= */

function openNavigation(ride){

    const id =
        rideId(
            ride,
            0
        );


    const status =
        rideStatus(ride);


    let stage =
        "pickup";


    if([
        "pickup",
        "picked_up",
        "in_progress",
        "ongoing",
        "started"
    ].includes(status)){

        stage =
            "drop";

    }


    try{

        sessionStorage.setItem(
            "goBikeActiveRideId",
            id
        );

        sessionStorage.setItem(
            "goBikeActiveRide",
            JSON.stringify(
                ride
            )
        );

    }catch(error){}


    location.href =
        "live-map.html?rideId=" +
        encodeURIComponent(id) +
        "&stage=" +
        encodeURIComponent(stage);

}


/* =========================================================
   CANCEL
========================================================= */

async function cancelRide(ride){

    const confirmed =
        window.confirm(
            "Are you sure you want to cancel this ride?"
        );


    if(!confirmed){
        return;
    }


    const id =
        rideId(
            ride,
            0
        );


    try{

        const api =
            getApi();


        if(
            api &&
            typeof api.cancelRide ===
            "function"
        ){

            await api.cancelRide(
                id,
                {
                    reason:
                        "Driver cancelled"
                }
            );

        }else if(
            window.firebase &&
            firebase.firestore
        ){

            await firebase
                .firestore()
                .collection("rides")
                .doc(id)
                .update({

                    status:"cancelled",

                    cancelledBy:
                        "driver",

                    cancelledAt:
                        new Date(),

                    cancellationReason:
                        "Driver cancelled"

                });

        }


        showToast(
            "Ride cancelled."
        );


        await loadRides();

    }catch(error){

        console.error(
            "Go Bike cancel:",
            error
        );


        showToast(
            error?.message ||
            "Unable to cancel ride."
        );

    }

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

    const container =
        $("historyContainer");


    let rides =
        state.rides.filter(
            ride => {

                const normalized =
                    normalizeStatus(
                        rideStatus(ride)
                    );


                if(
                    state.filter ===
                    "all"
                ){

                    return normalized !==
                        "active";

                }


                return normalized ===
                    state.filter;

            }
        );


    $("historyCount")
        .textContent =
        rides.length +
        (
            rides.length === 1
                ? " ride"
                : " rides"
        );


    container.innerHTML =
        rides
            .map(
                (ride,index) =>
                    createHistoryCard(
                        ride,
                        index
                    )
            )
            .join("");


    const shouldShowEmpty =
        !rides.length;


    if(shouldShowEmpty){

        if(
            state.filter ===
            "active"
        ){

            showEmpty(
                "No active rides",
                "Accepted rides will appear in the current ride section."
            );

        }else{

            showEmpty(
                "No rides found",
                "Your ride history will appear here."
            );

        }

    }else{

        $("emptyState")
            .classList.remove(
                "show"
            );

    }

}


function createHistoryCard(
    ride,
    index
){

    const status =
        normalizeStatus(
            rideStatus(ride)
        );


    let label =
        status.toUpperCase();


    if(
        status ===
        "completed"
    ){

        label =
            "COMPLETED";

    }


    return `

        <article class="ride-card">

            <div class="ride-top">

                <div class="ride-service">
                    ${isParcel(ride)
                        ? "📦"
                        : "🏍️"}
                </div>

                <div class="ride-info">

                    <strong>
                        ${isParcel(ride)
                            ? "Parcel Delivery"
                            : "Bike Ride"}
                    </strong>

                    <span>
                        ${escapeHtml(
                            dateText(
                                ride.createdAt ||
                                ride.completedAt ||
                                ride.requestedAt
                            )
                        )}
                    </span>

                </div>

                <div class="
                    ride-status
                    ${status}
                ">
                    ${label}
                </div>

            </div>


            <div class="ride-route">

                <div class="location">

                    <div class="location-dot"></div>

                    <span>
                        ${escapeHtml(
                            pickup(ride)
                        )}
                    </span>

                </div>


                <div class="location">

                    <div class="
                        location-dot
                        drop
                    "></div>

                    <span>
                        ${escapeHtml(
                            drop(ride)
                        )}
                    </span>

                </div>

            </div>


            <div class="ride-bottom">

                <div class="ride-date">

                    ${escapeHtml(
                        distance(ride)
                    )}

                    •

                    ${escapeHtml(
                        duration(ride)
                    )}

                </div>

                <div class="ride-earning">

                    ${money(
                        earning(ride)
                    )}

                </div>

            </div>

        </article>
    `;

}


/* =========================================================
   FILTER
========================================================= */

function applyFilter(){

    document
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.filter ===
                    state.filter
                );

            }
        );


    renderActive();

    renderHistory();

}


/* =========================================================
   EMPTY
========================================================= */

function showEmpty(
    title,
    description
){

    $("emptyTitle")
        .textContent =
        title;

    $("emptyDescription")
        .textContent =
        description;

    $("emptyState")
        .classList.add(
            "show"
        );

}


/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

    applyFilter();

}


/* =========================================================
   REALTIME BRIDGE
========================================================= */

function connectRealtime(){

    const api =
        getApi();


    if(!api){
        return;
    }


    const methods = [

        "subscribeToDriverRides",
        "subscribeToRides",
        "listenForRides",
        "onDriverRides",
        "watchRides"

    ];


    for(
        const method of methods
    ){

        if(
            typeof api[method] !==
            "function"
        ){
            continue;
        }


        try{

            api[method](
                rides => {

                    if(
                        Array.isArray(
                            rides
                        )
                    ){

                        state.rides =
                            rides;

                        render();

                    }

                }
            );


            break;

        }catch(error){

            console.warn(
                "Go Bike realtime rides:",
                error
            );

        }

    }

}


/* =========================================================
   FILTER EVENTS
========================================================= */

document
    .querySelectorAll(
        ".filter"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    state.filter =
                        this.dataset.filter ||
                        "all";

                    applyFilter();

                }
            );

        }
    );


/* =========================================================
   NAVIGATION EVENTS
========================================================= */

document
    .querySelectorAll(
        ".nav-item"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    const page =
                        this.dataset.page;


                    if(page){

                        location.href =
                            page;

                    }

                }
            );

        }
    );


$("backButton")
    .addEventListener(
        "click",
        function(){

            if(
                document.referrer &&
                document.referrer.includes(
                    "/rider/"
                )
            ){

                history.back();

            }else{

                location.href =
                    "home.html";

            }

        }
    );


$("refreshButton")
    .addEventListener(
        "click",
        async function(){

            if(state.loading){
                return;
            }


            this.disabled =
                true;

            this.textContent =
                "…";


            await loadRides();


            this.disabled =
                false;

            this.textContent =
                "↻";


            showToast(
                "Rides refreshed."
            );

        }
    );


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message){

    const toast =
        $("toast");


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2400
        );

}


/* =========================================================
   INIT
========================================================= */

async function init(){

    await loadRides();

    connectRealtime();


    /*
     * Resilience refresh.
     * The real-time ride engine remains the
     * primary source when available.
     */

    setInterval(
        () => {

            if(
                document.visibilityState ===
                "visible"
            ){

                loadRides();

            }

        },
        20000
    );


    $("loading")
        .classList.add(
            "hide"
        );

}


init();

})();
</script>
